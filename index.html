    if(it.fromHolder&&emp(it.fromHolder)){u.status='Personelde';u.holderId=it.fromHolder;u.warehouseId=null;}
    else{u.status='Depoda';u.warehouseId=wh(it.fromWh)?it.fromWh:((db.warehouses[0]||{}).id||null);u.holderId=null;}
    u.note='';delete u.saleId;u.log.push({date:TODAY,text:'Satış iptal edildi, stoğa geri alındı'});});
  db.sales=db.sales.filter(x=>x.id!==id);
}

/* ----- Satış hedefleri -----
   Hedefler aya bağlıdır. Bir ay için kayıt yoksa o aydan ÖNCEKİ en son
   kayıt devreder: Haziran'da girilen hedef, Eylül'de yenisi girilene
   kadar geçerli kalır. Hiç aylık kayıt yoksa month='' olan başlangıç
   satırı kullanılır — eski kayıtların hepsi budur, yani aylık hedef
   girilmeden davranış eskisiyle aynıdır.

   Böylece geçmiş ayların tutturma oranı sabit kalır: bugün hedefi
   değiştirmek Eylül'ün sonucunu artık bozmuyor. */
function getTarget(empId,katId,period){
  const hepsi=db.targets.filter(x=>x.employeeId===empId&&x.kat===katId);
  if(!hepsi.length)return {value:0,exempt:false,defined:false,month:'',devir:false};
  const ay=(period&&period!=='all')?period:'';
  const aylik=hepsi.filter(x=>x.month&&(!ay||x.month<=ay))
                   .sort((a,b)=>a.month<b.month?1:-1);
  const t=aylik[0]||hepsi.find(x=>!x.month);
  if(!t)return {value:0,exempt:false,defined:false,month:'',devir:false};
  return {value:t.value,exempt:t.exempt,defined:true,month:t.month,
          /* devir: bu ayın kendi kaydı değil, önceki bir aydan geliyor */
          devir:!!ay&&t.month!==ay};
}
/* Seçilen ayın KENDİ kaydı var mı (düzenleme penceresi için) */
const ayinKendiHedefi=(empId,katId,ay)=>
  (ay&&ay!=='all')?db.targets.find(x=>x.employeeId===empId&&x.kat===katId&&x.month===ay):null;
function isConverted(customerId,fromDate){
  return !!customerId&&db.sales.some(s=>s.customerId===customerId&&s.date>=fromDate);
}
/* Randevudan satış çıktı mı?
   Normalde satış kayıtlarından anlaşılır. Ama satışı BAŞKASI yaptıysa
   satır yetkisi o kaydı randevuyu alana hiç indirmez; kendi
   dönüşümünü göremez, üstelik "Satış beyanı" uyarısı alırdı.
   Bu yüzden sunucudan ayrıca "kendi randevularımdan hangileri satışa
   döndü" bilgisini de alıyoruz (randevu_donusumlerim). İnen tek şey
   randevu kimliği ve satış tarihi; tutar, ürün ve satışı yapan kişi
   inmiyor. İşlev kurulu değilse liste boş gelir, davranış eskisi
   gibi kalır. */
let _donusum={};
function donusumKur(satirlar){
  _donusum={};
  (satirlar||[]).forEach(x=>{if(x&&x.appt_id)_donusum[x.appt_id]=x.satis_tarihi||'';});
}
const donustu=a=>!!a&&(_donusum[a.id]!==undefined||isConverted(a.customerId,a.date));
const donusumTarihi=a=>(a&&_donusum[a.id])||'';
function realizedFor(empId,katId,period){
  const kat=hedefKat(katId);if(!kat)return 0;
  if(kat.kind==='randevu')return db.appointments.filter(a=>alanOf(a)===empId&&inPeriod(a,period)&&!iptalMi(a)).length;
  if(kat.kind==='donusum')return db.appointments.filter(a=>alanOf(a)===empId&&inPeriod(a,period)&&!iptalMi(a)&&donustu(a)).length;
  /* Bir satış iki hedefe birden sayılabilir:
       · ürünün BİRİNCİ hedef kategorisi (hedefKat)
       · ürünün İKİNCİ hedef kategorisi (hedefKat2) — tarife tarife
         seçilir; örneğin bazı mobil tarifeler hem puan hem adet
         hedefine yazılır.
     Kategori düzeyindeki eski "kaynak" yolu da duruyor: o, kaynak
     kategorinin BÜTÜN ürünlerini ikinci hedefe taşır. */
  const kaynak=kat.kaynak||katId;
  const rows=salesIn(period).filter(s=>s.employeeId===empId&&
    (s.hedefKat===kaynak||s.hedefKat2===kaynak));
  if(kat.kind==='puan')return sum(rows.map(s=>({amount:s.puan})));
  /* Satış adedi: satırdaki adet toplanır. Mobilde hat sayısı,
     DSL ve PSTN'de hizmet numarası sayısı bu alana yazılıyor. */
  if(kat.kind==='adet')return sum(rows.map(s=>({amount:num(s.qty)})));
  return sum(rows.map(s=>({amount:s.amount||0})));
}
function hedefCell(empId,kat,period){
  const t=getTarget(empId,kat.id,period);
  /* Tüm dönemler seçiliyken hedef düzenlenmez: değerin hangi aya
     yazılacağı belirsiz olur. */
  const yz=hedefYazabilir(empId)&&period!=='all';
  /* Değer bu ayın kendi kaydı değil de önceki bir aydan devrediyorsa
     küçük bir im konur; aynı rakamı her ay yeniden girdiğinizi
     sanmayın diye. */
  const im=(t.defined&&t.devir)
    ?' <span class="muted sm" title="'+(t.month?esc(monthLabel(t.month))+' hedefinden devrediyor':'Başlangıç hedefi')+'">↳</span>':'';
  const sar=(ic)=>yz
    ?'<button class="hcell" data-act="open-target" data-emp="'+empId+'" data-kat="'+kat.id+'">'+ic+im+'</button>'
    :'<div class="hcell salt">'+ic+im+'</div>';
  const r=realizedFor(empId,kat.id,period);
  if(t.exempt)return sar('<span class="badge">Muaf</span>'+
    (r?'<span class="muted sm">'+(kat.kind==='tutar'?money(r):nf.format(r))+'</span>':''));
  /* Hedef girilmemiş olması gerçekleşen satışı gizlememeli:
     satış varsa değeri göster, hedefin yokluğunu not düş. */
  if(!t.defined){
    if(!r)return sar('<span class="muted sm">Hedef yok</span>');
    const d=kat.kind==='tutar'?money(r):nf.format(r);
    return sar('<b>'+d+'</b><span class="muted sm">hedef yok</span>');
  }
  const pc=pct(r,t.value),fmt=kat.kind==='tutar'?money(r)+' / '+money(t.value):nf.format(r)+' / '+nf.format(t.value);
  return sar('<b class="'+(pc>=100?'in':'')+'">%'+pc+'</b><span class="hbar"><span style="width:'+clamp(pc,0,100)+'%"></span></span><span class="muted sm">'+fmt+'</span>');
}
/* Bir grup personelin bir hedef kategorisindeki toplamı.
   Muaf tutulanlar hedefe de gerçekleşmeye de katılmaz. */
/* Hedefi kim değiştirebilir? Veri tabanındaki kuralla (tg_wri) aynı:
   master/bayi müdürü herkesin, birim müdürü ve telesatış takım lideri
   kendi ekibinin. Yetkisi olmayana tıklanabilir hücre hiç verilmez. */
function hedefYazabilir(empId){
  if(isUst())return true;
  return (isBirim()||isTLider())&&ekipte(empId);
}
function hedefToplam(list,kat,period){
  let hedef=0,gercek=0,sayi=0,muaf=0;
  list.forEach(e=>{
    const t=getTarget(e.id,kat.id,period);
    if(t.exempt){muaf++;return;}
    if(t.defined){hedef+=t.value;sayi++;}
    gercek+=realizedFor(e.id,kat.id,period);
  });
  return {hedef,gercek,sayi,muaf};
}
function toplamHucre(list,kat,period){
  const t=hedefToplam(list,kat,period);
  if(!t.sayi)return '<span class="muted sm">—</span>';
  const pc=pct(t.gercek,t.hedef);
  const fmt=kat.kind==='tutar'?money(t.gercek)+' / '+money(t.hedef)
                              :nf.format(t.gercek)+' / '+nf.format(t.hedef);
  return '<b class="'+(pc>=100?'in':'')+'">%'+pc+'</b><div class="muted sm">'+fmt+'</div>';
}
/* toplamGoster=false: yalnızca kendi hedefini gören personel için.
   Tek kişilik listede "birim toplamı" satırı, kişinin kendi rakamını
   birimin toplamıymış gibi gösteriyordu. */
/* Hedef tablosunda personel önce departmanına, sonra adına göre
   sıralanır; saha, telesatış ve satış destek iç içe geçmesin.
   Departmanı girilmemiş olanlar en sona iner. */
/* Kişinin ait olduğu birim. Müdür ve takım liderinin personel
   kaydındaki birim alanı boş veya farklı olabiliyor; yönettikleri
   birim önce gelir. birim_kapsamim() ile aynı öncelik sırası. */
function personelBirimi(e){
  if(!e)return null;
  const bl=db.birimler||[];
  const y=bl.find(b=>b.mudurId===e.id)||bl.find(b=>b.tliderId===e.id);
  return y?y.id:(e.birimId||null);
}
const departmanAdi=e=>(dept(e.departmentId)||{}).name||'';
function personelSirasi(a,b){
  const da=departmanAdi(a),db2=departmanAdi(b);
  if(!da!==!db2)return da?-1:1;
  return da.localeCompare(db2,'tr',SAYISAL)||a.name.localeCompare(b.name,'tr',SAYISAL);
}
/* ---------- Kişisel hedef görünümü ----------
   Saha ve telesatış personelinde bütün kategorileri listelemek
   anlamsızdı; ekranın çoğu "Hedef yok" yazıyordu. Artık yalnızca
   hedef tanımlanmış ya da o dönemde satış yapılmış kalemler çıkar. */
function kisiselKatlar(empId,period){
  return HEDEF_KATS.filter(k=>{
    const t=getTarget(empId,k.id,period);
    return t.defined||t.exempt||realizedFor(empId,k.id,period)>0;
  });
}
/* Telefonda tablo yerine kutucuklar */
function hedefKartlar(empId,period){
  const kats=kisiselKatlar(empId,period);
  if(!kats.length)return '';
  return '<div class="hdf-kartlar">'+kats.map(k=>{
    const t=getTarget(empId,k.id,period),r=realizedFor(empId,k.id,period);
    const bic=v=>k.kind==='tutar'?money(v):nf.format(v);
    if(t.exempt)return '<div class="hdf-kart muaf"><span class="hk-ad">'+esc(k.name)+'</span>'+
      '<span class="hk-deger">'+bic(r)+'</span><span class="hk-alt">Bu hedeften muafsınız</span></div>';
    if(!t.defined)return '<div class="hdf-kart"><span class="hk-ad">'+esc(k.name)+'</span>'+
      '<span class="hk-deger">'+bic(r)+'</span><span class="hk-alt">hedef girilmemiş</span></div>';
    const yuzde=pct(r,t.value),tam=yuzde>=100;
    return '<div class="hdf-kart'+(tam?' tamam':'')+'">'+
      '<span class="hk-ad">'+esc(k.name)+'</span>'+
      '<span class="hk-deger">'+bic(r)+'<small> / '+bic(t.value)+'</small></span>'+
      '<span class="hk-bar"><span style="width:'+clamp(yuzde,0,100)+'%"></span></span>'+
      /* Kutucuk dar; devir bilgisi masaüstü tablosunda ↳ imiyle duruyor */
      '<span class="hk-alt'+(tam?' tamam':'')+'">%'+yuzde+(tam?' · hedef tamam':'')+'</span>'+
    '</div>';}).join('')+'</div>';
}
/* Masaüstü tablosu — yalnızca kişinin kendi kalemleri */
function kisiselHedefTablo(empId,period){
  const kats=kisiselKatlar(empId,period);
  if(!kats.length)return '';
  return '<div class="scroll"><table><thead><tr><th>Personel</th>'+
    kats.map(k=>'<th class="num">'+esc(k.name)+'</th>').join('')+'</tr></thead><tbody>'+
    '<tr><td><div>'+esc((emp(empId)||{}).name||'')+'</div><div class="muted sm">'+
      esc((dept((emp(empId)||{}).departmentId)||{}).name||'')+'</div></td>'+
    kats.map(k=>'<td class="num">'+hedefCell(empId,k,period)+'</td>').join('')+
    '</tr></tbody></table></div>';
}
function hedefGrubu(baslik,altBaslik,list,period,toplamGoster){
  if(!list.length)return '';
  const toplamVar=toplamGoster!==false;
  const sirali=list.slice().sort(personelSirasi);
  return '<section class="panel"><div class="panel-h"><div><h2>'+esc(baslik)+'</h2>'+
    (altBaslik?'<p class="muted sm">'+esc(altBaslik)+'</p>':'')+'</div>'+
    (toplamVar?'<span class="muted sm">'+sirali.length+' personel</span>':'')+'</div>'+
    '<div class="scroll"><table><thead><tr><th>Personel</th>'+
    HEDEF_KATS.map(k=>'<th class="num">'+esc(k.name)+'</th>').join('')+'</tr></thead><tbody>'+
    (toplamVar?'<tr class="total-top"><td>'+esc(baslik)+' toplamı</td>'+
      HEDEF_KATS.map(k=>'<td class="num">'+toplamHucre(sirali,k,period)+'</td>').join('')+'</tr>':'')+
    sirali.map(e=>'<tr><td><div>'+esc(e.name)+'</div><div class="muted sm">'+esc((dept(e.departmentId)||{}).name||'')+'</div></td>'+
      HEDEF_KATS.map(k=>'<td class="num">'+hedefCell(e.id,k,period)+'</td>').join('')+'</tr>').join('')+
    '</tbody></table></div></section>';
}
/* Birimleri yan yana karşılaştıran özet tablo */
function genelToplamBolumu(gorunur,birimler,period){
  const gruplar=birimler.map(b=>({ad:b.name,list:gorunur.filter(e=>e.birimId===b.id)}))
    .filter(g=>g.list.length);
  if(gruplar.length<2)return '';
  return '<section class="panel"><div class="panel-h"><h2>Birim karşılaştırması</h2>'+
    '<span class="muted sm">'+(period==='all'?'Tüm dönemler':monthLabel(period))+'</span></div>'+
    '<div class="scroll"><table><thead><tr><th>Birim</th>'+
    HEDEF_KATS.map(k=>'<th class="num">'+esc(k.name)+'</th>').join('')+'</tr></thead><tbody>'+
    '<tr class="total-top"><td>Genel toplam</td>'+
      HEDEF_KATS.map(k=>'<td class="num">'+toplamHucre(gorunur,k,period)+'</td>').join('')+'</tr>'+
    gruplar.map(g=>'<tr><td><div>'+esc(g.ad)+'</div><div class="muted sm">'+g.list.length+' personel</div></td>'+
      HEDEF_KATS.map(k=>'<td class="num">'+toplamHucre(g.list,k,period)+'</td>').join('')+'</tr>').join('')+
    '</tbody></table></div></section>';
}
function viewHedef(){
  if(!db.employees.length)return emptyView('Satış hedefleri','Her personelin kategori bazında aylık hedefi belirlenir; bazı personeller belirli hedeflerden muaf tutulabilir.','','Personel eklendiğinde hedef tablosu burada görünür.');
  const p=state.period;
  /* Kimin hedeflerini görebiliyorum */
  /* Hedef ekranında birim müdürü ve takım lideri de listelenir; onların
     da hedefi var. Burada bilerek ekipSuzgeci kullanılmıyor: o süzgeç
     (sahaPersoneliMi üzerinden) yönetici ve liderleri eliyor, çünkü
     havuz dağıtımı gibi yerlerde "saf saha ekibi" gerekiyor. */
  const gorunur=aktifPersonel().filter(e=>isUst()||isMuhasebe()
    ||((isBirim()||isTLider())&&ekipte(e.id))
    ||e.id===me.employeeId);
  /* Yalnızca kendi hedefini gören personele birim toplamı gösterilmez */
  if(!(isUst()||isMuhasebe()||isBirim()||isTLider()))
    {
    const ben=me.employeeId;
    const kartlar=ben?hedefKartlar(ben,p):'';
    const tablo=ben?kisiselHedefTablo(ben,p):'';
    return head('Satış hedefleri','Seçtiğiniz ayın hedefi ve o ayki gerçekleşmeniz. Yalnızca hedef aldığınız ya da satış yaptığınız kalemler listelenir.',periodSel())+
      '<div class="stack"><section class="panel"><div class="panel-h"><div><h2>Hedeflerim</h2>'+
        '<p class="muted sm">'+(p==='all'?'Tüm dönemler':monthLabel(p))+'</p></div></div>'+
      (kartlar
        ?'<div class="hdf-kart-alan">'+kartlar+'</div><div class="hdf-tablo-alan">'+tablo+'</div>'
        :'<div class="empty">Bu dönemde hedefiniz ya da satışınız yok.</div>')+
      '</section></div>'+
      '<p class="hint" style="margin-top:10px">Hedefler aya bağlıdır; bir ay için ayrı hedef girilmemişse en son girilen hedef devreder. Gerçekleşme, seçtiğiniz dönemdeki satışlarınızdan hesaplanır.</p>';
    }
  const birimler=(db.birimler||[]).slice().sort((a,b)=>a.name.localeCompare(b.name,'tr',SAYISAL));
  const bloklar=birimler.map(b=>hedefGrubu(b.name,
      [((emp(b.mudurId)||{}).name?'Birim müdürü: '+(emp(b.mudurId)||{}).name:'Birim müdürü atanmadı'),
       ((emp(b.tliderId)||{}).name?'Telesatış lideri: '+(emp(b.tliderId)||{}).name:'')].filter(Boolean).join(' · '),
      gorunur.filter(e=>personelBirimi(e)===b.id),p)).join('');
  const birimsiz=gorunur.filter(e=>{const k=personelBirimi(e);
    return !k||!byId(db.birimler,k);});
  const katBtn=isFinans()?'<button class="btn" data-act="open-hedefkats">Kategoriler</button>':'';
  return head('Satış hedefleri','Önce birim toplamları, altında birim birim personel hedefleri. Hedefler aya bağlıdır: bir hücreye tıklayıp seçili ayın hedefini girin, sonraki aylar yenisi girilene kadar o hedefi devralır. ↳ imi, değerin önceki bir aydan devrettiğini gösterir.'+(state.period==='all'?' Düzenlemek için bir ay seçin.':''),periodSel()+katBtn)+
  '<div class="stack">'+
  (birimler.length>1?genelToplamBolumu(gorunur,birimler,p):'')+
  (bloklar||'<div class="empty">Henüz birim tanımlanmadı. Şirket ve birimler sayfasından birim ekleyip personeli birimlere bağlayın.</div>')+
  hedefGrubu('Birime bağlı olmayan personel','Bu kişileri Personel sayfasından bir birime bağlayın',birimsiz,p)+
  '</div>'+
  '<p class="hint" style="margin-top:10px">Hedefler her ay aynı değerle tekrar eder, belirli bir aya özel girilmez. Gerçekleşme, seçtiğiniz dönemdeki satışlardan hesaplanır. Toplam satırında muaf tutulan personel sayılmaz.</p>';
}
/* ----- Hedef kategorileri ----- */
function katKullanim(id){
  return {hedef:(db.targets||[]).filter(t=>t.kat===id).length,
          urun:(db.products||[]).filter(p=>p.hedefKat===id||p.hedefKat2===id).length,
          satis:(db.sales||[]).filter(x=>x.hedefKat===id||x.hedefKat2===id).length};
}
/* Kimlik, hedef ve ürün kayıtlarında metin olarak saklanır; Türkçe
   harfleri önce karşılıklarına katlıyoruz, yoksa "taahhüt" -> "taahh_t"
   gibi okunaksız kimlikler çıkıyor. */
const KAT_HARF={'ş':'s','ğ':'g','ü':'u','ö':'o','ç':'c','ı':'i','İ':'i','I':'i'};
function katKimlik(ad){
  const katlanmis=String(ad||'').replace(/[şğüöçıİI]/g,c=>KAT_HARF[c]||c);
  const taban=trl(katlanmis).replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,24)||'kat';
  let id=taban,n=2;
  while(TUM_KATS.some(k=>k.id===id)){id=taban+'_'+n;n++;}
  return id;
}
function openHedefKats(){
  if(!isFinans())return needDlg('Hedef kategorileri','Kategorileri yalnızca Master ve Muhasebe değiştirebilir.');
  dlgState={kind:'hedefkats'};
  const satirlar=TUM_KATS.map(k=>{
    const u=katKullanim(k.id),bagli=u.hedef+u.urun+u.satis;
    return '<tr><td><div>'+esc(k.name)+'</div><div class="muted sm">'+esc(k.id)+'</div></td>'+
      '<td>'+esc((KAT_TURLERI.find(t=>t[0]===k.kind)||['','?'])[1].split(' — ')[0])+
        (k.kaynak?'<div class="muted sm">kaynak: '+esc((hedefKat(k.kaynak)||{}).name||k.kaynak)+'</div>':'')+'</td>'+
      '<td class="num">'+k.sira+'</td>'+
      '<td>'+(k.aktif?'<span class="badge ok">Aktif</span>':'<span class="badge">Pasif</span>')+'</td>'+
      '<td class="muted sm">'+(bagli?u.hedef+' hedef · '+u.urun+' ürün · '+u.satis+' satış':'kullanılmıyor')+'</td>'+
      '<td class="num nowrap"><button class="btn sm" data-act="open-hedefkat" data-id="'+esc(k.id)+'">Düzenle</button></td></tr>';
  }).join('');
  openDlg(dlgHtml('Hedef kategorileri',
    '<p class="hint">Kategoriler hedef tablosunun sütunlarıdır. Pasife alınan kategori ekranlardan kalkar ama geçmiş hedef ve satışlar bozulmaz.</p>'+
    '<div class="scroll"><table><thead><tr><th>Kategori</th><th>Tür</th><th class="num">Sıra</th><th>Durum</th><th>Kullanım</th><th></th></tr></thead><tbody>'+
    (satirlar||'<tr><td colspan="6"><div class="empty">Kategori yok.</div></td></tr>')+
    '</tbody></table></div>',
    '<button class="btn" data-act="close">Kapat</button>'+
    '<button class="btn primary" data-act="open-hedefkat">Kategori ekle</button>'));
}

  const u=id?katKullanim(id):{hedef:0,urun:0,satis:0};
  const bagli=u.hedef+u.urun+u.satis;
  const sonSira=TUM_KATS.reduce((m,x)=>Math.max(m,x.sira||0),0)+10;
  openDlg(dlgHtml(id?'Kategoriyi düzenle':'Kategori ekle','<div class="fields">'+
    '<div class="field full"><label for="hk-ad">Kategori adı</label>'+
      '<input id="hk-ad" type="text" value="'+esc(k?k.name:'')+'" placeholder="Örn. Fiber Puan"></div>'+
    '<div class="field full"><label for="hk-tur">Tür</label><select id="hk-tur"'+(bagli?' disabled':'')+'>'+

function saveHedefKat(){
  const err=m=>{$('#hk-err').textContent=m;};
  const ad=norm($('#hk-ad').value),id=dlgState.id;
  const tur=($('#hk-tur')||{}).value||(id?(hedefKat(id)||{}).kind:'puan');
  const sira=Math.round(Number($('#hk-sira').value)||0);
  const birim=norm($('#hk-birim').value)||KAT_BIRIM[tur]||'puan';
  const aktif=!!$('#hk-aktif').checked;
  if(!ad)return err('Kategori adını girin.');
  if(TUM_KATS.some(k=>k.id!==id&&same(k.name,ad)))return err('Bu adla bir kategori zaten var.');
  const kaynak=(($('#hk-kaynak')||{}).value)||null;
  if(kaynak&&['randevu','donusum'].indexOf(tur)>=0)
    return err('Randevu ve dönüşüm türleri satıştan hesaplanmaz; kaynak kategori seçilemez.');
  const row={name:ad,unit:birim,kind:tur,sira,aktif,kaynak};
  run('hk-err',async()=>{
    if(id)await upd('hedef_kat',id,row);
    else{
      const yeni={...row,id:katKimlik(ad)};
      const r=await sb.from('hedef_kat').insert({...yeni,created_by:me.userId}).select().single();
      if(r.error)throw new Error(dbErr(r.error));
    }
  },'Kategori kaydedildi',()=>openHedefKats());
}
function delHedefKat(id){
  run(null,async()=>{
    const r=await sb.from('hedef_kat').delete().eq('id',id).select('id');
    if(r.error)throw new Error(dbErr(r.error));
    if(!r.data||!r.data.length)
      throw new Error('Kategori silinemedi: kullanımda olabilir ya da yetkiniz yok. Silmek yerine pasife alın.');
  },'Kategori silindi',()=>openHedefKats());
}
function openTarget(empId,katId){
  const kat=hedefKat(katId),e=emp(empId);if(!kat||!e)return;
  if(!hedefYazabilir(empId))return;   /* yetkisizde pencere hiç açılmaz */
  const ay=state.period;
  if(ay==='all')return needDlg('Hedef',
    'Hedefler aya bağlıdır. Düzenlemek için üstteki dönem kutusundan bir ay seçin.');
  const t=getTarget(empId,katId,ay);
  const kendi=ayinKendiHedefi(empId,katId,ay);
  dlgState={kind:'target',emp:empId,kat:katId,ay};
  /* Değer nereden geliyor: bu ayın kendi kaydı mı, devir mi, başlangıç mı */
  const kaynak=kendi
    ?'<b>'+esc(monthLabel(ay))+'</b> için ayrı hedef tanımlı.'
    :t.defined
      ?(t.month
          ?'Şu an <b>'+esc(monthLabel(t.month))+'</b> hedefi devrediyor.'
          :'Şu an <b>başlangıç hedefi</b> geçerli (aya bağlı değil).')
      :'Bu kategori için henüz hedef girilmemiş.';
  openDlg(dlgHtml('Hedef: '+e.name,
    '<p class="muted" style="margin-bottom:10px">'+esc(kat.name)+' · <b>'+esc(monthLabel(ay))+'</b></p>'+
    '<div class="ro-banner" style="margin-bottom:12px">'+kaynak+
      '<div class="sm">Kaydettiğiniz değer '+esc(monthLabel(ay))+' ayından itibaren geçerli olur; sonraki bir ay için ayrıca hedef girerseniz o aydan itibaren yenisi devreye girer. Geçmiş aylar etkilenmez.</div></div>'+
    '<div class="fields">'+
      '<div class="field full"><label style="display:flex;gap:8px;align-items:center;font-weight:400">'+
        '<input id="tg-exempt" type="checkbox" style="width:auto"'+(t.exempt?' checked':'')+'> Bu personel bu hedeften muaf</label></div>'+
      '<div class="field full"><label for="tg-val">'+esc(monthLabel(ay))+' hedefi ('+esc(kat.unit)+')</label>'+
        '<input id="tg-val" type="number" min="0" step="'+(kat.kind==='tutar'?'0.01':'1')+'" value="'+(t.value||'')+'"'+(t.exempt?' disabled':'')+'></div>'+
    '</div><p class="err" id="tg-err"></p>',
    '<button class="btn" data-act="close">Vazgeç</button>'+
    (kendi?'<button class="btn danger" data-act="del-target">Bu ayın hedefini kaldır</button>':'')+
    '<button class="btn primary" data-act="save-target">Kaydet</button>'));
}
function saveTarget(){
  const exempt=!!$('#tg-exempt').checked,val=parseFloat(String($('#tg-val').value).replace(',','.'))||0,err=m=>{$('#tg-err').textContent=m;};
  if(!exempt&&val<0)return err('Hedef negatif olamaz.');
  const {emp:empId,kat:katId,ay}=dlgState;
  if(!ay||ay==='all')return err('Hedefin ait olduğu ay belirlenemedi. Pencereyi kapatıp bir ay seçin.');
  run('tg-err',async()=>{
    const r=await sb.from('targets').upsert({employee_id:empId,kat:katId,month:ay,
      value:exempt?0:val,exempt,updated_by:me.userId,updated_at:new Date().toISOString()},
      {onConflict:'employee_id,kat,month'});
    if(r.error)throw r.error;
  },monthLabel(ay)+' hedefi kaydedildi');
}
/* Bu ayın kendi kaydını siler; değer yeniden önceki aydan devreder */
function delTarget(){
  const {emp:empId,kat:katId,ay}=dlgState;
  const kendi=ayinKendiHedefi(empId,katId,ay);
  if(!kendi)return;
  run('tg-err',async()=>{
    const r=await sb.from('targets').delete().eq('id',kendi.id).select('id');
    if(r.error)throw new Error(dbErr(r.error));
    if(!r.data||!r.data.length)
      throw new Error('Hedef kaldırılamadı: bu kayıt üzerinde yetkiniz yok.');
  },monthLabel(ay)+' hedefi kaldırıldı');
}

function custSummary(c){
  const parts=[];
  if(c.operator&&c.operator!=='Hattı yok')parts.push(c.operator);
  if(c.mobilAdet)parts.push('Mobil ×'+c.mobilAdet);
  if(c.dslVar)parts.push('DSL'+(c.dslAdet?' ×'+c.dslAdet:''));
  if(c.pstnVar)parts.push('PSTN'+(c.pstnAdet?' ×'+c.pstnAdet:''));
  if(c.metroVar)parts.push('Metro'+(c.metroAdet?' ×'+c.metroAdet:''));
  return parts;
}

function haftaBasi(){
  const d=new Date();d.setHours(0,0,0,0);
  d.setDate(d.getDate()-((d.getDay()+6)%7));
  return d;
}
function ayniBirim(x){return !!x&&x.birimId!=null&&x.birimId===birimKapsamim();}
/* Bu müşteri benim işim mi? Randevusunu ben aldıysam ya da satışını
   ben yaptıysam evet. Telesatışçı yalnızca bunlara erişir; birimdeki
   diğer müşteriler ona kapalıdır. */
function kendiMusterim(c){
  if(!c||!me||!me.employeeId)return false;
  return db.appointments.some(a=>a.customerId===c.id&&alanOf(a)===me.employeeId)
      || db.sales.some(x=>x.customerId===c.id&&x.employeeId===me.employeeId);
}
function duzenlenebilirMusteri(c){
  if(isUst()||isMuhasebe()||isDestek()||capraz())return true;
  if(caprazMusteri(c))return true;
  if((isBirim()||isTLider())&&ayniBirim(c))return true;
  if(isTelesatis()&&kendiMusterim(c))return true;
  if(!c||!c.createdAt||c.createdBy!==me.userId)return false;
  return new Date(c.createdAt)>=haftaBasi();
}
/* Onay bekleyen müşteriyi kim onaylayabilir */
function onaylayabilir(c){
  if(!c||c.onay!=='bekliyor')return false;
  return isUst()||(isBirim()&&ayniBirim(c));
}
function onayRozet(c){
  if(!c||c.onay==='onayli')return '';
  if(c.onay==='red')return '<span class="badge bad">Reddedildi</span>';
  return '<span class="badge warn">Onay bekliyor</span>';
}
function onayBolumu(c){
  if(!c||c.onay==='onayli')return '';
  const kim=c.onaylayan?((db.users||[]).find(u=>u.userId===c.onaylayan)||{}).email:'';
  if(c.onay==='red')return '<div class="ro-banner"><b>Bu müşteri kaydı reddedildi.</b>'+
    (kim?'<div class="sm">Reddeden: '+esc(kim)+'</div>':'')+
    (onaylayabilir(Object.assign({},c,{onay:'bekliyor'}))?'<div class="tools" style="margin-top:8px"><button class="btn" data-act="cust-onay" data-id="'+c.id+'" data-v="onayli">Yine de onayla</button></div>':'')+'</div>';
  return '<div class="ro-banner"><b>Bu müşteri kaydı onay bekliyor.</b>'+
    '<div class="sm">Saha satışçısının eklediği kayıtlar birim müdürü onayına düşer. Onaylanana kadar randevu ve satış girilebilir, kayıt “Onay bekliyor” olarak görünür.</div>'+
    (onaylayabilir(c)
      ?'<div class="tools" style="margin-top:8px"><button class="btn primary" data-act="cust-onay" data-id="'+c.id+'" data-v="onayli">Onayla</button>'+
       '<button class="btn danger" data-act="cust-onay" data-id="'+c.id+'" data-v="red">Reddet</button></div>'
      :'<div class="sm" style="margin-top:6px">Onay yetkiniz yok; birim müdürünüz onaylayacak.</div>')+'</div>';
}
function musteriOnayla(id,karar){
  run('c-err',()=>upd('customers',id,{onay_durumu:karar}),
    karar==='onayli'?'Müşteri onaylandı':'Müşteri reddedildi');
}
function taahhutMetni(ay,yil){
  if(!ay&&!yil)return '<span class="muted">—</span>';
  return esc((ay?MONTHS[+ay-1]:'')+(yil?' '+yil:''));
}
function hizmetSatirlari(c){
  const rows=[];
  if(c.operator)rows.push(['Mevcut operatör',c.operator,'','']);
  if(c.mobilAdet)rows.push(['Mobil hat',c.mobilAdet+' adet','',taahhutMetni(c.mobilTaahhutAy,c.mobilTaahhutYil)]);
  if(c.dslVar)rows.push(['DSL sabit internet',(c.dslAdet||0)+' adet',c.dslHizmetNo||'',taahhutMetni(c.dslTaahhutAy,c.dslTaahhutYil)]);
  if(c.pstnVar)rows.push(['PSTN sabit telefon',(c.pstnAdet||0)+' adet',c.pstnHizmetNo||'',taahhutMetni(c.pstnTaahhutAy,c.pstnTaahhutYil)]);
  if(c.metroVar)rows.push(['Metro ethernet',(c.metroAdet||0)+' adet',c.metroHizmetNo||'',taahhutMetni(c.metroTaahhutAy,c.metroTaahhutYil)]);
  if(!rows.length)return '<div class="empty">Bu müşteri için kayıtlı hizmet bilgisi yok.</div>';
  return '<div class="scroll"><table><thead><tr><th>Hizmet</th><th>Adet</th><th>Hizmet no</th><th>Taahhüt bitişi</th></tr></thead><tbody>'+
    rows.map(r=>'<tr><td><b>'+esc(r[0])+'</b></td><td>'+esc(r[1])+'</td><td>'+(r[2]?esc(r[2]):'<span class="muted">—</span>')+'</td><td>'+r[3]+'</td></tr>').join('')+
    '</tbody></table></div>';
}
/* Müşteriye verilen teklifler. Kartta en son teklif durur; altındaki
   liste "Teklif verildi" ile kapatılmış randevulardan gelir, böylece
   aynı müşteriye zaman içinde verilen teklifler kaybolmaz. */
function teklifBolumu(c){
  const gecmis=db.appointments
    .filter(a=>a.customerId===c.id&&a.sonuc==='teklif')
    .sort((x,y)=>(x.closeDate||x.date)<(y.closeDate||y.date)?1:-1);
  if(c.teklifTarihi==null&&!gecmis.length)return '';
  const fark=(c.teklifTutar!=null&&c.sonFatura!=null)?(c.sonFatura-c.teklifTutar):null;
  return '<section class="dsec"><h3>Verilen teklif</h3>'+

/* ---------- Adresi anında koordinata çevirme ----------
   Müşteri kaydedilir kaydedilmez tarayıcıdan Photon'a sorulur; böylece
   müşteri haritada hemen görünür, saatlik senkronu beklemez.
   Başarısız olursa sessizce geçilir: sunucudaki zamanlanmış çevrim
   zaten aynı kaydı sırası gelince tekrar dener. */
const GEO_ZAMAN_ASIMI=6000;
function geoImza(c){return (c.adres||'')+'|'+(c.ilce||'')+'|'+(c.il||'');}
/* ---------- Adres → koordinat ----------
   Photon bulanık metin araması yapar ve sorgunun sonundaki il/ilçeyi
   yok sayabilir. "cumhuriyet mahallesi atatürk caddesi no:5,
   Arnavutköy, İstanbul" sorgusu Tire/İzmir'de bir kafe döndürüyordu
   ve bu sonuç doğrulanmadan kaydediliyordu: pin 420 km uzağa düşüyor,
   üstelik "adres" etiketlendiği için arayüz uyarı da vermiyordu.

   Artık üç adım var:
     1. önce ilçe merkezi bulunur; dönen il tutmuyorsa kabul edilmez,
     2. tam adres, kapı numarası çıkarılarak ve ilçe merkezine
        yaslanarak (lat/lon) sorulur,
     3. dönen sonucun ili tutmuyorsa ya da ilçe merkezinden
        GEO_MAX_KM'den uzaksa REDDEDİLİR; o zaman ilçe merkezi
        "yaklaşık konum" olarak yazılır.

   Kural: yanlış pin, yaklaşık pinden daha kötüdür. Yaklaşık olan
   haritada uyarı rozetiyle çıkar; yanlış olan doğruymuş gibi durur ve
   personeli başka şehre gönderir. */
const GEO_MAX_KM=30;
const geoNorm=s=>String(s||'').replace(/[İIı]/g,'i').toLowerCase()
  .replace(/ş/g,'s').replace(/ğ/g,'g').replace(/ü/g,'u')
  .replace(/ö/g,'o').replace(/ç/g,'c').replace(/[âàá]/g,'a')
  .replace(/[^a-z0-9]/g,'');
/* Kapı, daire ve blok numarası sorgudan çıkarılır: Photon bunları
   anlamlandıramayıp alakasız bir sonuca kayıyor. */
const KAPI_NO=/\b(kapı\s*no|kapi\s*no|blok\s*no|daire|no|nu|d)\s*[:.\-]?\s*\d+[a-zçğıöşü]?(\s*[\/-]\s*\d+[a-zçğıöşü]?)*/gi;
const kapiSil=a=>String(a||'').replace(KAPI_NO,' ')
  .replace(/\s{2,}/g,' ').replace(/^[\s,]+|[\s,]+$/g,'');
const mesafeKm=(a,b,c,d)=>{const R=6371,p=Math.PI/180;
  const x=Math.pow(Math.sin((c-a)*p/2),2)+
          Math.cos(a*p)*Math.cos(c*p)*Math.pow(Math.sin((d-b)*p/2),2);
  return 2*R*Math.asin(Math.sqrt(x));};

async function geoSor(adres,opt){
  opt=opt||{};
  let url='https://photon.komoot.io/api?lang=default&limit='+(opt.limit||5)+
          '&q='+encodeURIComponent(adres);
  if(opt.lat!==undefined&&opt.lat!==null)url+='&lat='+opt.lat+'&lon='+opt.lon;
  if(opt.tag)url+='&osm_tag='+encodeURIComponent(opt.tag);
  const kes=new AbortController();
  const sayac=setTimeout(()=>kes.abort(),GEO_ZAMAN_ASIMI);
  try{
    const r=await fetch(url,{signal:kes.signal});
    if(!r.ok)return [];
    const j=await r.json();
    return (((j||{}).features)||[]).map(f=>{
      const k=f.geometry&&f.geometry.coordinates,pr=f.properties||{};
      if(!k||k.length<2)return null;
      const enlem=Number(k[1]),boylam=Number(k[0]);
      if(!isFinite(enlem)||!isFinite(boylam))return null;
      return {enlem,boylam,il:pr.state||'',ilce:pr.city||''};
    }).filter(Boolean);
  }catch(e){return [];}
  finally{clearTimeout(sayac);}
}
/* İlçe merkezi; bulunamazsa il merkezi. Aynı ilçe çok kayıtta
   tekrarlandığı için oturum boyunca akılda tutulur. */
const _geoMerkez={};
async function geoMerkez(il,ilce){
  const anahtar=geoNorm(il)+'|'+geoNorm(ilce);
  if(_geoMerkez[anahtar]!==undefined)return _geoMerkez[anahtar];
  const dene=[];
  if(ilce)dene.push([ilce,il,'Türkiye'].filter(Boolean).join(', '));
  if(il)dene.push([il,'Türkiye'].join(', '));
  let bulunan=null;
  for(const q of dene){
    const list=await geoSor(q,{limit:3,tag:'place'});
    const hit=list.find(r=>!il||geoNorm(r.il)===geoNorm(il));
    if(hit){bulunan=hit;break;}
  }
  _geoMerkez[anahtar]=bulunan;
  return bulunan;
}
async function konumBul(c){
  const il=(c.il||'').trim(),ilce=(c.ilce||'').trim(),adres=(c.adres||'').trim();
  if(!il&&!adres)return null;
  const merkez=await geoMerkez(il,ilce);
  if(adres){
    const q=[kapiSil(adres),ilce,il].filter(Boolean).join(', ');
    const list=await geoSor(q,merkez?{lat:merkez.enlem,lon:merkez.boylam}:{});
    const aday=list.filter(r=>{
      if(il&&geoNorm(r.il)!==geoNorm(il))return false;
      if(merkez&&mesafeKm(merkez.enlem,merkez.boylam,r.enlem,r.boylam)>GEO_MAX_KM)return false;
      return true;
    });
    /* Aynı ilçeyi yazan sonuç varsa onu yeğle */
    const iyi=ilce?aday.filter(r=>geoNorm(r.ilce)===geoNorm(ilce)):[];
    const sec=iyi[0]||aday[0];
    if(sec)return {enlem:sec.enlem,boylam:sec.boylam,kaynak:'adres'};
  }
  if(merkez)return {enlem:merkez.enlem,boylam:merkez.boylam,kaynak:'ilce'};
  return null;
}
/* Kaydedilen müşterinin koordinatını yaz. Hata fırlatmaz. */
async function konumIsle(custId,bilgi){
  try{
    const k=await konumBul(bilgi);
    if(!k)return;
    await upd('customers',custId,{enlem:k.enlem,boylam:k.boylam,
      geo_kaynak:k.kaynak,geo_adres:geoImza(bilgi),geo_at:new Date().toISOString()});
  }catch(e){/* zamanlanmış çevrim sonra halleder */}
}

/* Ekranda gösterilecek randevular. Tablo ile kart listesi aynı
   süzgeçleri kullansın diye ayrı işleve alındı. */
function apptListe(){
  const f=state.rand,q=f.q.trim().toLocaleLowerCase('tr');
  let list=db.appointments.slice();
  const od=RAND_ODAK[f.odak];
  if(od)list=list.filter(od.f);
  else if(f.status)list=list.filter(a=>a.status===f.status);
  if(f.emp)list=list.filter(a=>a.employeeId===f.emp||alanOf(a)===f.emp);
  if(state.period!=='all'&&!(od&&od.donemsiz))list=list.filter(a=>inPeriod(a,state.period));
  if(q)list=list.filter(a=>{const c=apptCustomer(a),al=emp(alanOf(a));
    return [c?c.unvan:'',c?c.yetkili:'',c?c.operator:'',a.desc,al?al.name:''].join(' ').toLocaleLowerCase('tr').includes(q);});
  return list;
}
/* ---------- Saha personeli için kart görünümü ----------
   Telefonda satır satır tablo yerine her randevu bir düğme. Üzerinde
   müşteri, hat adedi, operatör ve tarih var; dokununca randevu sonucu
   penceresi açılır. Açık randevular başta, tarihi geçmişler kırmızı. */
function apptKartlar(){
  const list=apptListe().slice().sort((a,b)=>{
    const ao=a.status==='Açık'?0:1,bo=b.status==='Açık'?0:1;
    if(ao!==bo)return ao-bo;
    return ao===0?(a.date<b.date?-1:a.date>b.date?1:0)   /* açıkta en yakın tarih önce */
                 :(a.date<b.date?1:a.date>b.date?-1:0);  /* kapalıda en yeni önce */
  });
  if(!list.length)return '<div class="empty">Bu filtrede randevu yok.</div>';
  return '<div class="rnd-kartlar">'+list.map(a=>{
    const c=apptCustomer(a),ac=a.status==='Açık';
    const gecti=ac&&a.date<TODAY,bugun=ac&&a.date===TODAY;
    const hat=(c&&c.operator&&c.operator!=='Hattı yok'&&num(c.mobilAdet))?num(c.mobilAdet):0;
    const metro=metroRnd(a);
    return '<button class="rnd-kart'+(gecti?' gecti':bugun?' bugun':'')+'" '+
      'data-act="'+(ac?'close-appt':'appt-detail')+'" data-id="'+a.id+'">'+
      '<span class="rk-tarih">'+esc(fmtDate(a.date))+
        (gecti?' · gecikti':bugun?' · bugün':'')+'</span>'+
      '<span class="rk-ad">'+esc(c?c.unvan:'Silinmiş müşteri')+'</span>'+
      /* Nereye gideceğini kartta görsün */
      ((c&&(c.ilce||c.il))?'<span class="rk-yer">'+esc([c.ilce,c.il].filter(Boolean).join(' / '))+'</span>':'')+
      '<span class="rk-bilgi">'+
        (metro?'<b class="rk-metro">Metro</b>'
             :hat?'<b>'+hat+' hat</b>':'<b class="muted">Hat yok</b>')+
        (c&&c.operator?'<span>'+esc(c.operator)+'</span>':'')+'</span>'+
      (ac?'<span class="rk-eylem">Sonucu gir →</span>'
         :'<span class="rk-eylem kapali">'+esc(sonucAdi(a.sonuc)||'Kapandı')+'</span>')+
    '</button>';}).join('')+'</div>';
}
/* Saha personelinde iki görünüm de basılır; hangisinin görüneceğine
   CSS karar verir. Telefonda kartlar, masaüstünde tablo. Tek kişinin
   randevusu olduğu için iki kez üretmenin maliyeti yok. */
function randListe(){
  return isSaha()
    ? '<div class="rnd-kart-alan">'+apptKartlar()+'</div>'+
      '<div class="rnd-tablo-alan">'+apptTable()+'</div>'
    : apptTable();
}
function apptTable(){
  const f=state.rand,q=f.q.trim().toLocaleLowerCase('tr');
  let list=db.appointments.slice();
  const od=RAND_ODAK[f.odak];
  if(od)list=list.filter(od.f);
  else if(f.status)list=list.filter(a=>a.status===f.status);
  if(f.emp)list=list.filter(a=>a.employeeId===f.emp||alanOf(a)===f.emp);
  if(state.period!=='all'&&!(od&&od.donemsiz))list=list.filter(a=>inPeriod(a,state.period));
  if(q)list=list.filter(a=>{const c=apptCustomer(a),al=emp(alanOf(a));
    return [c?c.unvan:'',c?c.yetkili:'',c?c.operator:'',a.desc,al?al.name:''].join(' ').toLocaleLowerCase('tr').includes(q);});
  list.sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);
  if(!list.length)return '<div class="empty">Bu filtrede randevu yok.</div>';
  return '<div class="scroll"><table><thead><tr><th>Tarih</th><th>Müşteri</th><th>Operatör / hat</th><th>Kaydı giren saha</th><th>Randevuyu alan</th><th>Atanan personel</th><th>Açıklama</th><th>Durum</th><th></th></tr></thead><tbody>'+
  list.map(a=>{const c=apptCustomer(a),e=emp(a.employeeId),conv=a.status==='Kapandı'&&donustu(a);
    void 0;
    const custBtn=c?'<button class="btn sm" data-act="cust-info" data-id="'+c.id+'">Müşteri</button> ':'';
    const acts=custBtn+(a.status==='Açık'
      ?(isMudur()?'<button class="btn sm" data-act="transfer-appt" data-id="'+a.id+'">Devret</button> ':'')+
       '<button class="btn sm danger" data-act="cancel-appt" data-id="'+a.id+'">İptal</button> '+
       '<button class="btn sm primary" data-act="close-appt" data-id="'+a.id+'">Kapat</button>'
      :'<button class="btn sm" data-act="appt-detail" data-id="'+a.id+'">Detay</button>');
    const al=emp(alanOf(a)),sh=apptSaha(a);
    return '<tr><td class="nowrap">'+fmtDate(a.date)+'</td><td>'+(c?'<div>'+esc(c.unvan)+turRozet(a)+'</div><div class="muted sm">'+esc(c.yetkili)+'</div>':'<span class="muted">Silinmiş müşteri</span>'+turRozet(a))+'</td>'+
      '<td>'+(metroRnd(a)?'<div>Metro</div>'+(c&&c.operator?'<div class="muted sm">'+esc(c.operator)+'</div>':'')
        :c&&c.operator
        ?'<div>'+esc(c.operator)+'</div>'+(c.operator!=='Hattı yok'&&c.mobilAdet?'<div class="muted sm">'+c.mobilAdet+' hat</div>':'')
        :'<span class="muted">—</span>')+'</td>'+
      '<td>'+(sh?esc(sh.name):'<span class="muted">—</span>')+'</td><td>'+(al?'<div>'+esc(al.name)+'</div><div class="muted sm">'+esc((dept(al.departmentId)||{}).name||'')+'</div>':'<span class="muted">—</span>')+'</td><td>'+esc(e?e.name:'')+(e&&e.bayiMuduru?' <span class="badge">Bayi Müdürü</span>':'')+'</td><td><div class="clamp">'+esc(a.desc)+'</div>'+(a.status==='Kapandı'?'<div class="muted sm clamp">'+esc(a.closeDesc||'')+'</div>':'')+'</td><td>'+(a.status==='Açık'
        ?'<span class="badge warn">Açık</span>'+((a.ziyaret||1)>1?' <span class="badge">'+a.ziyaret+'. ziyaret</span>':'')
        :a.status==='İptal'?'<span class="badge bad">İptal</span>'
        :'<span class="badge ok">Kapandı</span>'+sonucRozet(a))+(conv?' <span class="badge ok"'+(donusumTarihi(a)?' title="Satış tarihi: '+fmtDate(donusumTarihi(a))+'"':'')+'>Satışa döndü</span>':'')+'</td><td class="num nowrap">'+acts+'</td></tr>';}).join('')+
  '</tbody></table></div>';
}
const alanOf=a=>a.alanId||a.employeeId;
const iptalMi=a=>a.status==='İptal';
const acikRandevular=cid=>db.appointments.filter(a=>a.customerId===cid&&a.status==='Açık');
/* Atanan personele göre randevu dağılımı — bayi müdürünün kontrolü */
function atamaDagilimi(period){
  const m={};
  db.appointments.filter(a=>inPeriod(a,period)).forEach(a=>{
    const k=a.employeeId||'__yok__';
    const g=m[k]||(m[k]={eid:a.employeeId,acik:0,kapali:0,iptal:0,satis:0,toplam:0,hat:0});
    g.toplam++;
    /* Hat adedi, randevu alınırken müşteri kartına yazılan mobil hat
       sayısıdır. İptal edilen randevular sayılmaz. */
    if(!iptalMi(a)){const c=byId(db.customers,a.customerId);g.hat+=num(c&&c.mobilAdet);}
    if(iptalMi(a))g.iptal++;
    else if(a.status==='Açık')g.acik++;
    else {g.kapali++;if(donustu(a))g.satis++;}
  });
  return Object.keys(m).map(k=>m[k]).map(g=>{
    const e=g.eid?emp(g.eid):null;
    g.ad=e?e.name:'Atanmamış';
    g.alt=e?((dept(e.departmentId)||{}).name||''):'';
    g.bayi=!!(e&&e.bayiMuduru);
    return g;
  }).sort((a,b)=>b.acik-a.acik||b.toplam-a.toplam);
}
/* ---------- Bugün alınan randevular: kim kaç tane aldı ----------
   "Bugün alınan randevu" kutusuna basıldığında, listenin üstünde
   personel bazlı kırılım çıkar. Yöneticiler günün akışını tek bakışta
   görsün diye; kutuyu kapatınca panel de kalkar.

   Sayım RANDEVUYU ALANA göredir, atanana değil: kutunun kendisi de
   öyle sayıyor, iki rakam birbirini tutsun. */
const kirilimGorur=()=>isUst()||isBirim()||isTLider();
function bugunAlanPaneli(){
  if(!kirilimGorur()||state.rand.odak!=='bugun')return '';
  const liste=bugunAlinan();
  const m={};
  liste.forEach(a=>{
    const id=alanOf(a),e=emp(id);
    const k=id||'yok';
    const g=m[k]||(m[k]={ad:e?e.name:'Belirsiz',alt:e?((dept(e.departmentId)||{}).name||''):'',
      adet:0,hat:0,metro:0});
    g.adet++;
    if(metroRnd(a))g.metro++;
    const c=apptCustomer(a);
    if(c&&c.operator&&c.operator!=='Hattı yok')g.hat+=num(c.mobilAdet);
  });
  const rows=Object.values(m).sort((a,b)=>b.adet-a.adet||a.ad.localeCompare(b.ad,'tr',SAYISAL));
  if(!rows.length)return '';
  const t=rows.reduce((o,r)=>({adet:o.adet+r.adet,hat:o.hat+r.hat,metro:o.metro+r.metro}),
    {adet:0,hat:0,metro:0});
  return '<section class="panel"><div class="panel-h"><div><h2>Bugün alınan randevular</h2>'+
    '<p class="muted sm">'+fmtDate(TODAY)+' · randevuyu alan personele göre</p></div>'+
    '<span class="muted sm">'+t.adet+' randevu</span></div>'+
    '<div class="scroll"><table><thead><tr><th>Randevuyu alan</th>'+
      '<th class="num">Randevu</th><th class="num">Hat adedi</th>'+
      (t.metro?'<th class="num">Metro</th>':'')+'</tr></thead><tbody>'+
    rows.map(r=>'<tr><td><div>'+esc(r.ad)+'</div>'+
      (r.alt?'<div class="muted sm">'+esc(r.alt)+'</div>':'')+'</td>'+
      '<td class="num"><b>'+r.adet+'</b></td>'+
      '<td class="num'+(r.hat?'':' muted')+'">'+(r.hat||'-')+'</td>'+
      (t.metro?'<td class="num'+(r.metro?'':' muted')+'">'+(r.metro||'-')+'</td>':'')+'</tr>').join('')+
    '<tr class="total"><td>Toplam</td><td class="num">'+t.adet+'</td>'+
      '<td class="num">'+t.hat+'</td>'+(t.metro?'<td class="num">'+t.metro+'</td>':'')+
    '</tr></tbody></table></div></section>';
}
function atamaBolumu(){
  if(!isMudur())return '';
  const rows=atamaDagilimi(state.period);
  if(!rows.length)return '';
  const t=rows.reduce((o,r)=>({acik:o.acik+r.acik,kapali:o.kapali+r.kapali,iptal:o.iptal+r.iptal,
    satis:o.satis+r.satis,toplam:o.toplam+r.toplam,hat:o.hat+r.hat}),
    {acik:0,kapali:0,iptal:0,satis:0,toplam:0,hat:0});
  return '<section class="panel"><div class="panel-h"><h2>Kime kaç randevu gitti</h2>'+
    '<span class="muted sm">'+(state.period==='all'?'Tüm dönemler':monthLabel(state.period))+' · atanan personele göre</span></div>'+
    '<div class="scroll"><table><thead><tr><th>Atanan personel</th><th class="num">Açık</th>'+
    '<th class="num">Kapanan</th><th class="num">İptal</th><th class="num">Satışa dönen</th>'+
    '<th class="num">Hat adedi</th><th class="num">Toplam</th></tr></thead><tbody>'+
    rows.map(r=>'<tr><td><div>'+esc(r.ad)+(r.bayi?' <span class="badge">Bayi Müdürü</span>':'')+'</div>'+
      (r.alt?'<div class="muted sm">'+esc(r.alt)+'</div>':'')+'</td>'+
      '<td class="num"><b>'+r.acik+'</b></td><td class="num">'+r.kapali+'</td>'+
      '<td class="num'+(r.iptal?' out':' muted')+'">'+(r.iptal||'-')+'</td>'+
      '<td class="num">'+r.satis+'</td>'+
      '<td class="num'+(r.hat?'':' muted')+'"><b>'+(r.hat||'-')+'</b></td>'+
      '<td class="num">'+r.toplam+'</td></tr>').join('')+
    '<tr class="total"><td>Toplam</td><td class="num">'+t.acik+'</td><td class="num">'+t.kapali+'</td>'+
    '<td class="num">'+t.iptal+'</td><td class="num">'+t.satis+'</td>'+
    '<td class="num"><b>'+t.hat+'</b></td><td class="num">'+t.toplam+'</td></tr>'+
    '</tbody></table></div>'+
    '<div class="panel-b"><p class="hint">Bayi Müdürü satırındaki açık randevular henüz dağıtılmamış olanlardır. Listeden <b>Devret</b> diyerek ilgili saha personeline aktarın.</p></div></section>';
}
function apptStatsRows(period){
  const emps=db.employees.filter(e=>db.appointments.some(a=>alanOf(a)===e.id));
  return emps.map(e=>{
    const all=db.appointments.filter(a=>alanOf(a)===e.id&&inPeriod(a,period));
    const gecerli=all.filter(a=>!iptalMi(a));
    return {e,total:gecerli.length,
      closed:gecerli.filter(a=>a.status==='Kapandı').length,
      conv:gecerli.filter(donustu).length,
      iptal:all.filter(iptalMi).length};
  }).filter(r=>r.total||r.iptal).sort((a,b)=>b.total-a.total);
}
/* ---------- Telesatış ekip tablosu ----------
   Telesatışçı arkadaşlarının randevu ve hat adedini görsün diye.
   Sunucudan YALNIZCA toplam geliyor: ad, randevu adedi, hat adedi.
   Müşteri bilgisi hiç inmiyor, satır yetkisi gevşetilmiyor. */
let _ekipTablo=null,_ekipDonem=null,_ekipIsi=false;
function donemAraligi(p){
  if(p==='all')return [null,null];
  const [y,a]=p.split('-').map(Number);
  const son=new Date(y,a,0).getDate();
  return [p+'-01',p+'-'+String(son).padStart(2,'0')];
}
async function ekipTabloGetir(){
  const p=state.period;
  if(_ekipIsi||_ekipDonem===p)return;
  _ekipIsi=true;
  const [bas,bit]=donemAraligi(p);
  try{
    const r=await sb.rpc('telesatis_tablosu',{p_bas:bas,p_bit:bit});
    _ekipTablo=r.error?[]:(r.data||[]);
    _ekipDonem=p;
  }catch(e){_ekipTablo=[];_ekipDonem=p;}
  finally{_ekipIsi=false;}
  if(state&&state.view==='randevu')render();
}
function ekipTabloBolumu(){
  if(!isTelesatis())return '';          /* lider zaten hepsini görüyor */
  if(_ekipDonem!==state.period){ekipTabloGetir();
    return '<section class="panel"><div class="panel-h"><h2>Telesatış ekibi</h2></div>'+
      '<div class="panel-b"><p class="muted">Yükleniyor…</p></div></section>';}
  const liste=_ekipTablo||[];
  if(!liste.length)return '';
  const tHat=liste.reduce((t,r)=>t+num(r.hat),0),tRnd=liste.reduce((t,r)=>t+num(r.randevu),0);
  return '<section class="panel"><div class="panel-h"><div><h2>Telesatış ekibi</h2>'+
    '<p class="muted sm">Ekip arkadaşlarınızın randevu ve hat adedi. Ayrıntılar yalnızca randevuyu alan kişide ve takım liderinde görünür.</p></div>'+
    '<span class="muted sm">'+(state.period==='all'?'Tüm dönemler':monthLabel(state.period))+'</span></div>'+
    '<div class="scroll"><table><thead><tr><th>Personel</th><th class="num">Randevu</th><th class="num">Hat adedi</th></tr></thead><tbody>'+
    '<tr class="total-top"><td>Ekip toplamı</td><td class="num">'+tRnd+'</td><td class="num">'+tHat+'</td></tr>'+
    liste.map(r=>'<tr'+(r.kendisi?' class="in"':'')+'><td>'+esc(r.personel)+
      (r.kendisi?' <span class="badge">Siz</span>':'')+'</td>'+
      '<td class="num">'+num(r.randevu)+'</td>'+
      '<td class="num"><b>'+num(r.hat)+'</b></td></tr>').join('')+
    '</tbody></table></div></section>';
}

    rows.map(r=>'<tr><td><div>'+esc(r.e.name)+'</div><div class="muted sm">'+esc((dept(r.e.departmentId)||{}).name)+'</div></td><td class="num">'+r.total+'</td><td class="num">'+r.closed+'</td><td class="num'+(r.iptal?' out':' muted')+'">'+(r.iptal||'-')+'</td><td class="num"><b>'+r.conv+'</b></td><td class="num">%'+pct(r.conv,r.total)+'</td></tr>').join('')+
    '</tbody></table></div></section>':'')+
  '<section class="panel"><div class="panel-h">'+

      ?'<span class="badge warn">'+esc(RAND_ODAK[f.odak].ad)+'</span>'+
       '<button class="btn sm" data-act="rand-odak" data-v="">Filtreyi kaldır</button>'
      :'')+
    '<input id="rq" type="search" placeholder="Müşteri veya açıklama ara" value="'+esc(f.q)+'" style="max-width:320px" aria-label="Ara"><div class="tools">'+
    '<select data-set="rand.status" aria-label="Durum">'+opt([['Açık','Açık'],['Kapandı','Kapandı'],['İptal','İptal']],f.status,'Tüm durumlar')+'</select>'+
    '<select data-set="rand.emp" aria-label="Personel">'+empSecim(f.emp,'Tüm personel')+'</select></div></div><div id="randlist">'+randListe()+'</div></section></div>';
}
/* Randevu başka birimin müşterisine alınamaz (satış alınabilir).
   Kuralı kaydetme anında değil, müşteri seçilir seçilmez söylüyoruz. */
function baskaBirimId(cid){
  if(!cid||cid===NEW_CUST)return null;
  if(isUst()||isMuhasebe()||isDestek()||capraz())return null;
  const c=byId(db.customers,cid);
  if(!c||c.birimId==null)return null;            /* birimsiz müşteri serbest */
  if(caprazMusteri(c))return null;               /* hizmet biriminin müşterisi herkese açık */
  return c.birimId===birimKapsamim()?null:c.birimId;
}
function baskaBirimUyari(cid){
  const b=baskaBirimId(cid);if(!b)return '';
  const ad=(byId(db.birimler,b)||{}).name||'başka bir birim';
  return '<div class="ro-banner"><b>Bu müşteri '+esc(ad)+' birimine ait.</b>'+
    '<div class="sm">Randevu alamazsınız. Satış girmeniz engellenmez; '+
    'randevu için o birimin müdürüne başvurun.</div></div>';
}
function acikRandevuUyari(cid){
  const list=(cid&&cid!==NEW_CUST)?acikRandevular(cid):[];
  if(!list.length)return '';
  return '<div class="ro-banner"><b>Bu müşterinin açık randevusu var.</b><br>'+

function randevuSahibi(custId){

    '<p class="hint">Bu randevu Bayi Müdürü <b>'+esc(bm.name)+'</b>\u2019ye atanacak; dağıtımı o yapar.</p>';

function saveAppointment(){
  const custSel=$('#ap-cust').value,date=$('#ap-date').value,desc=$('#ap-desc').value.trim(),err=m=>{$('#ap-err').textContent=m;};
  const alan=($('#ap-alan')||{}).value||'';
  if(!custSel)return err('Müşteri seçin.');if(!date)return err('Tarih seçin.');if(!desc)return err('Açıklama girin.');
  if(!alan)return err('Randevuyu alan personeli seçin.');
  const oper=($('#ap-oper')||{}).value||'';
  const tur=(($('#ap-tur')||{}).value==='metro')?'metro':'normal';
  const hatStr=($('#ap-hat')||{}).value;
  const hat=hatStr===''?null:Math.max(0,Math.floor(Number(hatStr)||0));
  if(!oper)return err('Müşterinin mevcut operatörünü seçin.');
  if(hat===null)return err('Müşterinin hat adedini girin.');
  if(oper!=='Hattı yok'&&hat<1)return err('Hat adedi en az 1 olmalı. Müşterinin hattı yoksa operatör olarak “Hattı yok” seçin.');
  if(custSel!==NEW_CUST&&acikRandevular(custSel).length&&!dlgState.apOpenConfirmed){
    dlgState.apOpenConfirmed=true;
    return err('Bu müşterinin açık randevusu var. Yine de oluşturmak için “Randevuyu kaydet” düğmesine tekrar basın.');
  }
  if(baskaBirimId(custSel)){
    const ad=(byId(db.birimler,baskaBirimId(custSel))||{}).name||'başka bir birim';
    return err('Bu müşteri '+ad+' birimine ait; randevu alamazsınız. Satış girebilirsiniz.');
  }
  if(!randevuSahibi(custSel===NEW_CUST?null:custSel))
    return err('Bayi Müdürü tanımlı değil. Önce Personel sayfasından bir Bayi Müdürü belirleyin.');
  run('ap-err',async()=>{
    let custId=custSel;
    if(custSel===NEW_CUST){
      const res=await quickCreateCustomer('ap','apDup');
      if(res.error)throw new Error(res.error);
      custId=res.customer.id;
    }
    /* Operatör ve hat adedi müşteri kartına işlenir. Bu, müşteriyi
       düzenleme yetkisi istemeyen dar bir işlev üzerinden yapılır;
       aksi halde kendi birimi dışındaki bir müşteriye randevu alan
       personel "değişiklik yapma yetkiniz yok" hatası alıyordu. */
    const dr=await sb.rpc('randevu_musteri_damga',
      {p_cust:custId,p_operator:oper,p_hat:hat});
    if(dr.error)throw new Error(dbErr(dr.error));
    const h=randevuSahibi(custId);
    const a=await ins('appointments',{customer_id:custId,employee_id:h.emp.id,alan_id:alan,
      date,descr:desc,status:'Açık',tur});
    /* Randevu alınan müşterinin haritada yeri yoksa koordinatı şimdi ara.
       Mevcut bir müşteriye randevu alındığında daha önce hiçbir şey
       tetiklenmiyordu; pin ancak zamanlanmış çevrimde oluşuyordu. */
    const mus=byId(db.customers,custId);
    if(mus&&(mus.enlem==null||mus.boylam==null))
      await konumIsle(custId,{il:mus.il||'',ilce:mus.ilce||'',adres:mus.adres||''});
    const sh=sahaSahibiOf(custId);
    await ins('appointment_logs',{appt_id:a.id,date:TODAY,
      text:'Randevuyu alan: '+((emp(alan)||{}).name||'—')+
        (tur==='metro'?' · Metro randevusu':'')+
        ' · Operatör: '+oper+(oper!=='Hattı yok'?' ('+hat+' hat)':'')+
        ' · Bayi Müdürü\u2019ne atandı: '+h.emp.name+
        (sh?' · Potansiyel kaydını giren saha personeli: '+sh.name:'')});
  },custSel===NEW_CUST?'Yeni müşteri ve randevu kaydedildi':'Randevu kaydedildi');
}

/* Randevu sonuçları. kapat:false olanlar randevuyu açık bırakır,
   yalnızca tarihini ileri alır ve ziyaret sayısını artırır. */
/* Randevu türleri. Metro randevuları haritada ayrı renkte ve hat
   adedi yerine "Metro" yazısıyla çıkar. */
const RND_TUR=[
  {k:'normal',ad:'Normal randevu'},
  {k:'metro', ad:'Metro randevusu'}
];
const metroRnd=a=>!!a&&a.tur==='metro';
const turRozet=a=>metroRnd(a)?' <span class="badge metro">Metro</span>':'';
const RND_SONUC=[
  {k:'satis',   ad:'Satış yapıldı',            kapat:true,  ton:'ok'},
  {k:'teklif',  ad:'Teklif verildi',           kapat:true,  ton:'warn'},
  {k:'olumsuz', ad:'Olumsuz — ilgilenmiyor',   kapat:true,  ton:'bad'},
  {k:'ulasilamadi',ad:'Ulaşılamadı',           kapat:true,  ton:''},
  {k:'yanlis',  ad:'Yanlış kayıt',             kapat:true,  ton:''},
  {k:'tekrar',  ad:'Tekrar ziyaret edilecek',  kapat:false, ton:'warn'},
  {k:'ertele',  ad:'Ertelendi',                kapat:false, ton:'warn'}
];
const sonucBilgi=k=>RND_SONUC.find(x=>x.k===k)||null;
const sonucAdi=k=>{const s=sonucBilgi(k);return s?s.ad:'';};
/* "Satış yapıldı" bir BEYANDIR. Sistemde eşleşen satış kaydı yoksa
   öyle etiketlenir; hedeflere ve dönüşüm oranına zaten girmiyor. */
const satisBeyani=a=>!!a&&a.sonuc==='satis'&&!donustu(a);
function sonucRozet(a){
  if(!a||!a.sonuc)return '';
  const s=sonucBilgi(a.sonuc);if(!s)return '';
  if(satisBeyani(a))
    return ' <span class="badge warn" title="Personel satış yapıldığını bildirdi; sistemde eşleşen satış kaydı yok. Hedefe ve dönüşüm oranına sayılmaz.">Satış beyanı</span>';
  return ' <span class="badge '+(s.ton||'')+'">'+esc(s.ad)+'</span>';
}
/* Beyan edilmiş ama satış kaydı girilmemiş randevular */
const beyanAcik=p=>db.appointments.filter(a=>satisBeyani(a)&&(p==='all'||inPeriod(a,p)));
/* Randevular ekranındaki sayı kutuları tıklanabilir. Her kutu listeyi
   kendi ölçütüne odaklar. donemsiz=true olanlar dönem seçiminden
   bağımsız sayılır; kutudaki rakamla liste birebir aynı olsun diye
   listede de dönem süzgeci uygulanmaz. */
const RAND_ODAK={
  acik   :{ad:'Açık randevu',           donemsiz:true, f:a=>a.status==='Açık'},
  bugun  :{ad:'Bugün alınan randevu',   donemsiz:true, f:a=>!iptalMi(a)&&yerelGun(a.createdAt)===TODAY},
  donem  :{ad:'Bu dönem randevu',       f:a=>!iptalMi(a)},
  kapanan:{ad:'Bu dönem kapanan',       f:a=>!iptalMi(a)&&a.status==='Kapandı'},
  satisa :{ad:'Satışa dönen',           f:a=>!iptalMi(a)&&donustu(a)},
  beyan  :{ad:'Satış beyanı, kaydı yok',f:a=>satisBeyani(a)},
  iptal  :{ad:'İptal edilen',           f:a=>iptalMi(a)},
  /* Kapama raporundan gelenler: randevunun alındığı güne değil,
     KAPATILDIĞI güne göre süzer. Randevular ekranında kendi kutuları
     yoktur; yalnızca Genel bakıştaki rapordan tıklanınca açılır. */
  kapanisBugun:{ad:'Bugün kapatılan randevu',donemsiz:true,
    f:a=>a.status==='Kapandı'&&kapanmaGunu(a)===TODAY},
  kapanisDonem:{ad:'Bu dönemde kapatılan randevu',donemsiz:true,
    f:a=>a.status==='Kapandı'&&(state.period==='all'||String(kapanmaGunu(a)).slice(0,7)===state.period)}
};

    const hat=hatStr===''?null:Math.max(0,Math.floor(Number(hatStr)||0));
    const teklif=sayi('cl-teklif'),fatura=sayi('cl-fatura');
    if(!oper)return err('Müşterinin mevcut operatörünü seçin.');
    if(hat===null)return err('Müşterinin hat adedini girin.');
    if(oper!=='Hattı yok'&&hat<1)return err('Hat adedi en az 1 olmalı. Müşterinin hattı yoksa operatör olarak “Hattı yok” seçin.');
    if(!ay||!yil)return err('Taahhüt bitiş ayını ve yılını seçin.');
    if(teklif===null||!(teklif>0))return err('Verilen teklif tutarını 0’dan büyük girin.');
    if(fatura===null||!(fatura>=0))return err('Müşterinin son ödediği fatura tutarını girin.');
    tk={oper,hat,ay,yil,teklif,fatura};
  }
  if(s.kapat){
    run('cl-err',async()=>{
      if(tk){
        /* Müşteri kartını randevuyu kapatan kişi çoğu zaman
           düzenleyemez; yazma dar yetkili işlevden geçer. */
        const r=await sb.rpc('randevu_teklif_damga',
          {p_cust:a.customerId,p_operator:tk.oper,p_hat:tk.hat,p_ay:tk.ay,p_yil:String(tk.yil),
           p_teklif:tk.teklif,p_fatura:tk.fatura,p_tarih:date});
        if(r.error)throw new Error(dbErr(r.error));
      }
      await upd('appointments',id,Object.assign({status:'Kapandı',sonuc:k,close_descr:desc,close_date:date},
        tk?{teklif_tutar:tk.teklif,son_fatura:tk.fatura}:{}));
      await ins('appointment_logs',{appt_id:id,date,text:'Randevu kapatıldı — '+s.ad+
        (tk?': Teklif '+money(tk.teklif)+' · Son fatura '+money(tk.fatura)+' · '+tk.oper+' '+tk.hat+' hat · Taahhüt bitişi '+MONTHS[+tk.ay-1]+' '+tk.yil:'')+
        (desc?(tk?' · ':': ')+desc:'')});
    },'Randevu kapatıldı: '+s.ad);
  }else{
    const yeniZiyaret=(a.ziyaret||1)+1;
    run('cl-err',async()=>{
      await upd('appointments',id,{date:date,sonuc:'',ziyaret:yeniZiyaret});
      await ins('appointment_logs',{appt_id:id,date:TODAY,
        text:s.ad+' — yeni tarih '+fmtDate(date)+' ('+yeniZiyaret+'. ziyaret)'+(desc?': '+desc:'')});
    },s.ad+': '+fmtDate(date));
  }
}

async function saveSifre(){
  const eski=$('#sf-eski').value,yeni=$('#sf-yeni').value,yeni2=$('#sf-yeni2').value;
  const err=m=>{$('#sf-err').textContent=m;};
  if(!eski)return err('Mevcut şifrenizi girin.');
  if(yeni.length<8)return err('Yeni şifre en az 8 karakter olmalı.');
  if(yeni!==yeni2)return err('Yeni şifreler birbiriyle aynı değil.');
  if(yeni===eski)return err('Yeni şifre eskisiyle aynı olamaz.');
  if(dlgState.calisiyor)return;
  dlgState.calisiyor=true;err('Kontrol ediliyor…');
  try{
    /* Mevcut şifreyi doğrula: yanlışsa değişiklik yapılmasın */
    const k=await sb.auth.signInWithPassword({email:me.email,password:eski});
    if(k.error){dlgState.calisiyor=false;return err('Mevcut şifreniz doğru değil.');}
    const r=await sb.auth.updateUser({password:yeni});
    dlgState.calisiyor=false;
    if(r.error)return err(r.error.message);
    closeDlg();toast('Şifreniz değiştirildi');
  }catch(e){dlgState.calisiyor=false;err(String(e&&e.message?e.message:e));}
}

async function saveSifreBelirle(uid){
  const yeni=$('#sb-yeni').value,yeni2=$('#sb-yeni2').value;
  const err=m=>{$('#sb-err').textContent=m;};
  if(yeni.length<8)return err('Şifre en az 8 karakter olmalı.');
  if(yeni!==yeni2)return err('Şifreler birbiriyle aynı değil.');
  if(dlgState.calisiyor)return;
  dlgState.calisiyor=true;err('Gönderiliyor…');
  try{
    const r=await sb.functions.invoke('sifre-belirle',{body:{user_id:uid,password:yeni}});
    dlgState.calisiyor=false;
    if(r.error){
      /* Fonksiyonun kendi mesajını çıkarmaya çalış; gövde JSON değilse
         ham metni ve durum kodunu göster ki sebep görünsün. */
      let m='', kod='', ham='';
      const ctx=r.error.context;
      if(ctx){
        kod=ctx.status?String(ctx.status):'';
        try{
          ham=await ctx.clone().text();
          try{const j=JSON.parse(ham);if(j&&j.error)m=j.error;}catch(e){}
        }catch(e){}
      }
      if(!m){
        m=r.error.message||'Şifre belirlenemedi.';
        if(ham)m+=' — sunucu cevabı: '+ham.slice(0,300);
        if(kod)m+=' (HTTP '+kod+')';
      }
      if(/Failed to send|NetworkError|Failed to fetch/i.test(m))
        m='Sunucuya ulaşılamadı. “sifre-belirle” fonksiyonu yayında mı, internet bağlantınız var mı kontrol edin.';
      else if(kod==='404')
        m='Sunucu fonksiyonu bulunamadı. Supabase üzerinde “sifre-belirle” fonksiyonunu yayınlamanız gerekiyor.';
      return err(m);
    }
    if(r.data&&r.data.error)return err(r.data.error);
    closeDlg();toast('Şifre belirlendi');
  }catch(e){dlgState.calisiyor=false;err(String(e&&e.message?e.message:e));}
}

   İki durum: profili var ama personele bağlı değil; ya da profili hiç
   yok — "Erişimi kaldır" denmiş, geriye yalnız giriş hesabı kalmış.
   İkincisi listede hiç görünmüyordu ve kişi aynı e-postayla yeniden
   hesap açamıyordu. Liste sunucudaki dar bir işlevden gelir; 60
   numaralı dosya çalıştırılmadıysa boş kalır ve ekran eskisi gibi
   çalışır. */
let _bosHesap=null,_bosHesapIsi=null,_bosHesapHata='';
function bosHesapGetir(zorla){
  if(zorla){_bosHesap=null;_bosHesapIsi=null;_bosHesapHata='';}
  if(_bosHesap)return Promise.resolve(_bosHesap);
  if(_bosHesapIsi)return _bosHesapIsi;
  _bosHesapIsi=sb.rpc('master_eslesmemis_hesaplar').then(r=>{
    _bosHesapHata=r.error?dbErr(r.error):'';
    _bosHesap=r.error?[]:(r.data||[]);
    _bosHesapIsi=null;return _bosHesap;
  }).catch(e=>{_bosHesapHata=(e&&e.message)||'Liste alınamadı.';
    _bosHesap=[];_bosHesapIsi=null;return _bosHesap;});
  return _bosHesapIsi;
}
function bosHesapBolumu(){
  if(!isMaster())return '';
  if(_bosHesap===null){
    bosHesapGetir().then(()=>{if(state&&state.view==='kullanici')render();});
    return '<section class="panel"><div class="panel-h"><h2>Eşleştirilmemiş hesaplar</h2></div>'+
      '<div class="panel-b muted">Yükleniyor…</div></section>';
  }
  const list=_bosHesap.slice();
  const zaman=t=>t?fmtDate(String(t).slice(0,10)):'<span class="muted">—</span>';
  return '<section class="panel"><div class="panel-h"><div><h2>Eşleştirilmemiş hesaplar</h2>'+
    '<p class="muted sm">Bir personel kaydına bağlanmamış giriş hesapları. Silmek hesabı tamamen kaldırır; kişi aynı e-posta ile yeniden hesap açabilir.</p></div>'+
    '<button class="btn sm" data-act="bos-hesap-yenile">Yenile</button></div>'+
    (_bosHesapHata
      ?'<div class="panel-b"><p class="hint">Liste alınamadı: '+esc(_bosHesapHata)+' Bu bölüm için <b>60-hesap-sil.sql</b> dosyasının çalıştırılmış olması gerekir.</p></div>'

const girisTarihi=l=>String(l.createdAt||'').slice(0,10);
const girisDonemde=(l,p)=>p==='all'||girisTarihi(l).startsWith(p);
function kullaniciEmp(userId){
  if(!userId)return null;
  const u=(db.users||[]).find(x=>x.userId===userId);
  return u?u.employeeId:null;
}
function leadSatisaDondu(l){
  return !!l.customerId&&db.sales.some(s=>s.customerId===l.customerId);
}
function girisRaporRows(period){
  const m={};
  (db.leads||[]).filter(l=>girisDonemde(l,period)).forEach(l=>{
    const eid=kullaniciEmp(l.createdBy);
    const key=eid||('u:'+(l.createdBy||'yok'));
    const g=m[key]||(m[key]={key:key,eid:eid,userId:l.createdBy,
      elle:0,excel:0,toplam:0,aranan:0,randevu:0,musteri:0,satis:0});
    g.toplam++;
    if(l.kaynakTip==='excel')g.excel++;else g.elle++;
    if(l.sonArama)g.aranan++;
    if(l.durum==='Randevu alındı'||l.durum==='Müşteriye aktarıldı')g.randevu++;
    if(l.customerId)g.musteri++;
    if(leadSatisaDondu(l))g.satis++;
  });
  return Object.keys(m).map(k=>m[k]).map(g=>{
    const e=g.eid?emp(g.eid):null;
    const u=(db.users||[]).find(x=>x.userId===g.userId);
    g.ad=e?e.name:(u&&u.email?u.email:'Bilinmeyen kullanıcı');
    g.altAd=e?((dept(e.departmentId)||{}).name||''):'Personel kaydına bağlı değil';
    return g;
  }).sort((a,b)=>b.elle-a.elle||b.toplam-a.toplam);
}
function girisRaporToplam(rows){
  const t={elle:0,excel:0,toplam:0,aranan:0,randevu:0,musteri:0,satis:0};
  rows.forEach(r=>Object.keys(t).forEach(k=>{t[k]+=r[k];}));
  return t;
}

function gelirMaliyetRows(period){
  const ay=period!=='all',fin=isFinans();
  /* Dönemin gider hareketleri bir kez okunup personele göre gruplanır;
     her personel için listeyi yeniden süzmek 50 kişide yavaştı.
     source='tamir' olanlar zimmetli envanterin bakım masrafıdır,
     ayrı sütunda gösterilir. */
  const dog={},zim={};
  if(fin)expenses(period).forEach(t=>{
    if(!t.employeeId)return;
    const h=(t.source==='tamir'||t.category===CAT_ENV)?zim:dog;
    h[t.employeeId]=(h[t.employeeId]||0)+t.amount;
  });
  const dag=fin?dagitimOzeti(period):{pay:0};
  const ss=salesIn(period);
  return aktifPersonel().map(e=>{
    const gelir=personelGelir(e.id,period);
    const maas=(fin&&ay)?(e.salary||0):0;
    const gider=fin?(dog[e.id]||0):0;
    const zimmet=fin?(zim[e.id]||0):0;
    const dagitilan=(fin&&sahaPersoneliMi(e))?dag.pay:0;
    const maliyet=maas+gider+zimmet+dagitilan;
    return {e,gelir,maliyet,maas,gider,zimmet,dagitilan,net:gelir-maliyet,
            satis:ss.filter(x=>x.employeeId===e.id).length,
            randevuKatkisi:ss.filter(x=>x.gelirAlanId===e.id).length};
  }).filter(r=>r.gelir||r.maliyet||r.satis).sort((a,b)=>b.net-a.net);
}

const XL_HAZIR=()=>typeof XLSX!=='undefined';
const dIso=iso=>{const p=String(iso||'').split('-');return p.length===3?new Date(+p[0],+p[1]-1,+p[2]):'';};

function seriOf(sale){
  return (sale.items||[]).map(it=>(byId(db.stock,it.unitId)||{}).serial).filter(Boolean).join(', ');
}
/* Bir toplamı parçalara bölerken kuruş kaybolmasın: her parça iki
   haneye yuvarlanır, artan fark ilk satıra eklenir. Böylece sütun
   toplamı gerçek toplamla birebir aynı kalır. */
function pay(toplam,adet){
  const t=num(toplam),n=Math.max(1,adet);
  if(!t)return new Array(n).fill(0);
  const birim=Math.round((t/n)*100)/100;
  const out=new Array(n).fill(birim);
  out[0]=Math.round((t-birim*(n-1))*100)/100;
  return out;
}

function sheetOf(aoa,dateCols,widths){
  const ws=XLSX.utils.aoa_to_sheet(aoa,{cellDates:true});
  const ref=XLSX.utils.decode_range(ws['!ref']);
  for(let r=1;r<=ref.e.r;r++)dateCols.forEach(c=>{
    const cell=ws[XLSX.utils.encode_cell({r:r,c:c})];
    if(cell&&cell.t==='d')cell.z='dd.mm.yyyy';
  });
  ws['!cols']=widths.map(w=>({wch:w}));
  ws['!autofilter']={ref:ws['!ref']};
  ws['!freeze']={xSplit:0,ySplit:1};
  return ws;
}

/* ---------------------------------------------------------------
   HAKEDİŞ MUTABAKATI
   Operatörün aktivasyon raporu (Excel) ile sisteme girilen satışları
   karşılaştırır. Anahtar, raporda "İşlem Numarası" sütunu: mobilde
   telefon numarası, DSL/PSTN'de hizmet numarası. Sistemde bunun
   karşılığı satış satırındaki abone/hizmet numarasıdır.

   Bir numara raporda birden çok kalem üretebilir (aynı PSTN hattı hem
   "Taahhüt" hem "Upsell" satırı doğuruyor), bu yüzden karşılaştırma
   numara bazında yapılır ve kalemler altında yan yana gösterilir.

   Üç sonuç:
     · eşleşen            — iki tarafta da var
     · operatörde var     — aktivasyon olmuş, kimse kaydetmemiş
                            (gelir ve prim hesabının dışında kalmış)
     · sistemde var       — girilmiş ama aktive olmamış
                            (prim ödendiyse karşılığı gelmemiş)

   "Sistemde var" listesi raporun tarih aralığıyla sınırlanır; yoksa
   bütün geçmiş satışlar eksikmiş gibi görünürdü. Aktivasyon tarihiyle
   kayıt tarihi birkaç gün ayrışabildiği için aralığa pay eklenir. */
const MUT_PAY_GUN=7;
/* Numara normalleştirme: rakam dışı atılır, 90 ve baştaki 0 düşer */
function mutNo(x){
  let d=String(x==null?'':x).replace(/\D/g,'');
  if(d.length===12&&d.slice(0,2)==='90')d=d.slice(2);
  if(d.length===11&&d[0]==='0')d=d.slice(1);
  return d;
}
const mutBaslik=x=>String(x==null?'':x).replace(/[İIı]/g,'i').toLowerCase()
  .replace(/ş/g,'s').replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ö/g,'o')
  .replace(/ç/g,'c').replace(/[^a-z0-9]/g,'');
/* Excel'deki sütunu başlık adına göre bulur; başlık birebir aynı
   olmasa da (boşluk, büyük harf, noktalama) tutturur. */
function mutSutun(bas,adlar){
  const n=bas.map(mutBaslik);
  for(const a of adlar){const k=mutBaslik(a),i=n.indexOf(k);if(i>=0)return i;}
  for(const a of adlar){const k=mutBaslik(a);
    const i=n.findIndex(x=>x&&k&&(x.indexOf(k)>=0||k.indexOf(x)>=0));if(i>=0)return i;}
  return -1;
}
/* Excel tarihini 'YYYY-MM-DD' yapar.
   İki tuzak var:
     · XLSX tarih hücresini kayan noktadan çözerken gece yarısını
       ıskalayabiliyor: 2026-10-04 00:00:00 hücresi tarayıcıda
       "2026-10-03 23:59:04" olarak geliyor. Gece yarısına iki
       dakikadan yakın değerler en yakın güne yuvarlanır.
     · toISOString() UTC'ye çevirdiği için Türkiye saatinde bir gün
       daha geri kaydırırdı; yerel gün bileşenleri kullanılıyor. */
function mutTarih(x){
  if(x instanceof Date&&!isNaN(x)){
    const d=new Date(x.getTime());
    const dk=d.getHours()*60+d.getMinutes();
    if(dk>=23*60+58)d.setTime(d.getTime()+(24*60-dk)*60000);   /* gece yarısına yuvarla */
    else if(dk<=2)d.setTime(d.getTime()-dk*60000);
    const ik=n=>String(n).padStart(2,'0');
    return d.getFullYear()+'-'+ik(d.getMonth()+1)+'-'+ik(d.getDate());
  }
  const t=String(x==null?'':x).trim();
  let m=t.match(/^(\d{4})-(\d{2})-(\d{2})/);           if(m)return m[1]+'-'+m[2]+'-'+m[3];
  m=t.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})/);
  if(m)return m[3]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0');
  return '';
}
/* toISOString() UTC'ye çevirip Türkiye saatinde bir gün geri
   kaydırıyordu; yerel gün bileşenleri kullanılıyor. */
const gunEkle=(iso,n)=>{const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);
  const ik=x=>String(x).padStart(2,'0');
  return d.getFullYear()+'-'+ik(d.getMonth()+1)+'-'+ik(d.getDate());};

/* Excel'i okuyup kalemlere çevirir */
function mutOku(aoa){
  if(!aoa||aoa.length<2)return {hata:'Dosyada satır bulunamadı.'};
  const bas=aoa[0]||[];
  const iNo =mutSutun(bas,['İşlem Numarası','Islem Numarasi']);
  const iTar=mutSutun(bas,['Aktivasyon Tarihi']);
  if(iNo<0)return {hata:'“İşlem Numarası” sütunu bulunamadı. Operatörün aktivasyon raporunu olduğu gibi yükleyin.'};
  if(iTar<0)return {hata:'“Aktivasyon Tarihi” sütunu bulunamadı.'};
  const iUrun=mutSutun(bas,['Ürün Tipi']),iIslem=mutSutun(bas,['İşlem Tipi']);
  const iTarife=mutSutun(bas,['Tarife']),iPos=mutSutun(bas,['Pos Adı']);
  const iKul=mutSutun(bas,['İşlemi Yapan Kullanıcı']),iDurum=mutSutun(bas,['Durum']);
  const al=(r,i)=>i<0?'':String(r[i]==null?'':r[i]).trim();
  const kalem=[],bozuk=[];
  for(let i=1;i<aoa.length;i++){
    const r=aoa[i];if(!r||!r.length)continue;
    const no=mutNo(r[iNo]),tar=mutTarih(r[iTar]);
    if(!no){if(String(r[iNo]||'').trim())bozuk.push(i+1);continue;}
    kalem.push({no,tarih:tar,urun:al(r,iUrun),islem:al(r,iIslem),tarife:al(r,iTarife),
                pos:al(r,iPos),kullanici:al(r,iKul),durum:al(r,iDurum),satir:i+1});
  }
  if(!kalem.length)return {hata:'Dosyada geçerli işlem numarası bulunamadı.'};
  return {kalem,bozuk};
}
/* Sistemdeki satış satırlarını numara bazında indeksler */
function mutSistemIndeks(){
  const m={};
  db.sales.forEach(s=>{
    (s.abone||[]).forEach(a=>{
      const no=mutNo(a);if(!no)return;
      (m[no]=m[no]||[]).push(s);
    });
  });
  return m;
}
/* ay='' ise dosyanın tamamı; 'YYYY-MM' ise yalnızca o ay karşılaştırılır.
   Ay seçilince dosyanın o aya ait olmayan satırları da elenir, yani
   üç aylık bir dosya yüklenip ay ay kontrol edilebilir. */
function mutKarsilastir(hepsi,ay){
  const kalem=ay?hepsi.filter(k=>k.tarih&&k.tarih.slice(0,7)===ay):hepsi;
  const idx=mutSistemIndeks();
  const tarihler=kalem.map(k=>k.tarih).filter(Boolean).sort();
  /* Ay seçiliyse pencere takvim ayıdır; yoksa dosyanın kendi aralığı */
  const ayBas=ay?ay+'-01':'',ayBit=ay?gunEkle(gunEkle(ay+'-01',32).slice(0,7)+'-01',-1):'';
  const bas=ay?gunEkle(ayBas,-MUT_PAY_GUN):(tarihler.length?gunEkle(tarihler[0],-MUT_PAY_GUN):'');
  const bit=ay?gunEkle(ayBit, MUT_PAY_GUN):(tarihler.length?gunEkle(tarihler[tarihler.length-1],MUT_PAY_GUN):'');
  /* Rapordaki numaraları grupla */
  const grup={};
  kalem.forEach(k=>{(grup[k.no]=grup[k.no]||[]).push(k);});
  const eslesen=[],operatorde=[];
  Object.keys(grup).forEach(no=>{
    const sat=idx[no]||[];
    const kayit={no,kalemler:grup[no],satislar:sat};
    if(sat.length)eslesen.push(kayit);else operatorde.push(kayit);
  });
  /* Sistemde olup raporda olmayanlar — yalnızca rapor aralığında */
  const sistemde=[];
  Object.keys(idx).forEach(no=>{
    if(grup[no])return;
    const sat=idx[no].filter(s=>(!bas||s.date>=bas)&&(!bit||s.date<=bit));
    if(sat.length)sistemde.push({no,kalemler:[],satislar:sat});
  });
  const sirala=(a,b)=>{
    const ta=(a.kalemler[0]&&a.kalemler[0].tarih)||(a.satislar[0]&&a.satislar[0].date)||'';
    const tb=(b.kalemler[0]&&b.kalemler[0].tarih)||(b.satislar[0]&&b.satislar[0].date)||'';
    return ta<tb?1:ta>tb?-1:0;
  };
  return {eslesen:eslesen.sort(sirala),operatorde:operatorde.sort(sirala),
          sistemde:sistemde.sort(sirala),bas,bit,
          ilkGun:tarihler[0]||'',sonGun:tarihler[tarihler.length-1]||'',ay:ay||'',
          dosyaKalem:hepsi.length,
          toplamKalem:kalem.length,toplamNo:Object.keys(grup).length};
}

let _mutSonuc=null,_mutHata='',_mutDosya='',_mutKalem=null,_mutAy='',_mutAylar=[];
/* Dosya bir kez okunur; ay değiştikçe yeniden yüklemeye gerek yok */
function mutHesapla(){
  if(!_mutKalem)return;
  _mutSonuc=mutKarsilastir(_mutKalem,_mutAy);
  _mutSonuc.bozuk=_mutKalem.bozuk||[];
}
function mutDosyaOku(file){
  _mutSonuc=null;_mutHata='';_mutKalem=null;_mutAy='';_mutAylar=[];
  _mutDosya=file?file.name:'';
  if(!XL_HAZIR()){_mutHata='Excel bileşeni yüklenemedi. Sayfayı yenileyin.';return render();}
  const fr=new FileReader();
  fr.onerror=()=>{_mutHata='Dosya okunamadı.';render();};
  fr.onload=ev=>{
    try{
      const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array',cellDates:true});
      const sh=wb.Sheets[wb.SheetNames[0]];
      const aoa=XLSX.utils.sheet_to_json(sh,{header:1,raw:true,defval:''});
      const o=mutOku(aoa);
      if(o.hata){_mutHata=o.hata;return render();}
      _mutKalem=o.kalem;_mutKalem.bozuk=o.bozuk||[];
      _mutAylar=[...new Set(o.kalem.map(k=>k.tarih&&k.tarih.slice(0,7)).filter(Boolean))].sort();
      /* Dosya tek aya aitse o ayı kendiliğinden seç */
      _mutAy=_mutAylar.length===1?_mutAylar[0]:'';
      mutHesapla();
    }catch(e){_mutHata='Dosya okunamadı: '+((e&&e.message)||e);}
    render();
  };
  fr.readAsArrayBuffer(file);
}
