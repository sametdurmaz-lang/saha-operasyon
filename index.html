<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D1B2A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Saha Operasyon">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="mobile-web-app-capable" content="yes">
<title>Saha Operasyon Yönetimi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F4F7; --surface:#FFFFFF; --ink:#14202B; --muted:#5A6A79; --line:#DBE1E7;
  --side:#E7ECF1; --accent:#C2410C; --accent-ink:#FFFFFF; --accent-soft:#FBEAE2;
  --bar:#0D1B2A; --bar-ink:#E8EDF3; --bar-muted:#93A7BC; --bar-active:#1D3A56; --bar-line:#1B2C3E;
  --in:#146C4E; --in-soft:#E0F2EA; --out:#A93226; --out-soft:#FBE7E4;
  --warn:#8A5600; --warn-soft:#FAEFD6; --warn-line:#D9A441;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E151D; --surface:#16202B; --ink:#E6ECF2; --muted:#93A3B3; --line:#263442;
    --side:#0B1118; --accent:#F97316; --accent-ink:#1A0D05; --accent-soft:#3A2113;
    --bar:#080E15; --bar-ink:#E6ECF2; --bar-muted:#8496A8; --bar-active:#17293A; --bar-line:#16222E;
    --in:#4CC38F; --in-soft:#14332A; --out:#F0806F; --out-soft:#3A1D19;
    --warn:#E8B85C; --warn-soft:#38290E; --warn-line:#B98A2E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E151D; --surface:#16202B; --ink:#E6ECF2; --muted:#93A3B3; --line:#263442;
  --side:#0B1118; --accent:#F97316; --accent-ink:#1A0D05; --accent-soft:#3A2113;
  --bar:#080E15; --bar-ink:#E6ECF2; --bar-muted:#8496A8; --bar-active:#17293A; --bar-line:#16222E;
  --in:#4CC38F; --in-soft:#14332A; --out:#F0806F; --out-soft:#3A1D19;
  --warn:#E8B85C; --warn-soft:#38290E; --warn-line:#B98A2E;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:14px/1.45 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:'Space Grotesk','IBM Plex Sans',system-ui,sans-serif;margin:0;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
p{margin:0}
.muted{color:var(--muted)} .sm{font-size:12.5px} .nowrap{white-space:nowrap}
.in{color:var(--in)} .out{color:var(--out)}

.shell{display:flex;flex-direction:column;min-height:100vh}
/* Telefonda çentik ve alt çubuk altında içerik kalmasın */
.side{padding-top:env(safe-area-inset-top)}
.main{padding-left:calc(24px + env(safe-area-inset-left));
      padding-right:calc(24px + env(safe-area-inset-right));
      padding-bottom:calc(64px + env(safe-area-inset-bottom))}
.side{background:var(--bar);color:var(--bar-ink);border-bottom:1px solid var(--bar-line);
  padding:0 20px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:18px;
  position:sticky;top:0;z-index:20;min-height:56px}
.brand{display:flex;gap:9px;align-items:center;flex:none}
.mark{width:28px;height:28px;border-radius:7px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand b{display:block;font-family:'Space Grotesk','IBM Plex Sans',sans-serif;font-size:15px;font-weight:600;line-height:1.15;letter-spacing:-.01em}
.brand span{display:none}
.side nav{display:flex;flex-wrap:wrap;gap:2px;flex:1 1 auto;min-width:0;padding:8px 0}
.nav-group{position:relative;display:inline-flex}
.nav-title{display:none}
.nav-ust{gap:5px}
.nav-ust .ok{font-size:10px;opacity:.7;line-height:1}
.nav-group.acik .nav-ust{background:var(--bar-active);color:#fff}
.nav-menu{display:none;position:absolute;top:calc(100% + 6px);left:0;z-index:60;
  min-width:210px;padding:6px;background:var(--surface);border:1px solid var(--line);
  border-radius:10px;box-shadow:0 10px 28px rgba(13,27,42,.18);flex-direction:column;gap:2px}
.nav-group.acik .nav-menu{display:flex}
.nav-menu .nav{width:100%;justify-content:flex-start;color:var(--ink);font-weight:500;padding:8px 10px;border-radius:7px}
.nav-menu .nav:hover:not([disabled]){background:var(--accent-soft);color:var(--ink)}
.nav-menu .nav[aria-current="page"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.nav{display:inline-flex;align-items:center;gap:6px;width:auto;text-align:left;padding:7px 11px;border:0;
  background:transparent;border-radius:7px;color:var(--bar-muted);font-weight:500;white-space:nowrap}
.nav:hover:not([disabled]){background:var(--bar-active);color:var(--bar-ink)}
.nav[aria-current="page"]{background:var(--bar-active);box-shadow:none;color:#fff;font-weight:600}
.nav[disabled]{color:var(--bar-muted);opacity:.5;cursor:default}
.later{display:none}
.tag{font-size:11.5px;color:var(--bar-muted);border:1px solid var(--bar-line);border-radius:999px;padding:0 7px}
.side-foot{margin:0 0 0 auto;display:flex;flex-direction:row;align-items:center;gap:10px;padding:0;flex:none}
.side-foot p{font-size:12px;color:var(--bar-muted)}
.side-foot .who{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2;gap:1px}
.side-foot .who .sm{font-size:11.5px}
.side-foot .who b{font-size:12.5px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-foot .who .muted{color:var(--bar-muted)}
.side-foot .btn{background:transparent;border-color:var(--bar-line);color:var(--bar-ink)}
.side-foot .btn:hover{background:var(--bar-active)}

.main{padding:22px 24px 64px;max-width:1440px;width:100%;margin:0 auto}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-head h1{font-size:30px;font-weight:600;letter-spacing:-.02em}
.sub{color:var(--muted);margin-top:4px;max-width:62ch}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:16px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:17px;font-weight:600}
.panel-b{padding:14px 16px}
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:16px}
.scroll{overflow-x:auto}

table{width:100%;border-collapse:collapse}
thead th{background:var(--paper)}
th{font-weight:600;color:var(--muted);text-align:left;padding:8px 14px;border-bottom:1px solid var(--line);
  white-space:nowrap;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
.num{text-align:right;white-space:nowrap}
th.num{text-align:right}
tr.click{cursor:pointer}
tr.click:hover{background:var(--accent-soft)}
tr.total td{font-weight:600;border-top:1px solid var(--line)}
tr.total-top td{font-weight:600;border-top:0;border-bottom:2px solid var(--line);background:var(--paper)}
.plain td{padding:8px 16px}

.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--out);border-color:var(--out)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:focus-visible,.nav:focus-visible,input:focus-visible,select:focus-visible,.bar-row:focus-visible,.chip:focus-visible,tr.click:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
.tools select,.tools input{width:auto}
tr.sel{background:var(--accent-soft)}
.preview{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-weight:500}
.preview.sm{font-weight:400;font-size:13px;padding:8px 12px;margin-top:12px}
.sline{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:12px;background:var(--paper)}
.sline-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sline-h b{font-size:14px}
.hcell{display:flex;flex-direction:column;align-items:flex-end;gap:3px;padding:6px 4px;border:0;background:transparent;width:100%;text-align:right;border-radius:6px;min-width:92px}
.hcell:hover{background:var(--accent-soft)}
.hcell.salt{cursor:default}
.hcell.salt:hover{background:transparent}
.hbar{display:block;width:100%;height:5px;background:var(--paper);border-radius:3px;overflow:hidden}
.hbar span{display:block;height:100%;background:var(--accent)}
.svc-chip{display:inline-block;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:12px;margin:0 4px 4px 0}
textarea{resize:vertical}
.clamp{max-width:38ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left;min-width:150px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.chip span{font-size:12.5px;color:var(--muted)}
.chip b{font-size:16px;font-family:'Space Grotesk','IBM Plex Sans',sans-serif;font-weight:600}

.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:500;background:var(--paper);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--in-soft);color:var(--in);border-color:transparent}
.badge.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.badge.bad{background:var(--out-soft);color:var(--out);border-color:transparent}

.kpis{display:flex;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:16px}
.kpi{flex:1 1 170px;padding:12px 16px;border-right:1px solid var(--line)}
.kpi:last-child{border-right:0}
button.kpi{font:inherit;text-align:left;background:none;cursor:pointer;border-top:0;border-bottom:0;border-left:0}
button.kpi:hover{background:var(--surface-2,#f3f5f8)}
button.kpi[aria-pressed="true"]{background:var(--surface-2,#eef2f7);box-shadow:inset 0 -3px 0 var(--brand,#c0431a)}
button.kpi span{text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}
.kpi span{display:block;color:var(--muted);font-size:12.5px}
.kpi b{font-family:'Space Grotesk','IBM Plex Sans',sans-serif;font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.15}

.bar-row{display:grid;grid-template-columns:minmax(110px,220px) minmax(60px,1fr) auto;gap:14px;align-items:center;width:100%;padding:8px 8px;border:0;background:transparent;text-align:left;border-radius:8px}
.bar-row:hover{background:var(--accent-soft)}
.bar-track{height:16px;background:var(--paper);border-radius:4px;overflow:hidden}
.bar-fill{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar-fill.none{background:repeating-linear-gradient(45deg,var(--warn-line) 0 6px,transparent 6px 12px);border:1px solid var(--warn-line)}
.bar-val{font-weight:600;white-space:nowrap;text-align:right;min-width:128px}
.bar-val small{font-weight:400;color:var(--muted);margin-left:6px}

.meter-row{padding:10px 16px}
.meter-row div:first-child{display:flex;justify-content:space-between;margin-bottom:5px}
.meter{height:8px;background:var(--paper);border-radius:4px;overflow:hidden}
.meter span{display:block;height:100%;background:var(--in);border-radius:4px}

.att{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.att:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--warn-line)}
.dot.bad{background:var(--out)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.hint{color:var(--muted);font-size:12.5px;margin-top:10px}

dialog{border:1px solid var(--line);border-radius:12px;padding:0;background:var(--surface);color:var(--ink);width:min(840px,calc(100vw - 24px));max-height:none}
dialog[open]{display:block}
dialog::backdrop{background:rgba(10,18,28,.55)}
.dlg-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:16px 20px;border-bottom:1px solid var(--line)}
.dlg-h h2{font-size:19px;font-weight:600}
.dlg-b{padding:18px 22px;overflow-y:auto;max-height:calc(100vh - 210px)}
.dlg-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.hint.full{grid-column:1/-1;margin:0}
#harita{height:600px;border-radius:10px;overflow:hidden;background:var(--paper)}
@media (max-width:860px){#harita{height:440px}}
.harita-yok{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);padding:20px;text-align:center}
.lejant{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.lejant i{display:inline-block;width:80px;height:9px;border-radius:5px;background:linear-gradient(90deg,#2563EB,#22C55E,#FACC15,#EF4444)}
.lejant{flex-wrap:wrap;gap:6px}
.lejant b{color:var(--ink);font-weight:600}
.lejant-ara{display:inline-block;width:1px;height:12px;background:var(--line);margin:0 4px}
.leaflet-popup-content{font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:13px;margin:10px 12px}
.leaflet-popup-content b{font-size:14px}
.arac-pin{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;
  border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);color:#fff;font-size:11px;font-weight:600}
.arac-etiket{display:inline-block;transform:translate(-50%,-50%);padding:4px 10px;border-radius:999px;
  border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.35);color:#fff;font-size:11.5px;font-weight:600;
  white-space:nowrap;letter-spacing:.01em;line-height:1.25}
.arac-etiket:hover{filter:brightness(1.08)}
.rnd-pin{display:inline-flex;align-items:center;gap:4px;transform:translate(-14px,-14px);white-space:nowrap}
.rnd-pin .nk{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;
  padding:0 5px;border-radius:999px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);
  color:#fff;font-size:12px;font-weight:700;line-height:1}
.rnd-pin .yn{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:6px;
  padding:2px 6px;font-size:11px;font-weight:600;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.rnd-pin:hover .nk{filter:brightness(1.08)}
.badge.metro{background:#EDE9FE;color:#6D28D9;border-color:#DDD6FE}
.hrt-bekleyen:not(:empty){padding:10px 14px;border-top:1px solid var(--line);
  font-size:13px;color:var(--muted);background:var(--paper)}
.yeni-surum{position:fixed;left:50%;transform:translateX(-50%);z-index:90;
  bottom:calc(16px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;
  background:var(--bar);color:var(--bar-ink);padding:10px 12px 10px 16px;border-radius:12px;
  box-shadow:0 8px 24px rgba(13,27,42,.3);font-size:14px}
.field label{font-weight:500;font-size:13.5px}
.err{color:var(--out);font-size:13px;min-height:18px;margin-top:10px}
.dsec{padding:12px 0;border-bottom:1px solid var(--line)}
.dsec:last-child{border-bottom:0}
.dsec h3{font-size:14.5px;font-weight:600;margin-bottom:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row select{flex:1 1 180px;width:auto}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.log li{display:grid;grid-template-columns:86px 1fr;gap:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin-bottom:12px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500;text-align:right}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#toast.show{opacity:1}

/* Giriş ekranı */
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.auth-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;width:min(400px,100%)}
.auth-card .brand{margin-bottom:18px;padding:0}
.auth-card h1{font-size:21px;font-weight:600;margin-bottom:4px}
.auth-card .sub{margin-bottom:18px}
.auth-card .field{margin-bottom:12px}
.auth-card .btn{width:100%;padding:10px;margin-top:6px}
.auth-note{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.who{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.who b{font-size:13px;overflow:hidden;text-overflow:ellipsis}
.menu-btn{display:none;width:40px;height:40px;align-items:center;justify-content:center;border:0;background:transparent;color:var(--bar-ink);border-radius:9px;font-size:19px;line-height:1;cursor:pointer}
.menu-btn:hover{background:var(--bar-active)}
.ro-banner{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn-line);border-radius:8px;padding:9px 14px;margin-bottom:16px;font-size:13px}

@media (max-width:980px){.grid2{grid-template-columns:1fr}}
/* ---------- Hedef kutucukları (kişisel görünüm, telefon) ---------- */
.hdf-kart-alan{display:none}
.hdf-kartlar{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:12px}
.hdf-kart{display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:14px;
  background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line)}
.hdf-kart.tamam{border-left-color:var(--in)}
.hdf-kart.muaf{opacity:.75}
.hk-ad{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.01em;line-height:1.2}
.hk-deger{font-size:24px;font-weight:700;line-height:1.05;letter-spacing:-.02em}
.hk-deger small{font-size:14px;font-weight:600;color:var(--muted)}
.hk-bar{display:block;height:7px;border-radius:999px;background:var(--paper);overflow:hidden;margin-top:2px}
.hk-bar span{display:block;height:100%;border-radius:999px;background:var(--accent)}
.hdf-kart.tamam .hk-bar span{background:var(--in)}
.hk-alt{font-size:12px;color:var(--muted);line-height:1.2}
.hk-alt.tamam{color:var(--in);font-weight:600}
/* ---------- Randevu kartları (saha personeli, telefon) ----------
   Telefonda tablo okunmuyordu; her randevu dokunulabilir bir kart.
   Masaüstünde tablo görünür, kartlar gizlidir. */
.rnd-kart-alan{display:none}
/* 375 px telefonda iki sütun sığsın diye alt sınır 150 px */
.rnd-kartlar{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:12px}
.rnd-kart{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-height:128px;
  padding:14px;border-radius:14px;cursor:pointer;text-align:left;font:inherit;
  background:var(--surface);border:1px solid var(--line);color:var(--ink);
  border-left:5px solid var(--line);
  box-shadow:0 1px 2px rgba(13,27,42,.05);transition:transform .08s,box-shadow .12s}
.rnd-kart:hover{box-shadow:0 4px 14px rgba(13,27,42,.10)}
.rnd-kart:active{transform:scale(.985)}
.rnd-kart:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.rnd-kart.bugun{border-left-color:#D97706}
.rnd-kart.gecti{border-left-color:#DC2626}
.rk-tarih{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.01em}
.rnd-kart.gecti .rk-tarih{color:#DC2626}
.rnd-kart.bugun .rk-tarih{color:#B45309}
.rk-ad{font-size:14.5px;font-weight:600;line-height:1.25;margin:2px 0 2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rk-yer{font-size:12.5px;color:var(--muted);line-height:1.2;margin-bottom:4px;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.rk-bilgi{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;font-size:13px;color:var(--muted)}
.rk-bilgi b{font-size:17px;color:var(--ink);font-weight:700}
.rk-metro{color:#7C3AED!important}
.rk-eylem{margin-top:auto;padding-top:8px;font-size:12.5px;font-weight:600;color:var(--accent)}
.rk-eylem.kapali{color:var(--muted);font-weight:500}
/* Sonuç düğmeleri telefonda büyük ve iki sütun */
@media (max-width:860px){
  #cl-sonuc{display:grid;grid-template-columns:1fr 1fr;gap:8px;border:0;background:transparent;overflow:visible}
  #cl-sonuc button{min-height:60px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;
    background:var(--surface);font-size:14px;font-weight:600;line-height:1.25;text-align:center}
  #cl-sonuc button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
}
/* ---------- Saha personeli ana sayfası: büyük düğmeler ---------- */
.ana-sayfa{max-width:720px;margin:0 auto}
.ana-ust{margin-bottom:18px}
.ana-ust h1{font-size:26px;margin:0 0 4px}
.ana-ust p{margin:0;font-size:15px}
.ana-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.ana-kutu{display:flex;flex-direction:column;align-items:flex-start;gap:2px;
  min-height:132px;padding:18px 16px;border-radius:16px;cursor:pointer;text-align:left;
  background:var(--surface);border:1px solid var(--line);color:var(--ink);
  box-shadow:0 1px 2px rgba(13,27,42,.05);transition:transform .08s,box-shadow .12s,border-color .12s}
.ana-kutu:hover{border-color:var(--accent);box-shadow:0 4px 14px rgba(13,27,42,.10)}
.ana-kutu:active{transform:scale(.985)}
.ana-kutu:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ana-ikon{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;
  border-radius:12px;background:var(--accent-soft);color:var(--accent);margin-bottom:8px}
.ana-ikon svg{width:24px;height:24px}
.ana-ad{font-size:15px;font-weight:600;line-height:1.2}
.ana-sayi{font-size:30px;font-weight:700;line-height:1.05;letter-spacing:-.02em}
.ana-alt{font-size:12.5px;color:var(--muted);line-height:1.2}
/* Tek kalan kutu satırı doldurur */
.ana-grid .ana-kutu:last-child:nth-child(odd){grid-column:1/-1;min-height:104px;
  flex-direction:row;align-items:center;gap:14px}
.ana-grid .ana-kutu:last-child:nth-child(odd) .ana-ikon{margin:0}
/* Hesap düğmeleri yalnızca telefonda; masaüstünde üst çubukta zaten var */
.ana-alt-bar{display:none;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  margin-top:22px;padding-top:16px;border-top:1px solid var(--line);font-size:13.5px}
.anasayfa-btn{display:none;align-items:center;gap:8px;justify-self:end;height:44px;padding:0 14px;
  border:0;border-radius:10px;cursor:pointer;background:var(--bar-active);color:var(--bar-ink);
  font:inherit;font-size:14px;font-weight:600}
@media (max-width:860px){
  .main{max-width:100%;min-width:0}
  .side{min-width:0;position:static;gap:8px;align-items:start;
    padding:calc(8px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 8px calc(12px + env(safe-area-inset-left))}
  .side{grid-template-columns:auto 1fr auto}
  .menu-btn{display:inline-flex;justify-self:end;width:44px;height:44px;flex:none}
  .side nav{grid-column:1/-1;order:3;display:none;padding:0 0 6px}
  .side.acik nav{display:flex}
  .nav-group{display:block;width:100%}
  .nav-ust{display:none}
  .nav-menu{display:flex!important;position:static;min-width:0;padding:0;background:transparent;
    border:0;box-shadow:none;flex-direction:row;flex-wrap:wrap;gap:2px}
  .nav-menu .nav{width:auto;color:var(--bar-muted);padding:6px 9px}
  .nav-menu .nav:hover:not([disabled]){background:var(--bar-active);color:var(--bar-ink)}
  .nav-menu .nav[aria-current="page"]{background:var(--bar-active);color:#fff}
  .side-foot{display:none}
  .side.acik .side-foot{display:flex;grid-column:1/-1;order:4;flex-wrap:wrap;margin:0 0 6px}
  .nav{padding:6px 9px;font-size:13.5px}
  .side-foot .who{display:none}
  .main{padding:18px calc(14px + env(safe-area-inset-left)) calc(56px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-right))}
  .bar-row{grid-template-columns:1fr auto}
  .bar-row .bar-track{grid-column:1/-1;order:3}
  .rnd-pin .yn{display:none}   /* dar ekranda pin yanı gizlenir; bilgi baloncukta */
  .fields{grid-template-columns:1fr}
  /* Saha personeli: menü yok, tek "Ana sayfa" düğmesi */
  .side.sade .menu-btn{display:none}
  .side.sade nav{display:none!important}
  .side.sade .side-foot{display:none}
  .side.sade .anasayfa-btn{display:inline-flex}
  .ana-alt-bar{display:flex}
  /* Telefonda kartlar görünür, tablo gizlenir */
  .rnd-kart-alan{display:block}
  .rnd-tablo-alan{display:none}
  .hdf-kart-alan{display:block}
  .hdf-tablo-alan{display:none}
  .ana-grid{gap:12px}
  .ana-kutu{min-height:124px;padding:16px 14px}
  .ana-ust h1{font-size:23px}
}
@media (max-width:360px){
  .ana-grid{grid-template-columns:1fr}
  .ana-grid .ana-kutu:last-child:nth-child(odd){min-height:124px;flex-direction:column;align-items:flex-start;gap:2px}
  .ana-grid .ana-kutu:last-child:nth-child(odd) .ana-ikon{margin-bottom:8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* PostgREST bir istekte en çok 1000 satır döndürüyor. Sayfaları tek tek
   beklemek yerine, ilk sayfa doluysa kalanları paralel çekiyoruz.
   Tek sayfalık tablolar (çoğu) tek istekte ve sayım maliyeti olmadan gelir. */
async function q(t){
  const N=1000,key=PK_KOLON[t]||'id';
  const sayfa=(a,b)=>sb.from(t).select('*').order(key,{ascending:true}).range(a,b);
  const ilk=await sayfa(0,N-1);
  if(ilk.error)throw new Error(t+': '+ilk.error.message);
  let out=ilk.data||[];
  if(out.length<N)return out;            /* tabloların çoğu burada biter */
  /* İlk sayfa dolu. Kalan sayfaları tek tek beklemek yerine körlemesine
     ama paralel istiyoruz; her turda istek sayısını katlayarak büyük
     tablolarda tur sayısını düşürüyoruz.
     İlk tur ikiyle başlıyor: üç sayfalık bir tabloda fazladan sorgu
     üretmiyor ve aynı anda açılan ağır sorgu sayısını düşük tutuyor.
     Yetki kuralı pahalı olan tablolarda eşzamanlı üç sorgu, sunucu
     tarafında ifade zaman aşımına kadar gidebiliyordu. */
  let bas=N,adet=2;
  for(;;){
    const isler=[];
    for(let i=0;i<adet;i++)isler.push(sayfa(bas+i*N,bas+(i+1)*N-1));
    const turlar=await Promise.all(isler);
    let bitti=false;
    for(const r of turlar){
      if(r.error)throw new Error(t+': '+r.error.message);
      const d=r.data||[];
      out=out.concat(d);
      if(d.length<N)bitti=true;
    }
    if(bitti)return out;
    bas+=adet*N;adet=Math.min(adet*2,16);
  }
}

let _leadsOnbellek=null,_leadsZaman=0,_leadsKirli=true;
const LEADS_TAZELIK=3*60*1000;
function leadsKirlet(){_leadsKirli=true;}
/* Tek bir potansiyel müşteri değiştiğinde 2000 satırı yeniden indirmek
   yerine önbelleği yerinde düzeltiyoruz. leads üzerinde yalnızca
   BEFORE INSERT tetikleyicisi var, bu yüzden güncelleme ve silme
   sonucu birebir biliniyor. Ekleme sunucunun döndürdüğü satırı kullanır. */
function leadsEkle(r){ if(_leadsOnbellek&&r)_leadsOnbellek=_leadsOnbellek.concat([r]); else leadsKirlet(); }
function leadsYama(id,row){ if(!_leadsOnbellek)return leadsKirlet();
  _leadsOnbellek=_leadsOnbellek.map(x=>x.id===id?{...x,...row}:x); }
function leadsCikar(id){ if(!_leadsOnbellek)return leadsKirlet();
  _leadsOnbellek=_leadsOnbellek.filter(x=>x.id!==id); }
async function leadsGetir(zorla){
  const bayat=Date.now()-_leadsZaman>LEADS_TAZELIK;
  if(!zorla&&!_leadsKirli&&!bayat&&_leadsOnbellek)return _leadsOnbellek;
  const r=await q('leads');
  _leadsOnbellek=r;_leadsZaman=Date.now();_leadsKirli=false;
  return r;
}

function addTx(o){
  const t={id:uid('t'),date:o.date,dir:o.dir,accountId:o.accountId,category:o.category,amount:+o.amount,
    companyId:o.companyId||null,departmentId:o.departmentId||null,employeeId:o.employeeId||null,
    desc:o.desc||'',source:o.source||'manuel',refId:o.refId||null};
  db.transactions.push(t);return t.id;
}
function ctxOfEmp(id){const e=emp(id);return e?{employeeId:e.id,departmentId:e.departmentId,companyId:e.companyId}:{};}
function addTransfer(date,from,to,amount,desc){
  const ref=uid('v');
  addTx({date,dir:'out',accountId:from,category:'Virman',amount,companyId:acct(from).companyId,desc:desc||('Virman: '+acct(to).name),source:'virman',refId:ref});
  addTx({date,dir:'in',accountId:to,category:'Virman',amount,companyId:acct(to).companyId,desc:desc||('Virman: '+acct(from).name),source:'virman',refId:ref});
}
function balance(id){const a=acct(id);return a.opening+db.transactions.filter(t=>t.accountId===id).reduce((s,t)=>s+(t.dir==='in'?t.amount:-t.amount),0);}
function openAdvance(empId){
  const given=sum(db.transactions.filter(t=>t.source==='avans'&&t.employeeId===empId));
  const ded=db.payrolls.filter(p=>p.employeeId===empId).reduce((s,p)=>s+p.advanceDeducted,0);
  return Math.max(0,given-ded);
}
function addAdvance(empId,amount,date,accountId,desc){
  addTx({date,dir:'out',accountId,category:'Personel avansı',amount,...ctxOfEmp(empId),desc:desc||'Personel avansı',source:'avans'});
}
function payPayroll(empId,month,deduct,accountId,date){
  const e=emp(empId);deduct=clamp(deduct,0,Math.min(openAdvance(empId),e.salary));
  const paid=e.salary-deduct;let txId=null;
  if(paid>0)txId=addTx({date,dir:'out',accountId,category:'Maaş',amount:paid,...ctxOfEmp(empId),
    desc:monthLabel(month)+' maaşı'+(deduct?' (avans mahsubu '+money(deduct)+')':''),source:'maas'});
  db.payrolls.push({id:uid('p'),employeeId:empId,month,salary:e.salary,advanceDeducted:deduct,paid,date,txId,accountId});
}
function assetLog(a,date,text){a.log.push({date,text});}
function addRepair(assetId,date,desc,cost,accountId){
  const a=asset(assetId);
  const ctx=a.holderId?ctxOfEmp(a.holderId):{companyId:a.companyId};
  const txId=addTx({date,dir:'out',accountId,category:same(a.category,'Araç')?'Araç bakım ve tamir':'Cihaz tamir',amount:cost,...ctx,desc:a.model+' – '+desc,source:'tamir'});
  db.repairs.push({id:uid('r'),assetId,date,desc,cost,accountId,txId,employeeId:a.holderId||null});
}
function assignAsset(id,empId,date){
  const a=asset(id);a.holderId=empId||null;
  if(empId){if(a.status!=='Serviste')a.status='Kullanımda';assetLog(a,date,'Zimmetlendi: '+emp(empId).name);}
  else{if(a.status!=='Serviste')a.status='Depoda';assetLog(a,date,'Depoya alındı');}
}

/* ---------- Sorgular ---------- */
const inPeriod=(t,p)=>p==='all'||t.date.startsWith(p);
/* Kayıt zamanı sunucuda UTC tutuluyor. Gece yarısından sonra girilen
   randevu bir önceki güne düşmesin diye yerel tarihe çeviriyoruz. */
function yerelGun(iso){
  if(!iso)return '';
  const d=new Date(iso);
  if(isNaN(d))return '';
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
/* Bugün sisteme girilen (alınan) randevular. Randevunun hangi güne
   verildiğinden bağımsızdır; iptal edilenler sayılmaz. */
const bugunAlinan=()=>db.appointments.filter(a=>!iptalMi(a)&&yerelGun(a.createdAt)===TODAY);
const expenses=p=>db.transactions.filter(t=>t.dir==='out'&&t.source!=='virman'&&inPeriod(t,p));
const incomes=p=>db.transactions.filter(t=>t.dir==='in'&&t.source!=='virman'&&inPeriod(t,p));
/* ---------- Merkezi giderlerin saha personeline dağıtılması -------
   Bir personele bağlanmamış her gider merkezi sayılır: kira, faturalar,
   ofis giderleri, vergi ve zimmetli olmayan envanterin bakımı. Toplamı
   saha personeline eşit bölünür ve karlılık tablosunda "Dağıtılan gider"
   olarak görünür. Dağıtım hesaplanır, kasaya ayrı bir hareket yazılmaz;
   böylece aynı tutar iki kez gider sayılmaz. */
const merkeziGider=p=>expenses(p).filter(t=>!t.employeeId);
/* Payı paylaşan personel: yalnızca aktif saha personeli */
const dagitimKapsami=()=>aktifPersonel().filter(sahaPersoneliMi);
function dagitimOzeti(p){
  const toplam=sum(merkeziGider(p)),kisi=dagitimKapsami().length;
  return {toplam,kisi,pay:kisi?toplam/kisi:0,adet:merkeziGider(p).length};
}
function monthsList(){
  const s=new Set(db.transactions.map(t=>t.date.slice(0,7)));
  db.sales.forEach(x=>x.date&&s.add(x.date.slice(0,7)));
  db.appointments.forEach(x=>x.date&&s.add(x.date.slice(0,7)));
  (db.leads||[]).forEach(x=>x.createdAt&&s.add(String(x.createdAt).slice(0,7)));
  s.add(TODAY.slice(0,7));
  return [...s].sort().reverse();
}
/* Açılışta içinde bulunulan ay seçili gelir.
   Eskiden kasa hareketlerine bakıp en son hareketin olduğu aya
   düşüyordu; ayın ilk günlerinde henüz kasa hareketi olmadığı için
   ekran bir önceki ayda açılıyordu. Üstelik dönem süzgeci satış,
   randevu ve hedef ekranlarını yönetiyor, kasayı değil. */
function defaultPeriod(){ return TODAY.slice(0,7); }
function keyFor(dim,t){return dim==='departman'?(t.departmentId||''):dim==='personel'?(t.employeeId||''):dim==='kategori'?t.category:dim==='sirket'?(t.companyId||''):t.date.slice(0,7);}
function labelFor(dim,key){
  if(dim==='departman')return key?(dept(key)||{name:'Silinmiş departman'}).name:'Departmana bağlı değil';
  if(dim==='personel')return key?(emp(key)||{name:'Silinmiş personel'}).name:'Personele bağlı değil';
  if(dim==='kategori')return key||'Kategorisiz';
  if(dim==='sirket')return key?(comp(key)||{name:'Silinmiş şirket'}).name:'Şirkete bağlı değil';
  return monthLabel(key);
}
function groupExp(list,dim){
  const m=new Map();
  list.forEach(t=>{const k=keyFor(dim,t);const g=m.get(k)||{key:k,total:0,count:0};g.total+=t.amount;g.count++;m.set(k,g);});
  const arr=[...m.values()];arr.forEach(g=>g.label=labelFor(dim,g.key));
  return dim==='ay'?arr.sort((a,b)=>a.key<b.key?1:-1):arr.sort((a,b)=>b.total-a.total);
}
function repMatch(t,r){
  if(r.company&&t.companyId!==r.company)return false;
  if(r.dept){if(r.dept==='__none'){if(t.departmentId)return false;}else if(t.departmentId!==r.dept)return false;}
  if(r.emp){if(r.emp==='__none'){if(t.employeeId)return false;}else if(t.employeeId!==r.emp)return false;}
  if(r.cat&&t.category!==r.cat)return false;
  return true;
}

/* Personel seçim listesi: departmana göre gruplanır, her grup kendi
   içinde alfabetik sıralanır. Ayrılanlar gizlenir; yalnızca seçili
   olan ayrılmışsa görünür kalır ki eski kayıt düzenlenebilsin. */
function empOptGroups(list,sel,ph,etiket){
  const gruplar={},sirasiz=[];
  list.forEach(e=>{
    const d=(dept(e.departmentId)||{}).name;
    if(d)(gruplar[d]=gruplar[d]||[]).push(e);else sirasiz.push(e);
  });
  const adlar=Object.keys(gruplar).sort((a,b)=>a.localeCompare(b,'tr',SAYISAL));
  const satir=e=>'<option value="'+esc(e.id)+'"'+(e.id===sel?' selected':'')+'>'+
    esc(etiket?etiket(e):e.name)+(ayrildi(e)?' (ayrıldı)':'')+'</option>';
  const grup=(ad,ls)=>'<optgroup label="'+esc(ad)+'">'+
    ls.slice().sort((a,b)=>a.name.localeCompare(b.name,'tr',SAYISAL)).map(satir).join('')+'</optgroup>';
  return (ph!==undefined?'<option value="">'+esc(ph)+'</option>':'')+
    adlar.map(a=>grup(a,gruplar[a])).join('')+
    (sirasiz.length?grup('Departman atanmamış',sirasiz):'');
}

/* ---------- Görünümler ---------- */
/* ---------------------------------------------------------------
   BİRİM MÜDÜRÜ GENEL BAKIŞI
   Para yok: kasa, gelir, gider, maaş ve kurulum adımları görünmez.
   Kendi ekibinin hedefleri, randevuları ve performansı; diğer
   birimlerden yalnızca toplam gerçekleşme oranları.
----------------------------------------------------------------*/
/* Saha satışçısı mı?
   Önce kullanıcı rolüne bakılır (görülebiliyorsa), yoksa departman
   adına. Departman adında "saha" geçen personel saha sayılır. */
function sahaPersoneliMi(e){
  if(!e)return false;
  /* Birim müdürleri ve Bayi Müdürü saha personeli sayılmaz */
  if(e.bayiMuduru)return false;
  if((db.birimler||[]).some(b=>b.mudurId===e.id||b.tliderId===e.id))return false;

function gelirToplamListe(list,empId){
  let t=0;
  list.forEach(s=>{
    const g=s.gelir||0;if(!g)return;
    const pay=s.gelirAlanId?(s.gelirPay||0):0;
    if(s.gelirAlanId===empId)t+=g*pay/100;
    if(s.employeeId===empId)t+=g*(100-pay)/100;
  });
  return t;
}
const primToplamListe=(list,empId)=>list.reduce((a,s)=>a+(s.employeeId===empId?(s.prim||0):0),0);
function gelirPrimSatirlari(kirilim,gun,ay){
  if(kirilim==='birim'){
    const bl=(db.birimler||[]).slice().sort((a,b)=>a.name.localeCompare(b.name,'tr',SAYISAL));
    const satir=bl.map(b=>{
      const ids=aktifPersonel().filter(e=>personelBirimi(e)===b.id).map(e=>e.id);
      return {ad:b.name,alt:ids.length+' personel',
        gGelir:ids.reduce((t,id)=>t+gelirToplamListe(gun,id),0),
        gPrim :ids.reduce((t,id)=>t+primToplamListe(gun,id),0),
        aGelir:ids.reduce((t,id)=>t+gelirToplamListe(ay,id),0),
        aPrim :ids.reduce((t,id)=>t+primToplamListe(ay,id),0)};
    });
    const bagsiz=aktifPersonel().filter(e=>!byId(db.birimler,personelBirimi(e))).map(e=>e.id);
    if(bagsiz.length)satir.push({ad:'Birime bağlı değil',alt:bagsiz.length+' personel',
      gGelir:bagsiz.reduce((t,id)=>t+gelirToplamListe(gun,id),0),
      gPrim :bagsiz.reduce((t,id)=>t+primToplamListe(gun,id),0),
      aGelir:bagsiz.reduce((t,id)=>t+gelirToplamListe(ay,id),0),
      aPrim :bagsiz.reduce((t,id)=>t+primToplamListe(ay,id),0)});
    return satir;
  }
  return aktifPersonel().map(e=>({ad:e.name,alt:(dept(e.departmentId)||{}).name||'',
    gGelir:gelirToplamListe(gun,e.id),gPrim:primToplamListe(gun,e.id),
    aGelir:gelirToplamListe(ay,e.id), aPrim:primToplamListe(ay,e.id)}));
}

function startOfWeek(dateStr){
  const d=new Date(dateStr+'T00:00:00');
  const dow=(d.getDay()+6)%7;

}

/* ---------- Randevu kapama raporu ----------
   Genel bakışın ilk raporu. "Randevu özeti" paneli randevunun hangi
   gün için ALINDIĞINI sayar; bu panel ise hangi gün KAPATILDIĞINI.
   İkisi farklı sorulardır: biri doluluk, bu ise ekibin o gün işini
   bitirip bitirmediğini gösterir.

   Kapanma günü close_date alanıdır; randevu tarihi değil. Bir
   randevu ertelenip üç hafta sonra kapanmış olabilir. */
const kapanmaGunu=a=>a&&(a.closeDate||a.date)||'';
const kapandiMi=a=>!!a&&a.status==='Kapandı';
function kapamaRaporu(list,p){
  const ids=new Set(list.map(e=>e.id));
  const benim=db.appointments.filter(a=>ids.has(a.employeeId));
  const donemde=a=>p==='all'||String(kapanmaGunu(a)).slice(0,7)===p;
  const sonuclar=RND_SONUC.filter(x=>x.kapat);
  const rows=list.map(e=>{
    const mine=benim.filter(a=>a.employeeId===e.id);
    const kapanan=mine.filter(a=>kapandiMi(a)&&donemde(a));
    const say={};sonuclar.forEach(sc=>{say[sc.k]=kapanan.filter(a=>a.sonuc===sc.k).length;});
    return {e,
      bugun:mine.filter(a=>kapandiMi(a)&&kapanmaGunu(a)===TODAY).length,
      donem:kapanan.length,
      iptal:mine.filter(a=>iptalMi(a)&&donemde(a)).length,
      belirsiz:kapanan.filter(a=>!a.sonuc).length,
      say};
  }).filter(r=>r.bugun||r.donem||r.iptal);
  rows.sort((a,b)=>b.bugun-a.bugun||b.donem-a.donem||personelSirasi(a.e,b.e));
  return {rows,sonuclar};
}
function kapamaPaneli(list){
  const p=state.period,{rows,sonuclar}=kapamaRaporu(list,p);

/* Seçilen tarih aralığındaki günleri toplar */
function gunlukToplam(id,bas,bit){
  /* Bozuk (negatif) değerler boş kaydedilir; toplama katılmaz, sayılır */
  const t={km:0,hareketDk:0,rolantiDk:0,durusDk:0,ihlal:0,gun:0,veri:false,
           kmVar:false,harVar:false,rolVar:false,bozuk:0};
  db.aracGunluk.forEach(g=>{
    if(g.assetId!==id||g.gun<bas||g.gun>bit)return;
    t.veri=true;
    if(g.km==null)t.bozuk++;else{t.km+=num(g.km);t.kmVar=true;}
    if(g.hareketDk!=null){t.hareketDk+=num(g.hareketDk);t.harVar=true;}
    if(g.rolantiDk!=null){t.rolantiDk+=num(g.rolantiDk);t.rolVar=true;}
    if(g.durusDk!=null)t.durusDk+=num(g.durusDk);
    t.ihlal+=num(g.ihlal);
    if(num(g.km)>0||num(g.hareketDk)>0)t.gun++;
  });
  return t;
}

function dkYazi(dk){dk=Math.round(num(dk));if(!dk)return '-';
  const s=Math.floor(dk/60),k=dk%60;return s?(s+' sa '+(k?k+' dk':'')).trim():k+' dk';}
function gecenSure(iso){
  if(!iso)return {yazi:'Veri yok',eski:true};
  const dk=Math.round((Date.now()-new Date(iso).getTime())/60000);
  if(dk<2)return {yazi:'Az önce',eski:false};
  if(dk<60)return {yazi:dk+' dk önce',eski:dk>30};

  if(sa<24)return {yazi:sa+' saat önce',eski:true};
  return {yazi:Math.floor(sa/24)+' gün önce',eski:true};
}

let _hrt=null,_hrtKat=[];
function haritaTemizle(){
  _hrtKat.forEach(k=>{try{_hrt.removeLayer(k);}catch(e){}});
  _hrtKat=[];
}
function haritaKur(){
  const kutu=$('#harita');
  if(!kutu||typeof L==='undefined')return null;
  if(_hrt&&_hrt._container===kutu)return _hrt;
  if(_hrt){try{_hrt.remove();}catch(e){}_hrt=null;_hrtKat=[];}
  _hrt=L.map(kutu,{zoomControl:true,attributionControl:true}).setView([39.0,35.0],6);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {maxZoom:19,attribution:'© OpenStreetMap'}).addTo(_hrt);
  return _hrt;
}
const HRT_RENK={hareket:'#16A34A',rolanti:'#D97706',duruyor:'#64748B',kapali:'#94A3B8'};
/* Haritada yer kaplamasın: "MEHMET EMİN AKGÜN" → "MEHMET EMİN A."
   Son kelime soyad sayılır; öncekiler ad olarak korunur. */
function kisaAd(ad){
  const p=(ad||'').trim().split(/\s+/).filter(Boolean);
  if(p.length<2)return p[0]||'';
  return p.slice(0,-1).join(' ')+' '+p[p.length-1].charAt(0).toLocaleUpperCase('tr')+'.';
}
function aracRenk(k){
  if(!k||!k.kontak)return HRT_RENK.kapali;
  if(k.rolanti)return HRT_RENK.rolanti;
  return num(k.hiz)>0?HRT_RENK.hareket:HRT_RENK.duruyor;

async function haritaIsi(){

  if(bilgi)bilgi.textContent='Yükleniyor…';

    const veri=r.data||[];
    if(!veri.length){if(bilgi)bilgi.textContent='Bu aralıkta iz kaydı yok.';return;}
    const enCok=Math.max.apply(null,veri.map(x=>num(x.adet)))||1;

    if(typeof L.heatLayer!=='function'){if(bilgi)bilgi.textContent='Isı haritası bileşeni yüklenemedi.';return;}
    const kat=L.heatLayer(nk,{radius:22,blur:18,maxZoom:15,minOpacity:.25,
      gradient:{0.1:'#2563EB',0.35:'#22C55E',0.65:'#FACC15',1:'#EF4444'}}).addTo(m);
    _hrtKat.push(kat);
    m.fitBounds(L.latLngBounds(nk.map(x=>[x[0],x[1]])).pad(0.15));
    if(bilgi)bilgi.textContent=veri.length.toLocaleString('tr-TR')+' nokta · en yoğun hücrede '+enCok.toLocaleString('tr-TR')+' kayıt';
  }catch(e){
    if(bilgi)bilgi.textContent='Isı haritası okunamadı: '+e.message;
  }
}

const RND_RENK={gecmis:'#DC2626',bugun:'#D97706',gelecek:'#2563EB',metro:'#7C3AED'};
function randevuRenk(tarih){

function haritaRandevuListesi(){

/* ---------- Üst üste binen pinler ----------
   Adresi çözülemeyen kayıtlar ilçe merkezine düşüyor; aynı ilçeden on
   müşteri varsa on pin tam olarak aynı noktaya biniyor ve yalnızca en
   üstteki görünüyordu. Çakışanları küçük bir halka üzerine dağıtıyoruz.
   Hepsi zaten yaklaşık konum olduğu için bu bir doğruluk kaybı değil;
   tersine, gizlenen kayıtları görünür yapıyor. */
const PIN_ARALIK_M=55;
/* j=0 merkez; sonrakiler 6, 12, 18... kişilik halkalara yerleşir */
function pinHalka(j){
  if(j<=0)return {h:0,aci:0};
  let halka=1,once=0,kap=6;
  while(j>once+kap){once+=kap;halka++;kap=6*halka;}
  return {h:halka,aci:2*Math.PI*(j-once-1)/kap};
}
/* Aynı koordinatı paylaşanlara ofset üretir */
function pinDagit(koord){
  const grup={},ofset=new Array(koord.length).fill(null);
  koord.forEach((k,i)=>{
    const a=k[0].toFixed(5)+','+k[1].toFixed(5);
    (grup[a]=grup[a]||[]).push(i);
  });
  Object.keys(grup).forEach(a=>{
    const ix=grup[a];if(ix.length<2)return;
    ix.forEach((idx,j)=>{
      const {h,aci}=pinHalka(j);
      if(!h){ofset[idx]=[0,0];return;}
      const d=h*PIN_ARALIK_M;
      const enlem=koord[idx][0];
      ofset[idx]=[(d*Math.sin(aci))/111320,
                  (d*Math.cos(aci))/(111320*Math.max(0.2,Math.cos(enlem*Math.PI/180)))];
    });
  });
  return ofset;
}
function haritaRandevuCiz(m,noktalar){
  const liste=haritaRandevuListesi();
  let adet=0,yaklasik=0,konumsuz=0,musterisiz=0;const bekleyen=[];
  /* Önce çizilebilecekleri ayır, sonra çakışanları dağıt */
  const cizilecek=[];
  liste.forEach(({a,c})=>{
    if(!c){musterisiz++;return;}
    if(c.enlem==null||c.boylam==null){konumsuz++;
      if(bekleyen.indexOf(c.unvan)<0)bekleyen.push(c.unvan);return;}
    cizilecek.push({a,c});
  });
  const ofsetler=pinDagit(cizilecek.map(x=>[x.c.enlem,x.c.boylam]));
  let _ustuste=0;
  cizilecek.forEach(({a,c},_i)=>{
    const of=ofsetler[_i];
    const enlem=c.enlem+(of?of[0]:0),boylam=c.boylam+(of?of[1]:0);
    if(of&&(of[0]||of[1]))_ustuste++;
    if(c.geoKaynak==='ilce')yaklasik++;
    const metro=metroRnd(a);
    /* Metro randevusu kendi renginde çıkar. Tarihi geçmişse beyaz
       çerçeve yerine kırmızı halka alır; renk değişse de gecikme
       bilgisi kaybolmasın. */
    const renk=metro?RND_RENK.metro:randevuRenk(a.date),h=emp(a.employeeId),alan=emp(a.alanId);
    const cerceve=(metro&&a.date<TODAY)?RND_RENK.gecmis:'#fff';
    /* Pinin içinde hat adedi; metro randevusunda "Metro" yazar */
    const hatliMi=c.operator&&c.operator!=='Hattı yok'&&num(c.mobilAdet)>0;
    const icerik=metro?'Metro':(hatliMi?String(num(c.mobilAdet)):(c.operator==='Hattı yok'?'0':'?'));
    const yan=metro?'':(hatliMi?num(c.mobilAdet)+' hat'+(c.operator?' · '+OPER_KISA(c.operator):''):'');
    const pin=L.divIcon({className:'',iconSize:null,
      html:'<div class="rnd-pin"><span class="nk" style="background:'+renk+';border-color:'+cerceve+'">'+esc(icerik)+'</span>'+
        (yan?'<span class="yn">'+esc(yan)+'</span>':'')+'</div>'});
    const mk=L.marker([enlem,boylam],{icon:pin,riseOnHover:true,
      title:c.unvan+(metro?' · Metro randevusu':'')+(hatliMi?' · '+c.operator+' '+num(c.mobilAdet)+' hat':'')}).addTo(m);
    mk.bindPopup('<b>'+esc(c.unvan)+'</b>'+
      (c.yetkili?'<br>'+esc(c.yetkili):'')+
      (operatorOzet(c)?'<br><b>'+esc(operatorOzet(c))+'</b>':'')+
      (c.telefon?'<br><a href="tel:'+esc(c.telefon)+'">'+esc(c.telefon)+'</a>':'')+
      (metro?'<br><b style="color:'+RND_RENK.metro+'">Metro randevusu</b>':'')+
      '<br>Randevu: '+esc(fmtDate(a.date))+(a.date<TODAY?' <span style="color:'+RND_RENK.gecmis+'">(geçmiş)</span>':'')+
      (h?'<br>Atanan: '+esc(h.name):'')+
      (alan?'<br>Alan: '+esc(alan.name):'')+
      (a.desc?'<br><span style="color:#5C6B7D">'+esc(a.desc)+'</span>':'')+

function satGroups(list,group){
  const m=new Map();
  list.forEach(s=>{
    const p=byId(db.products,s.productId);let k,l,sub='';
    if(group==='personel'){k=s.employeeId;const e=emp(k);l=e?e.name:'Silinmiş personel';sub=e?((dept(e.departmentId)||{}).name||''):'';}
    else if(group==='departman'){k=s.departmentId||'';l=k?(dept(k)||{name:'Silinmiş departman'}).name:'Departmansız';}
    else if(group==='urun'){k=s.productId;l=prodLabel(p);sub=p?p.category:'';}
    else{k=p?p.category:'';l=k||'Kategorisiz';}
    const g=m.get(k)||{k,l,sub,qty:0,puan:0,prim:0,n:0};g.qty+=s.qty;g.puan+=s.puan;g.prim+=s.prim;g.n++;m.set(k,g);
  });
  return [...m.values()].sort((a,b)=>b.puan-a.puan||b.prim-a.prim);
}

/* ---------------------------------------------------------------
   MOBİL HAT
   Bir telefon numarası = bir satır. Dakika paketi ile GB paketi o
   satırın iki bileşenidir; numara bir kez girilir.
     baz   = dakika.X + gb.X    (prim, puan ve gelir için ayrı ayrı)
     puan  = baz x puan çarpanı  x numara adedi   (NT 1,40 · BASE 1,00)
     gelir = baz x gelir çarpanı x numara adedi   (NT 1,20 · BASE 1,00)
     prim  = baz x prim çarpanı  x numara adedi   (NT 1,00 · BASE 0,85)
----------------------------------------------------------------*/
const HAT_TIP=[['NT','NT (yeni / taşıma)'],['BASE','BASE (mevcut hat)']];
const mobilDk=()=>db.products.filter(p=>p.mobilTip==='dakika');
const mobilGb=()=>db.products.filter(p=>p.mobilTip==='gb');
const mobilVar=()=>mobilDk().length>0;
/* Üç ayrı çarpan:  puan NT 1,40 · gelir NT 1,20 · prim NT 1,00
                      BASE'de sırasıyla 1,00 · 1,00 · 0,85 */
const carpanOf     =t=>{const c=(db.carpan||{})[t||'BASE'];return c===undefined?1:c;};
const gelirCarpanOf=t=>{const c=(db.gelirCarpan||{})[t||'BASE'];return c===undefined?1:c;};
const primCarpanOf =t=>{const c=(db.primCarpan||{})[t||'BASE'];return c===undefined?1:c;};
const mobilMi=p=>!!p&&p.mobilTip==='dakika';
/* PSTN tarife yükseltme. Tarife ürünlerinin prim alanı operatörün o
   tarife için ödediği hakedişi tutar; satırda iki tarife seçilir ve
   aradaki fark hesaba girer. */
/* ---------------------------------------------------------------
   METRO ETHERNET
   Puan bağlantının hızından gelir; asimetrikte yarıya iner.
   Tablodaki bantlar operatörün puan cetvelidir.
----------------------------------------------------------------*/
const METRO_BANT=[
  {alt:5,    ust:20,     puan:1},
  {alt:30,   ust:40,     puan:2},
  {alt:50,   ust:90,     puan:3},
  {alt:100,  ust:150,    puan:5},
  {alt:200,  ust:250,    puan:10},
  {alt:300,  ust:450,    puan:15},
  {alt:500,  ust:900,    puan:20},
  {alt:1000, ust:100000, puan:25}
];
const METRO_SIMETRI=[['simetrik','Simetrik'],['asimetrik','Asimetrik (puan yarısı)']];
const metroMu=p=>!!p&&p.mobilTip==='metro';
/* Hız hangi banda düşüyor? Bantlar arasındaki boşluklarda (örneğin
   25 Mbps) bir alt bandın puanı verilir; cetvelde karşılığı olmayan
   hızı sessizce sıfır yazmak yerine en yakın alt bandı kullanıyoruz. */
function metroBant(hiz){
  const h=Math.max(0,parseFloat(String(hiz).replace(',','.'))||0);
  if(!h)return null;
  let bulunan=null;
  for(const b of METRO_BANT){
    if(h>=b.alt&&h<=b.ust)return b;
    if(h>b.ust)bulunan=b;          /* bant aralığına düşmeyen hız: bir alt bant */
  }
  return bulunan;                  /* 5'in altı için null, puan 0 */
}
function metroPuan(hiz,simetri){
  const b=metroBant(hiz);if(!b)return 0;
  return simetri==='asimetrik'?b.puan/2:b.puan;
}
/* Satış satırında ve raporlarda gösterilen kısa etiket */
const metroEtiket=s=>(s&&s.metroHiz)
  ? nf.format(s.metroHiz)+' Mbps '+(s.metroSimetri==='asimetrik'?'asimetrik':'simetrik'):'';
const metroBantAdi=hiz=>{const b=metroBant(hiz);
  return b?(nf.format(b.alt)+'–'+nf.format(b.ust)+' Mbps'):'';};
const upcellMi=p=>!!p&&p.mobilTip==='upcell';
const tarifeler=()=>db.products.filter(p=>p.mobilTip==='tarife');
function upcellFark(L){
  const e=L.eski?byId(db.products,L.eski):null;
  const y=L.yeni?byId(db.products,L.yeni):null;
  if(!e||!y)return {e,y,fark:0,eksik:true};
  return {e,y,fark:(y.prim||0)-(e.prim||0),eksik:false};
}
function hatEtiket(s){
  const p=byId(db.products,s.productId),g=s.gbProductId?byId(db.products,s.gbProductId):null;
  return (p?p.name:'Silinmiş tarife')+(g?' + '+g.name:'')+(s.hatTip?' ('+s.hatTip+')':'');
}
/* ---------------------------------------------------------------
   GELİR
   Ürün başına üç şekilde tanımlanır: sabit tutar, satış tutarının
   yüzdesi veya satış tutarının katı.
   Satış bir randevudan geldiyse randevuyu alan personele payı,
   kalanı satışı yapana yazılır.
----------------------------------------------------------------*/
const GELIR_TIP=[['sabit','Sabit tutar (adet başına)'],['yuzde','Satış tutarının yüzdesi'],['kat','Satış tutarının katı']];
const randevuPayi=()=>{const v=(db.ayar||{}).randevu_gelir_payi;return v===undefined?10:v;};
function urunGelir(p,qty,amount){
  if(!p||!p.gelir)return 0;
  if(p.gelirTip==='yuzde')return amount*p.gelir/100;
  if(p.gelirTip==='kat')  return amount*p.gelir;
  return qty*p.gelir;
}
function gelirEtiketi(p){
  if(!p||!p.gelir)return '';
  if(p.gelirTip==='yuzde')return '%'+nf.format(p.gelir);
  if(p.gelirTip==='kat')  return nf.format(p.gelir)+'\u00d7 tutar';
  return money(p.gelir);
}
/* Bu satış hangi randevudan geldi? En yakın tarihli, iptal olmayan
   ve randevuyu alanı belli olan randevu esas alınır. */
function satisRandevusu(custId,tarih){
  if(!custId)return null;
  const list=db.appointments.filter(a=>a.customerId===custId&&!iptalMi(a)&&a.date<=tarih&&alanOf(a));
  if(!list.length)return null;
  list.sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);
  return list[0];
}
/* Bir personelin dönem içindeki toplam geliri */
function personelGelir(empId,period){
  let t=0;
  salesIn(period).forEach(s=>{
    const g=s.gelir||0;if(!g)return;
    const pay=s.gelirAlanId?(s.gelirPay||0):0;
    if(s.gelirAlanId===empId)t+=g*pay/100;
    if(s.employeeId===empId)t+=g*(100-pay)/100;
  });
  return t;
}
/* Satış tutarı alanı, tutarın bir şeyi gerçekten etkilediği durumda
   açılır:
     · prim/puan satış tutarının yüzdesi hesaplanıyorsa,
     · GELİR satış tutarının yüzdesi ya da katı olarak tanımlıysa,
     · hedef kategorilerinden biri "satış tutarı" türündeyse.
   Gelir koşulu eksikti: geliri "tutarın katı" olarak tanımlanmış bir
   üründe tutar sorulmuyor, dolayısıyla gelir sessizce ₺0 kalıyordu. */
function needsAmount(p){return !!p&&(p.calcType==='yuzde'
  ||(p.gelir&&(p.gelirTip==='yuzde'||p.gelirTip==='kat'))
  ||(hedefKat(p.hedefKat)||{}).kind==='tutar'
  ||(hedefKat(p.hedefKat2)||{}).kind==='tutar');}

/* Kayan nokta artıklarını temizler: 1,2*3 = 3,5999999999999996 → 3,6 */
const yuvarla=(v,h)=>{const n=Number(v)||0,k=Math.pow(10,h===undefined?4:h);
  return Math.round(n*k)/k;};
function lineCalc(L){
  const p=byId(db.products,L.prod);
  if(!p)return {p:null,qty:0,amount:0,prim:0,puan:0};
  if(mobilMi(p)){
    const g=L.gb?byId(db.products,L.gb):null;
    const k=carpanOf(L.tip),kg=gelirCarpanOf(L.tip),kp=primCarpanOf(L.tip);
    const adet=parseSerials(L.abone).length;
    const bazPrim=(p.prim||0)+(g?(g.prim||0):0);
    const bazPuan=(p.puan||0)+(g?(g.puan||0):0);
    const bazGelir=(p.gelir||0)+(g?(g.gelir||0):0);
    return {p,g,mobil:true,qty:adet,amount:0,carpan:k,gelirCarpan:kg,primCarpan:kp,bazPrim,bazPuan,
            prim:bazPrim*kp*adet,puan:bazPuan*k*adet,gelir:bazGelir*kg*adet};
  }
  if(metroMu(p)){
    /* Puan hızdan gelir; prim ve gelir ürünün kendi tanımından.
       Adet, hizmet numarası girildiyse onların sayısıdır. */
    const adet=parseSerials(L.abone).length||Math.max(0,parseInt(L.qty,10)||0);
    const amount=Math.max(0,parseFloat(String(L.amount).replace(',','.'))||0);
    const sim=L.simetri==='asimetrik'?'asimetrik':'simetrik';
    const birim=metroPuan(L.hiz,sim);
    const prim=p.calcType==='yuzde'?amount*(p.primPct||0)/100:adet*(p.prim||0);
    return {p,metro:true,qty:adet,amount,hiz:L.hiz,simetri:sim,bant:metroBantAdi(L.hiz),
            birimPuan:birim,puan:birim*adet,prim,gelir:urunGelir(p,adet,amount)};
  }
  if(upcellMi(p)){
    const u=upcellFark(L);
    const adet=parseSerials(L.abone).length||Math.max(0,parseInt(L.qty,10)||0);
    const tutar=Math.max(0,u.fark)*adet;
    const prim=p.calcType==='yuzde'?tutar*(p.primPct||0)/100:adet*(p.prim||0);
    const puan=p.calcType==='yuzde'?tutar*(p.puanPct||0)/100:adet*(p.puan||0);
    /* Fark doğrudan şirketin geliridir */
    return {p,upcell:true,eski:u.e,yeni:u.y,fark:u.fark,eksik:u.eksik,
            qty:adet,amount:tutar,prim,puan,gelir:tutar};
  }
  /* Abone/hizmet numarası girildiyse adet numara sayısıdır. DSL ve
     PSTN'de her numara bir hizmettir; mobil hatta olduğu gibi sayılır. */
  const numaraAdet=parseSerials(L.abone).length;
  const qty=p.stocked?parseSerials(L.serials).length
           :(numaraAdet?numaraAdet:Math.max(0,parseInt(L.qty,10)||0));
  const amount=needsAmount(p)?Math.max(0,parseFloat(String(L.amount).replace(',','.'))||0):0;
  const prim=p.calcType==='yuzde'?amount*(p.primPct||0)/100:qty*(p.prim||0);
  const puan=p.calcType==='yuzde'?amount*(p.puanPct||0)/100:qty*(p.puan||0);
  return {p,qty,amount,prim,puan,gelir:urunGelir(p,qty,amount)};
}

       '<div class="field"><label for="slsm-'+L.id+'">Bağlantı tipi</label><select id="slsm-'+L.id+'">'+
         opt(METRO_SIMETRI,L.simetri||'simetrik')+'</select></div>'
      :'')+
    (p&&!mobilMi(p)&&!upcellMi(p)?(p.stocked
      ?'<div class="field full"><label for="sls-'+L.id+'">Seri numaraları</label><textarea id="sls-'+L.id+'" rows="3" placeholder="Her satıra bir seri no yazın veya okutun">'+esc(L.serials)+'</textarea><span class="muted sm" id="slsc-'+L.id+'">'+parseSerials(L.serials).length+' seri no okundu</span></div>'
      :(function(){const n=parseSerials(L.abone).length;
         return n
           ?'<div class="field"><label for="slq-'+L.id+'">Adet</label><input id="slq-'+L.id+'" type="number" value="'+n+'" disabled><span class="muted sm">Girilen hizmet numarası sayısı</span></div>'
           :'<div class="field"><label for="slq-'+L.id+'">Adet</label><input id="slq-'+L.id+'" type="number" min="1" step="1" inputmode="numeric" value="'+esc(L.qty)+'"></div>';})()):'')+
    (p&&needsAmount(p)&&!upcellMi(p)?'<div class="field"><label for="sla-'+L.id+'">Satış tutarı (₺)</label><input id="sla-'+L.id+'" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0" value="'+esc(L.amount)+'"></div>':'')+
    (upcellMi(p)?(function(){const n=parseSerials(L.abone).length;
      return n

function lineSummary(L){
  const c=lineCalc(L);
  if(!c.p)return '';
  if(c.mobil){
    if(!c.g)return 'GB paketini seçin.';
    if(!c.qty)return 'Telefon numarasını girin.';
    const tipAd=(c.p&&L.tip?L.tip:'BASE');
    return c.qty+' hat · '+tipAd+
      ' → '+nf.format(c.puan)+' puan (×'+nf.format(c.carpan)+')'+
      (primGor()?', '+money(c.prim)+' prim (baz '+money(c.bazPrim)+' ×'+nf.format(c.primCarpan)+')':'')+
      (gelirGor()&&c.gelir?', '+money(c.gelir)+' gelir (×'+nf.format(c.gelirCarpan)+')':'');
  }
  if(c.metro){
    if(!c.hiz)return 'Bağlantı hızını girin.';
    if(!c.birimPuan)return 'Bu hız puan cetvelinde yok. 5 Mbps ve üstü bir değer girin.';
    if(!c.qty)return 'Adet girin veya hizmet numarası yazın.';
    return c.bant+' · '+(c.simetri==='asimetrik'?'asimetrik':'simetrik')+
      ' → '+nf.format(c.birimPuan)+' puan × '+c.qty+' adet = '+nf.format(c.puan)+' puan'+
      (primGor()?', '+money(c.prim)+' prim':'')+
      (gelirGor()&&c.gelir?', '+money(c.gelir)+' gelir':'');
  }
  if(c.upcell){
    if(c.eksik)return 'Eski ve yeni tarifeyi seçin.';
    if(c.fark<=0)return 'Yeni tarife eskisinden yüksek olmalı. Seçilen fark: '+money(c.fark)+'.';
    if(!c.qty)return 'Adet girin veya hizmet numarası yazın.';
    return c.eski.name+' → '+c.yeni.name+' · fark '+money(c.fark)+' × '+c.qty+' adet = '+money(c.amount)+
      ' → '+nf.format(c.puan)+' puan'+(primGor()?', '+money(c.prim)+' prim':'')+
      (gelirGor()?', '+money(c.gelir)+' gelir':'');
  }
  return c.qty+' adet'+(c.amount?', '+money(c.amount):'')+' → '+nf.format(c.puan)+' puan'+
    (primGor()?', '+money(c.prim)+' prim':'')+
    (gelirGor()&&c.gelir?', '+money(c.gelir)+' gelir':'');
}

function saveSale(){
  const g=id=>$('#'+id)?$('#'+id).value:'',err=m=>{$('#sl-err').textContent=m;};
  slRead();
  const date=g('sl-date'),empId=g('sl-emp'),custSel=g('sl-cust'),e=emp(empId);
  if(!date)return err('Tarih seçin.');if(!e)return err('Satışı yapan personeli seçin.');
  if(custSel!==NEW_CUST&&!norm(g('sl-customer')))return err('Müşteri adını girin.');
  const lines=dlgState.lines||[];
  if(!lines.length)return err('En az bir ürün satırı ekleyin.');
  const hazir=[],tumSeri=new Set();
  for(let i=0;i<lines.length;i++){
    const L=lines[i],no=(i+1)+'. ürün: ',p=byId(db.products,L.prod);
    if(!p)return err(no+'ürün seçin.');
    if(metroMu(p)){
      const sim=L.simetri==='asimetrik'?'asimetrik':'simetrik';
      const hiz=Math.max(0,parseInt(String(L.hiz).replace(/\D/g,''),10)||0);
      if(!hiz)return err(no+'bağlantı hızını girin.');
      const birim=metroPuan(hiz,sim);
      if(!birim)return err(no+hiz+' Mbps puan cetvelinde yok. 5 Mbps ve üstü bir değer girin.');
      const nolar=parseSerials(L.abone);
      const adet=nolar.length||Math.max(0,parseInt(L.qty,10)||0);
      if(!adet)return err(no+'adet girin veya hizmet numarası yazın.');
      const tutar=needsAmount(p)?Math.max(0,parseFloat(String(L.amount).replace(',','.'))||0):0;
      const prim=p.calcType==='yuzde'?tutar*(p.primPct||0)/100:adet*(p.prim||0);
      hazir.push({p,qty:adet,units:[],amount:tutar,calc:p.calcType,abone:nolar,
        prim,puan:birim*adet,gelir:urunGelir(p,adet,tutar),metroHiz:hiz,metroSimetri:sim});
      continue;
    }
    if(upcellMi(p)){
      const u=upcellFark(L);
      if(u.eksik)return err(no+'eski ve yeni tarifeyi seçin.');
      if(u.e.id===u.y.id)return err(no+'eski ve yeni tarife aynı olamaz.');
      if(u.fark<=0)return err(no+'yeni tarife eskisinden yüksek olmalı ('+u.e.name+' → '+u.y.name+').');
      const nolar=parseSerials(L.abone);
      const adet=nolar.length||Math.max(0,parseInt(L.qty,10)||0);
      if(!adet)return err(no+'adet girin veya hizmet numarası yazın.');
      const tutar=u.fark*adet;
      const prim=p.calcType==='yuzde'?tutar*(p.primPct||0)/100:adet*(p.prim||0);
      const puan=p.calcType==='yuzde'?tutar*(p.puanPct||0)/100:adet*(p.puan||0);
      hazir.push({p,qty:adet,units:[],amount:tutar,calc:p.calcType,abone:nolar,
        prim,puan,gelir:tutar,upcellEski:u.e.id,upcellYeni:u.y.id});
      continue;
    }
    if(mobilMi(p)){
      const g=L.gb?byId(db.products,L.gb):null;
      if(!g)return err(no+'GB paketini seçin.');
      const tip=L.tip||'BASE';
      const nolar=parseSerials(L.abone);
      if(!nolar.length)return err(no+'en az bir telefon numarası girin.');
      const gorulen=new Set(),tekrar=[];
      nolar.forEach(x=>{const k=x.replace(/\D/g,'');if(gorulen.has(k))tekrar.push(x);gorulen.add(k);});
      if(tekrar.length)return err(no+'aynı numara birden fazla girilmiş: '+missingText(tekrar));
      const k=carpanOf(tip),kg=gelirCarpanOf(tip),kp=primCarpanOf(tip);
      const bazPrim=(p.prim||0)+(g.prim||0),bazPuan=(p.puan||0)+(g.puan||0);
      const bazGelir=(p.gelir||0)+(g.gelir||0);
      hazir.push({p,gb:g,hatTip:tip,qty:nolar.length,units:[],amount:0,calc:'sabit',abone:nolar,
        prim:bazPrim*kp*nolar.length,puan:bazPuan*k*nolar.length,gelir:bazGelir*kg*nolar.length});
      continue;
    }
    let qty=0,units=[];
    if(p.stocked){
      const list=parseSerials(L.serials);
      if(!list.length)return err(no+'en az bir seri numarası girin.');
      const seen=new Set(),dups=[];
      list.forEach(x=>{const k=x.toLocaleLowerCase('tr');if(seen.has(k)||tumSeri.has(k))dups.push(x);seen.add(k);tumSeri.add(k);});
      if(dups.length)return err(no+'tekrar eden seri no var: '+missingText(dups));
      const notFound=[],wrong=[],unavail=[];
      list.forEach(x=>{const u=stockBySerial(x);
        if(!u)notFound.push(x);else if(u.productId!==p.id)wrong.push(x);
        else if(u.status==='Depoda'||(u.status==='Personelde'&&u.holderId===empId))units.push(u);else unavail.push(x);});
      if(notFound.length)return err(no+notFound.length+' seri no stokta bulunamadı: '+missingText(notFound));
      if(wrong.length)return err(no+wrong.length+' seri no seçilen ürüne ait değil: '+missingText(wrong));
      if(unavail.length)return err(no+unavail.length+' seri no satışa uygun değil (satılmış, fire veya başka personelde): '+missingText(unavail));
      qty=units.length;
    }else{
      const nolar=parseSerials(L.abone);
      if(nolar.length){
        /* Numara girildiyse adet numara sayısıdır */
        const gorulen=new Set(),tekrar=[];
        nolar.forEach(x=>{const k=x.replace(/\s/g,'').toLocaleLowerCase('tr');
          if(gorulen.has(k))tekrar.push(x);gorulen.add(k);});
        if(tekrar.length)return err(no+'aynı numara birden fazla girilmiş: '+missingText(tekrar));
        qty=nolar.length;
      }else{
        qty=parseInt(L.qty,10)||0;
        if(qty<1)return err(no+'adet en az 1 olmalı.');
      }
    }
    let amount=0;
    if(needsAmount(p)){
      amount=parseFloat(String(L.amount).replace(',','.'))||0;
      if(!(amount>0))return err(no+'satış tutarını 0’dan büyük girin.');
    }
    const calc=p.calcType||'sabit';
    hazir.push({p,qty,units,amount,calc,abone:parseSerials(L.abone),
      prim:calc==='yuzde'?amount*(p.primPct||0)/100:qty*(p.prim||0),
      puan:calc==='yuzde'?amount*(p.puanPct||0)/100:qty*(p.puan||0),
      gelir:urunGelir(p,qty,amount)});
  }
  const tPrim=hazir.reduce((a,x)=>a+x.prim,0),tPuan=hazir.reduce((a,x)=>a+x.puan,0);
  const tUnit=hazir.reduce((a,x)=>a+x.units.length,0),tAbone=hazir.reduce((a,x)=>a+x.abone.length,0);
  run('sl-err',async()=>{
    let custId=custSel&&custSel!==NEW_CUST?custSel:null;
    let customer=norm(g('sl-customer'));
    if(custSel===NEW_CUST){
      const res=await quickCreateCustomer('sl','slDup');
      if(res.error)throw new Error(res.error);
      custId=res.customer.id;customer=res.customer.unvan;
    }
    const batch=crypto.randomUUID();
    /* Satış bir randevudan geldiyse randevuyu alan personel */
    const rnd=satisRandevusu(custId,date);
    const alan=rnd?alanOf(rnd):null;
    const pay=alan?randevuPayi():0;
    for(const L of hazir){
      const sale=await ins('sales',{date,employee_id:empId,department_id:nz(e.departmentId),
        company_id:nz(e.companyId),customer_id:custId,customer,product_id:L.p.id,qty:L.qty,
        amount:L.amount,calc_type:L.calc,hedef_kat:L.p.hedefKat||'',hedef_kat2:L.p.hedefKat2||'',batch_id:batch,
        unit_prim:L.calc==='yuzde'?(L.p.primPct||0):(L.p.prim||0),
        unit_puan:L.calc==='yuzde'?(L.p.puanPct||0):(L.p.puan||0),
        /* Ondalık çarpımlarda 3,5999999999999996 gibi artıklar kalmasın */
        prim:yuvarla(L.prim),puan:yuvarla(L.puan),
        gb_product_id:L.gb?L.gb.id:null,hat_tip:L.hatTip||null,
        gelir:yuvarla(L.gelir||0),gelir_alan_id:alan,gelir_pay:pay,
        upcell_eski:L.upcellEski||null,upcell_yeni:L.upcellYeni||null,
        metro_hiz:L.metroHiz||null,metro_simetri:L.metroSimetri||''});
      if(L.abone.length){
        const ar=await sb.from('sale_subscriptions').insert(
          L.abone.map(x=>({sale_id:sale.id,abone_no:x,created_by:me.userId})));
        if(ar.error)throw ar.error;
      }
      if(L.units.length){
        const ir=await sb.from('sale_items').insert(L.units.map(u=>({sale_id:sale.id,unit_id:u.id,
          from_wh:u.warehouseId||null,from_holder:u.status==='Personelde'?u.holderId:null})));
        if(ir.error)throw ir.error;
        await updCok('stock_units',L.units.map(u=>u.id),
          {warehouse_id:null,holder_id:null,status:'Satıldı',note:customer,sale_id:sale.id});
        await insCok('stock_logs',L.units.map(u=>({unit_id:u.id,date,
          text:'Satış: '+customer+' ('+e.name+')'})));
      }
    }
  },hazir.length+' ürün kaydedildi: '+nf.format(tPuan)+' puan'+(primGor()?', '+money(tPrim)+' prim':'')+
    (tUnit?', '+tUnit+' adet stoktan düştü':'')+(tAbone?', '+tAbone+' abone no':''));
}
