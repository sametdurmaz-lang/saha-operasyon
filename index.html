/* ---------------------------------------------------------------
   POTANSİYEL MÜŞTERİLER
   Aranacak firma listesi. Müşteri kaydından ayrıdır; randevu
   alındığında müşteri listesine aktarılır.
----------------------------------------------------------------*/
const LEAD_DURUM=['Yeni','Ulaşılamadı','Tekrar aranacak','İlgilenmiyor','Randevu alındı','Müşteriye aktarıldı'];
const LEAD_ACIK=new Set(['Yeni','Tekrar aranacak']);
const LEAD_ROZET={'Yeni':'','Ulaşılamadı':'warn','Tekrar aranacak':'warn','İlgilenmiyor':'bad','Randevu alındı':'ok','Müşteriye aktarıldı':'ok'};
const lead=id=>byId(db.leads,id);
const trl=x=>String(x==null?'':x).toLocaleLowerCase('tr');
const telKey=t=>{const d=String(t||'').replace(/\D/g,'');return d.length>10?d.slice(-10):d;};
/* Şirket ekleri — harf katlamasından SONRA uygulanır (hepsi ASCII) */
const UNVAN_EK_A=/(^|\s)(a s|as|ltd|sti|san|tic|ith|ihr|paz|hizm|ins|koll|kom|anonim|limited|sirketi|sanayi|ticaret|ve)(?=\s|$)/g;
/* Türkçe harfleri ASCII'ye katlar: İ,I,ı→i · ş→s · ğ→g · ü→u · ö→o · ç→c
   Böylece "YAZILIM" ile "Yazılım" aynı anahtara düşer. */
const TR_KATLA={'İ':'i','I':'i','ı':'i','Ş':'s','ş':'s','Ğ':'g','ğ':'g',
  'Ü':'u','ü':'u','Ö':'o','ö':'o','Ç':'c','ç':'c'};
const katla=x=>String(x==null?'':x).replace(/[İIıŞşĞğÜüÖöÇç]/g,c=>TR_KATLA[c]).toLowerCase();
const unvanKey=u=>katla(u).replace(/[^a-z0-9]+/g,' ').replace(UNVAN_EK_A,' ').replace(/\s+/g,' ').trim();
const adKey=a=>katla(a).replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const adresKey=a=>katla(a).replace(/[^a-z0-9]/g,'');
/* İki metnin harf çifti benzerliği (0-1). Tek harf hatasını yakalar. */
function benzerlikOrani(a,b){
  a=String(a||'');b=String(b||'');
  if(!a||!b)return 0;
  if(a===b)return 1;
  if(a.length<2||b.length<2)return 0;
  const cift=x=>{const m=new Map();for(let i=0;i<x.length-1;i++){const k=x.slice(i,i+2);m.set(k,(m.get(k)||0)+1);}return m;};
  const A=cift(a),B=cift(b);let ortak=0,tA=0,tB=0;
  A.forEach((v,k)=>{tA+=v;if(B.has(k))ortak+=Math.min(v,B.get(k));});
  B.forEach(v=>{tB+=v;});
  return (2*ortak)/(tA+tB);
}

/* Ortak alanlara bakarak iki kaydın ne kadar örtüştüğünü bulur. */
function eslesmeNedenleri(x,r){
  const n=[];
  const v=String(x.vkn||'').replace(/\D/g,''),rv=String(r.vkn||'').replace(/\D/g,'');
  if(v&&rv&&v===rv)n.push({t:'VKN aynı',w:3});
  const t=telKey(x.telefon),rt=telKey(r.telefon);
  if(t&&rt&&t.length>=7&&t===rt)n.push({t:'Telefon aynı',w:3});
  const u=unvanKey(x.unvan),ru=unvanKey(r.unvan);
  if(u&&ru&&u===ru)n.push({t:'Ünvan aynı',w:3});
  /* Kısmi yazım ve harf hatası tek başına listede görünmeye yetsin:
     mükerrer kaydı gizlemektense fazladan uyarmak yeğdir. */
  else if(u&&ru&&u.length>=4&&(u.indexOf(ru)>=0||ru.indexOf(u)>=0))n.push({t:'Ünvan çok benzer',w:3});
  else if(u&&ru&&u.length>=5&&ru.length>=5&&benzerlikOrani(u,ru)>=0.62)n.push({t:'Ünvan benziyor',w:3});
  const y=adKey(x.yetkili),ry=adKey(r.yetkili);
  if(y&&ry&&y.length>=5&&y===ry)n.push({t:'Yetkili adı aynı',w:2});
  const a=adresKey(x.adres),ra=adresKey(r.adres);
  if(a&&ra&&a.length>=12&&a===ra)n.push({t:'Adres aynı',w:2});
  return n;
}
/* Güçlü bir neden (3) veya iki orta neden (2+2) eşik sayılır. */
function benzerKayitlar(x,exceptLeadId){
  const out=[];
  const bak=(kind,r)=>{
    const n=eslesmeNedenleri(x,r),w=n.reduce((s,q)=>s+q.w,0);
    if(w>=3)out.push({kind:kind,rec:r,nedenler:n.map(q=>q.t),w:w});
  };
  db.customers.forEach(c=>bak('musteri',c));
  db.leads.forEach(l=>{if(l.id!==exceptLeadId&&l.durum!=='Müşteriye aktarıldı')bak('potansiyel',l);});
  return out.sort((a,b)=>b.w-a.w).slice(0,6);
}
/* -----------------------------------------------------------------
   ÇİFT KAYIT KONTROLÜ — TÜM VERİ ÜZERİNDEN
   Havuzlar birim bazında ayrıdır, kullanıcı başka birimin kaydını
   göremez. Bu yüzden kontrol sunucuda çalışır: yalnızca "hangi
   birimde, hangi durumda" bilgisi döner, kaydın detayı dönmez.
------------------------------------------------------------------*/
async function sunucudaAra(x,exceptId){
  try{
    const r=await sb.rpc('cift_kayit_bul',{
      p_unvan:x.unvan||'',p_telefon:x.telefon||'',p_vkn:x.vkn||'',
      p_yetkili:x.yetkili||'',p_adres:x.adres||''});
    if(r.error)return [];
    return (r.data||[]).filter(d=>d.kayit_id!==exceptId).map(d=>{
      const rec={id:d.kayit_id,unvan:d.unvan,yetkili:d.yetkili,telefon:d.telefon,
                 vkn:d.vkn,il:d.il,ilce:d.ilce};
      const n=eslesmeNedenleri(x,rec);
      return {kind:d.kaynak==='musteri'?'musteri':'potansiyel',rec:rec,
              nedenler:n.length?n.map(q=>q.t):['Benzer kayıt'],
              w:n.reduce((a,q)=>a+q.w,0)||3,
              birim:d.birim||'',disBirim:!d.benim_birimim,durum:d.durum||''};
    });
  }catch(e){return [];}
}
/* Yerel (kendi havuzum) + sunucu (tüm veri) sonuçlarını birleştirir */
async function cifteBak(x,exceptId){
  const yerel=benzerKayitlar(x,exceptId);
  const uzak=await sunucudaAra(x,exceptId);
  const anahtar=m=>(m.rec.id||'')+'|'+trl(m.rec.unvan)+'|'+telKey(m.rec.telefon);
  const gorulen={},out=[];
  yerel.concat(uzak).forEach(m=>{
    const k=anahtar(m);
    if(gorulen[k]){if(m.birim&&!gorulen[k].birim)gorulen[k].birim=m.birim;return;}
    gorulen[k]=m;out.push(m);
  });
  return out.sort((a,b)=>b.w-a.w).slice(0,8);
}
/* Gerçekten başka bir birime ait mi? Birimi atanmamış kayıt
   (birim adı boş) kimsenin birimine ait değildir, engellenmez. */
const baskaBirimKaydi=m=>!!(m.disBirim&&m.birim);
function benzerSatir(m,secimPre){
  const r=m.rec;
  /* Kayıtlı müşteriyse ve listemizde varsa doğrudan seçtirelim:
     mükerrer açmak yerine mevcut kayıtla devam edilir. */
  const secilebilir=secimPre&&m.kind==='musteri'&&r.id&&(secimPre==='sl'||!baskaBirimKaydi(m));
  return '<div style="margin-top:8px">'+
    (secilebilir?'<button class="btn sm primary" style="float:right;margin-left:10px" data-act="hizli-mus-sec" data-pre="'+esc(secimPre)+'" data-id="'+esc(r.id)+'" data-unvan="'+esc(r.unvan)+'">Bu müşteriyi seç</button>':'')+
    (m.kind==='musteri'?'<span class="badge bad">Mevcut müşteri</span> ':'<span class="badge warn">Potansiyel listede</span> ')+
    '<b>'+esc(r.unvan)+'</b>'+(r.yetkili?' — '+esc(r.yetkili):'')+
    '<div class="muted sm">'+[r.telefon?'Tel: '+esc(r.telefon):'',r.vkn?'VKN: '+esc(r.vkn):'',
      [r.il,r.ilce].filter(Boolean).map(esc).join(' / ')].filter(Boolean).join(' · ')+'</div>'+
    '<div class="sm"><b>Eşleşme:</b> '+esc(m.nedenler.join(', '))+
      (m.birim?' · <b>Birim:</b> '+esc(m.birim)+(m.disBirim?' <span class="badge bad">Başka birim</span>':'')
             :(m.disBirim?' · <span class="badge warn">Birimi atanmamış</span>':''))+
      (m.durum&&m.kind==='potansiyel'?' · '+esc(m.durum):'')+'</div></div>';

function saveLead(){
  if(dlgState.kind!=='lead')return;   /* diyalog kapandıysa tekrar kaydetme */
  const g=id=>{const el=$('#'+id);return el?el.value.trim():'';};
  const err=m=>{$('#l-err').textContent=m;};
  const x={unvan:g('l-unvan'),yetkili:g('l-yetkili'),telefon:g('l-tel'),
    vkn:g('l-vkn').replace(/\D/g,''),il:g('l-il'),ilce:g('l-ilce'),adres:g('l-adres'),
    kaynak:g('l-kaynak'),durum:g('l-durum')||'Yeni',note:g('l-not'),son:g('l-son')};
  if(!dlgState.id&&limitVarMi()&&kalanHak()<=0)
    return err('Bugünkü potansiyel müşteri giriş hakkınız doldu ('+gunlukLimit()+' kayıt). Yarın devam edebilirsiniz.');
  if(!x.unvan)return err('Firma ünvanını girin.');
  if(!x.telefon)return err('Telefon numarasını girin.');
  if(x.vkn&&x.vkn.length!==10&&x.vkn.length!==11)return err('VKN 10 haneli, TCKN 11 haneli rakamlardan oluşmalı.');
  if(!dlgState.leadConfirmed){
    if(dlgState.kontrolEdiliyor)return;
    dlgState.kontrolEdiliyor=true;
    err('Tüm birimlerin kayıtları taranıyor…');
    cifteBak(x,dlgState.id).then(benzer=>{
      dlgState.kontrolEdiliyor=false;
      if(dlgState.kind!=='lead')return;
      if(!benzer.length){dlgState.leadConfirmed=true;err('');saveLead();return;}
      dlgState.leadConfirmed=true;
      const box=$('#l-benzer');
      if(box)box.innerHTML=benzerPanel(benzer,'Bu firma zaten kayıtlıysa yeni kayıt açmayın. Başka bir birimdeyse o birimle görüşün. Farklı bir firma olduğundan eminseniz <b>Kaydet</b> düğmesine tekrar basın.');
      err('Benzer kayıt bulundu. Yukarıdakileri kontrol edin.');
    });
    return;
  }
  const at=$('#l-atanan');
  const row={unvan:x.unvan,yetkili:x.yetkili,telefon:x.telefon,vkn:x.vkn,il:x.il,ilce:x.ilce,
    adres:x.adres,kaynak:x.kaynak,kaynak_tip:'elle',durum:x.durum,note:x.note,son_arama:nz(x.son),
    atanan_id:(!dlgState.id&&(isSaha()||isDestek()))
      ? null                                  /* saha ve satış destek: havuza */
      : nz(at?at.value:(me.employeeId||''))}; /* telesatış, lider ve yönetim: seçilen kişi */
  const id=dlgState.id;
  run('l-err',()=>id?upd('leads',id,row):ins('leads',row),'Potansiyel müşteri kaydedildi');
}

const POT_KAPALI=new Set(['İlgilenmiyor','Randevu alındı','Müşteriye aktarıldı']);
function potSekmeler(){
  const bende=potFiltre('bende').length,tekrar=potFiltre('tekrar').length,
        kapali=potFiltre('kapali').length;
  const ekledigim=potFiltre('ekledigim').length;
  const t=[['bende','Bende',bende],['tekrar','Tekrar aranacak',tekrar],['kapali','Sonuçlanan',kapali]];
  if(ekledigim)t.splice((isSaha()||isDestek())?0:3,0,['ekledigim','Eklediklerim',ekledigim]);
  if(isMudur()||isTLider())t.push(['havuz','Havuz',db.leads.filter(l=>!l.atananId).length],['hepsi','Tümü',db.leads.length]);
  return '<div class="seg" role="group" aria-label="Liste">'+
    t.map(([k,l,n])=>'<button data-act="pot-sekme" data-v="'+k+'" aria-pressed="'+(state.pot.sekme===k)+'">'+l+' ('+n+')</button>').join('')+'</div>';
}
function potFiltre(sekme){
  const benim=me.employeeId||'__yok__';
  const l=db.leads;
  if(sekme==='ekledigim')return l.filter(x=>x.createdBy===me.userId||(x.sahaId&&x.sahaId===benim));
  if(sekme==='bende')  return l.filter(x=>x.atananId===benim&&(x.durum==='Yeni'||x.durum==='Ulaşılamadı'));
  if(sekme==='tekrar') return l.filter(x=>x.atananId===benim&&x.durum==='Tekrar aranacak');
  if(sekme==='kapali') return l.filter(x=>POT_KAPALI.has(x.durum)&&(isMudur()||isTLider()||x.atananId===benim));
  if(sekme==='havuz')  return l.filter(x=>!x.atananId);
  return l.slice();
}
function potTable(){
  const f=state.pot,q=trl(f.q).trim();
  let list=potFiltre(f.sekme);
  if(f.sekme==='hepsi'&&f.durum)list=list.filter(l=>l.durum===f.durum);
  if(f.emp)list=list.filter(l=>l.atananId===f.emp);
  if(q)list=list.filter(l=>trl([l.unvan,l.yetkili,l.telefon,l.vkn,l.il,l.ilce,l.adres,l.kaynak].join(' ')).includes(q));
  list.sort((a,b)=>{
    const aa=LEAD_ACIK.has(a.durum)?0:1,bb=LEAD_ACIK.has(b.durum)?0:1;
    if(aa!==bb)return aa-bb;
    return a.unvan.localeCompare(b.unvan,'tr',SAYISAL);

/* ---------------- Excel'den toplu yükleme (yönetim) ---------------- */
const LI_BASLIK=[['unvan','Ünvan'],['yetkili','Yetkili'],['telefon','Telefon'],['vkn','VKN'],['il','İl'],['ilce','İlçe'],['adres','Adres']];
const LI_ALIAS={
  unvan:['unvan','ünvan','firma','firmaadi','firmaadı','firmaunvani','firmaünvanı','musteri','müşteri','musteriadi','müşteriadı','sirket','şirket','sirketadi','ticariunvan'],
  yetkili:['yetkili','yetkiliadi','yetkiliadı','yetkiliadisoyadi','adsoyad','adisoyadi','adısoyadı','ilgili','ilgilikisi','isim'],
  telefon:['telefon','tel','gsm','cep','ceptelefonu','telefonno','telefonnumarasi','telefonnumarası','irtibat','irtibatno'],
  vkn:['vkn','vergino','verginumarasi','verginumarası','tckn','vkntckn','vknveyatckn'],
  il:['il','sehir','şehir'],
  ilce:['ilce','ilçe'],
  adres:['adres','acikadres','açıkadres','adresbilgisi']
};
const liNorm=s=>trl(s).replace(/[^a-zçğıöşü0-9]/g,'');
function liKolonlar(head){
  const map={};
  head.forEach((h,i)=>{
    const n=liNorm(h);if(!n)return;
    Object.keys(LI_ALIAS).forEach(k=>{if(map[k]===undefined&&LI_ALIAS[k].indexOf(n)>=0)map[k]=i;});
  });
  return map;
}
function liOku(aoa){
  const bos={eksik:[],satirlar:[]};
  if(!aoa||!aoa.length)return bos;
  const map=liKolonlar(aoa[0]);
  if(map.unvan===undefined)return {hata:'Dosyada “Ünvan” sütunu bulunamadı. Şablonu indirip başlıkları ona göre düzeltin.'};
  const al=(row,k)=>map[k]===undefined?'':norm(String(row[map[k]]==null?'':row[map[k]]));
  const rows=[];
  for(let i=1;i<aoa.length;i++){
    const r=aoa[i];if(!r||!r.length)continue;
    const x={unvan:al(r,'unvan'),yetkili:al(r,'yetkili'),telefon:al(r,'telefon'),
      vkn:al(r,'vkn').replace(/\D/g,''),il:al(r,'il'),ilce:al(r,'ilce'),adres:al(r,'adres')};
    if(!x.unvan&&!x.telefon)continue;
    x.satir=i+1;
    x.sorun=!x.unvan?'Ünvan boş':(!x.telefon?'Telefon boş':'');
    x.benzer=x.sorun?[]:benzerKayitlar(x,null);
    rows.push(x);
  }
  return {satirlar:rows};
}
function liOnizleme(rows){
  const hatali=rows.filter(r=>r.sorun),benzer=rows.filter(r=>!r.sorun&&r.benzer.length),
        temiz=rows.filter(r=>!r.sorun&&!r.benzer.length);
  const ornek=benzer.slice(0,8);
  return '<div class="ro-banner"><b>'+rows.length+' satır okundu.</b><br>'+
    temiz.length+' kayıt sorunsuz'+
    (benzer.length?' · <b>'+benzer.length+' kayıt mevcutlarla benzeşiyor</b>':'')+
    (hatali.length?' · '+hatali.length+' satır eksik bilgi yüzünden atlanacak':'')+'</div>'+
    (benzer.length?'<div class="scroll" style="max-height:220px;margin-top:10px"><table><thead><tr><th>Satır</th><th>Ünvan</th><th>Telefon</th><th>Neden benzer</th></tr></thead><tbody>'+
      ornek.map(r=>'<tr><td>'+r.satir+'</td><td>'+esc(r.unvan)+'</td><td class="nowrap">'+esc(r.telefon)+'</td><td class="sm">'+esc(r.benzer[0].nedenler.join(', '))+' → '+esc(r.benzer[0].rec.unvan)+(r.benzer[0].kind==='musteri'?' (mevcut müşteri)':' (potansiyel)')+(r.benzer[0].birim?' · '+esc(r.benzer[0].birim):'')+'</td></tr>').join('')+
      '</tbody></table></div>'+(benzer.length>ornek.length?'<p class="hint">İlk '+ornek.length+' tanesi gösteriliyor.</p>':''):'')+
    (benzer.length?'<label style="display:flex;gap:8px;align-items:center;margin-top:10px;font-weight:500"><input id="li-dahil" type="checkbox" style="width:auto"> Benzeşen '+benzer.length+' kaydı da yükle</label>':'');
}

function liDosyaOku(file){
  const err=m=>{const e=$('#li-err');if(e)e.textContent=m;};
  if(!XL_HAZIR())return err('Excel bileşeni yüklenemedi. Sayfayı yenileyin.');
  const fr=new FileReader();
  fr.onerror=()=>err('Dosya okunamadı.');
  fr.onload=ev=>{
    try{
      const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
      const sh=wb.Sheets[wb.SheetNames[0]];
      const aoa=XLSX.utils.sheet_to_json(sh,{header:1,raw:false,defval:''});
      const res=liOku(aoa);
      if(res.hata){dlgState.rows=null;$('#li-prev').innerHTML='';return err(res.hata);}
      err('');
      dlgState.rows=res.satirlar;
      $('#li-prev').innerHTML=res.satirlar.length?'<div class="ro-banner">'+res.satirlar.length+' satır okundu. Tüm birimlerin kayıtlarına karşı taranıyor…</div>':'<div class="empty">Dosyada yüklenecek satır bulunamadı.</div>';
      if(res.satirlar.length)liSunucuKontrol(res.satirlar);
    }catch(e){err('Dosya okunamadı: '+(e.message||e));}
  };
  fr.readAsArrayBuffer(file);
}
/* Yüklenecek satırları tek istekte tüm veriye karşı tarar */
async function liSunucuKontrol(rows){
  const err=m=>{const e=$('#li-err');if(e)e.textContent=m;};
  try{
    const payload=rows.map(r=>({unvan:r.unvan,telefon:r.telefon,vkn:r.vkn}));
    leadsKirlet();   /* toplu liste yüklemesi */
    const r=await sb.rpc('cift_kayit_toplu',{p_rows:payload});
    if(r.error)throw r.error;
    (r.data||[]).forEach(h=>{
      const satir=rows[h.sira];
      if(!satir)return;
      satir.benzer=[{kind:h.kaynak==='musteri'?'musteri':'potansiyel',
        rec:{unvan:h.unvan},nedenler:[h.neden],birim:h.birim,w:3}];
    });
  }catch(e){
    err('Birimler arası tarama yapılamadı, yalnızca kendi havuzunuz kontrol edildi: '+(e.message||e));
  }
  if(dlgState.kind==='leadimp'){
    const box=$('#li-prev');
    if(box)box.innerHTML=liOnizleme(rows);
  }
}

const alanAdi=k=>ALAN_ADI[k]||k;

function denetimDegisiklik(d){
  const g=d.degisen||{};
  if(d.islem==='UPDATE'){
    const ks=Object.keys(g).filter(k=>!GIZLI_ALAN.has(k));
    if(!ks.length)return '<span class="muted">—</span>';
    return ks.slice(0,6).map(k=>{
      const v=g[k]||{};
      const es=v.eski===null||v.eski===undefined||v.eski===''?'(boş)':String(v.eski);
      const ye=v.yeni===null||v.yeni===undefined||v.yeni===''?'(boş)':String(v.yeni);
      return '<div class="sm"><b>'+esc(alanAdi(k))+':</b> <span class="muted">'+esc(es.slice(0,40))+'</span> → '+esc(ye.slice(0,40))+'</div>';
    }).join('')+(ks.length>6?'<div class="muted sm">+'+(ks.length-6)+' alan daha</div>':'');
  }
  const ks=Object.keys(g).filter(k=>!GIZLI_ALAN.has(k)&&g[k]!==null&&g[k]!=='');
  if(!ks.length)return '<span class="muted">—</span>';
  return '<div class="sm muted">'+esc(ks.slice(0,8).map(k=>alanAdi(k)+': '+String(g[k]).slice(0,30)).join(' · '))+'</div>';
}

/* ====================== CANLI TAZELEME ============================
   Araç takip ve Harita ekranları açık kaldığı sürece veriyi
   dakikada bir kendiliğinden tazeler. Tüm tabloları değil, yalnızca
   değişen dördünü çeker; sayfa yenilenmez, haritanın yakınlaştırması
   ve açık baloncuk bozulmaz.
   Sekme arka plandayken durur, öne gelince hemen tazeler. */
const CANLI_ARALIK=60000;
let _canliSayac=null,_canliEkran='',_canliCalisiyor=false,_sonTazeleme=null;

async function canliVeriTazele(){
  if(!me||!db||busy||dlgState.kind)return false;   /* yazma veya açık pencere varken dokunma */
  if(_canliCalisiyor)return false;
  _canliCalisiyor=true;
  try{
    const [kon,gun,apt,cus]=await Promise.all([
      q('arac_konum').catch(()=>null),
      /* Günlükler harita ekranında kullanılmıyor, boşuna indirmeyelim */
      (state&&state.view==='arac'?q('arac_gunluk').catch(()=>null):Promise.resolve(null)),
      q('appointments'),
      q('customers')]);
    if(kon)db.aracKonum=kon.map(mapAracKonum);
    if(gun){db.aracGunluk=gun.map(mapAracGunluk);_aracGunluk=gun;_aracGunlukGeldi=true;}
    if(apt){
      const eskiLog={};db.appointments.forEach(a=>{eskiLog[a.id]=a.log||[];});
      db.appointments=apt.map(r=>mapRandevu(r,eskiLog[r.id]));
    }
    if(cus)db.customers=cus.map(mapMusteri);
    _sonTazeleme=new Date();
    return true;
  }catch(e){return false;}
  finally{_canliCalisiyor=false;}
}
/* ---------- Ekran değişiminde veri tazeleme ----------
   Veri girişte bir kez iniyor ve yalnızca KENDİ yazdığımız kayıttan
   sonra yenileniyordu. Başka birinin girdiği randevu, sayfa elle
   yenilenene kadar görünmüyordu. Artık her ekran geçişinde o ekranın
   ihtiyaç duyduğu tablolar arka planda tazeleniyor.

   Üç kural:
     · yalnızca o ekranın tabloları çekilir, otuz tablonun hepsi değil,
     · aynı grup TAZE_SURE içinde ikinci kez çekilmez (menüler arasında
       hızlı gidip gelmek sunucuyu yormasın),
     · açık pencere, süren bir yazma veya kullanıcı bir alana yazarken
       hiç dokunulmaz — yazdığı şey kaybolmasın.

   Gruplar tablo tablo değil, birlikte anlam taşıyan kümeler hâlinde:
   satış satırı abone numarası ve seri numarasıyla birlikte kurulduğu
   için üçü beraber çekilir. */
const TAZE_SURE=25000;
const TAZE_GRUP={
  randevu   :['appointments'],
  musteri   :['customers'],
  satis     :['sales','sale_items','sale_subscriptions'],
  potansiyel:['leads'],
  arac      :['arac_konum'],
  kasa      :['transactions'],
  maas      :['payrolls']
};
/* Hangi ekran hangi grupları ister */
const EKRAN_GRUP={
  anasayfa  :['randevu','musteri','satis','potansiyel'],
  ozet      :['randevu','musteri','satis'],
  randevu   :['randevu','musteri'],
  musteri   :['musteri','randevu'],
  potansiyel:['potansiyel'],
  satis     :['satis','musteri'],
  hedef     :['satis','randevu'],
  harita    :['randevu','musteri','arac'],
  arac      :['arac'],
  rapor     :['satis','randevu'],
  kasa      :['kasa'],
  maas      :['kasa','maas']
};
let _tazeAn={},_tazeCalisiyor=false;
function tazeSifirla(){const t=Date.now();Object.keys(TAZE_GRUP).forEach(g=>{_tazeAn[g]=t;});}
/* Bir grubun tablolarını çekip db'ye uygular */
async function grupCek(g){
  if(g==='randevu'){
    const r=await q('appointments');
    const eski={};db.appointments.forEach(a=>{eski[a.id]=a.log||[];});
    db.appointments=r.map(x=>mapRandevu(x,eski[x.id]));return;
  }
  if(g==='musteri'){db.customers=(await q('customers')).map(mapMusteri);return;}
  if(g==='potansiyel'){db.leads=(await leadsGetir(true)).map(mapLead);return;}
  if(g==='arac'){db.aracKonum=(await q('arac_konum')).map(mapAracKonum);return;}
  if(g==='maas'){
    db.payrolls=(await q('payrolls')).map(r=>({id:r.id,employeeId:r.employee_id,month:r.month,
      salary:num(r.salary),advanceDeducted:num(r.advance_deducted),paid:num(r.paid),
      date:r.date,txId:r.tx_id,accountId:r.account_id}));return;
  }
  if(g==='kasa'){
    db.transactions=(await q('transactions')).map(r=>({id:r.id,date:r.date,dir:r.dir,accountId:r.account_id,
      category:r.category,amount:num(r.amount),companyId:r.company_id,departmentId:r.department_id,
      employeeId:r.employee_id,desc:r.descr||'',source:r.source,refId:r.ref_id}));return;
  }
  if(g==='satis'){
    const [sat,kal,sub]=await Promise.all([q('sales'),q('sale_items'),q('sale_subscriptions')]);
    const items={};kal.forEach(r=>{(items[r.sale_id]=items[r.sale_id]||[]).push(
      {unitId:r.unit_id,fromWh:r.from_wh,fromHolder:r.from_holder});});
    const abone={};sub.forEach(r=>{(abone[r.sale_id]=abone[r.sale_id]||[]).push(r.abone_no);});
    db.sales=sat.map(r=>({id:r.id,date:r.date,employeeId:r.employee_id,departmentId:r.department_id,
      companyId:r.company_id,customerId:r.customer_id,customer:r.customer,productId:r.product_id,
      qty:r.qty,amount:num(r.amount),calcType:r.calc_type,hedefKat:r.hedef_kat||'',hedefKat2:r.hedef_kat2||'',
      unitPrim:num(r.unit_prim),unitPuan:num(r.unit_puan),prim:num(r.prim),puan:num(r.puan),
      gbProductId:r.gb_product_id||null,hatTip:r.hat_tip||'',
      gelir:num(r.gelir),gelirAlanId:r.gelir_alan_id||null,gelirPay:num(r.gelir_pay),
      upcellEski:r.upcell_eski||null,upcellYeni:r.upcell_yeni||null,
      metroHiz:r.metro_hiz==null?null:num(r.metro_hiz),metroSimetri:r.metro_simetri||'',
      batchId:r.batch_id||null,abone:abone[r.id]||[],items:items[r.id]||[]}));
  }
}
/* Ekrana girildiğinde çağrılır. Hiçbir şey beklemez, bitince çizer. */
async function ekranTazele(zorla){
  if(!me||!db||busy||dlgState.kind||_tazeCalisiyor)return;
  if(yaziyorMu())return;
  const ekran=state&&state.view;
  const gruplar=(EKRAN_GRUP[ekran]||[]).filter(g=>
    zorla||!_tazeAn[g]||(Date.now()-_tazeAn[g])>TAZE_SURE);
  if(!gruplar.length)return;
  _tazeCalisiyor=true;
  try{
    await Promise.all(gruplar.map(g=>grupCek(g).then(
      ()=>{_tazeAn[g]=Date.now();},
      ()=>{/* bir grup düşerse diğerleri yine de uygulansın */})));
    /* Ekran değişmediyse ve kullanıcı bir şeye dokunmadıysa yeniden çiz */
    if(state&&state.view===ekran&&!dlgState.kind&&!yaziyorMu()){
      const y=window.scrollY;
      _sonTazeleme=new Date();
      render();
      window.scrollTo(0,y);
    }
  }finally{_tazeCalisiyor=false;}
}
function tazelemeDamgasi(){
  const el=$('#canli-damga');if(!el)return;
  el.textContent=_sonTazeleme
    ? 'Güncellendi '+_sonTazeleme.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})
    : '';
}
function yaziyorMu(){
  const el=document.activeElement;
  return !!(el&&(el.matches('input,select,textarea')||el.isContentEditable));
}
async function canliTik(){
  const ekran=state&&state.view;
  /* Harita ve araç dışındaki ekranlar da açık kaldıkça tazelensin;
     orada ekranTazele yalnızca o ekranın tablolarını çeker. */
  if(ekran!=='harita'&&ekran!=='arac'){ekranTazele();return;}
  if(yaziyorMu())return;            /* kullanıcı bir alanla uğraşıyorsa bekle */
  const oldu=await canliVeriTazele();
  if(!oldu||!state||state.view!==ekran)return;
  if(ekran==='harita'){
    if(state.hrt.sekme!=='isi')haritaCanli(true);   /* görünümü koruyarak çiz */
    tazelemeDamgasi();
  }else{
    /* Üst rakamlar da değiştiği için ekranı yeniden çiziyoruz;
       sayfa konumu korunur, damga yeniden basılır. */
    const y=window.scrollY;
    render();
    window.scrollTo(0,y);
    tazelemeDamgasi();
  }
}
function canliSayacAyarla(){
  const ekran=(me&&state)?state.view:'';
  if(ekran===_canliEkran){tazelemeDamgasi();return;}
  _canliEkran=ekran;
  if(_canliSayac){clearInterval(_canliSayac);_canliSayac=null;}
  tazelemeDamgasi();
  if(!ekran)return;
  /* Harita ve araç dakikada bir; diğer ekranlar daha seyrek, çünkü
     oralarda kayıt akışı yavaş ve her tur sunucuya sorgu demek. */
  const canli=(ekran==='harita'||ekran==='arac');
  if(canli)canliTik();
  _canliSayac=setInterval(()=>{if(!document.hidden)canliTik();},
    canli?CANLI_ARALIK:CANLI_ARALIK*3);
}
/* Sekmeye geri dönüldüğünde beklemeden tazele: telefonu cebinden

document.addEventListener('visibilitychange',()=>{if(!document.hidden)canliTik();});

function saveTx(){
  const g=id=>$('#'+id).value,amount=parseFloat(String(g('f-amt')).replace(',','.'));
  const o={date:g('f-date'),dir:g('f-dir'),accountId:g('f-acc'),category:g('f-cat'),amount,companyId:g('f-company'),departmentId:g('f-dept'),employeeId:g('f-emp'),desc:g('f-desc').trim()};
  const err=m=>{$('#f-err').textContent=m;};
  if(!o.date)return err('Tarih seçin.');if(!o.category)return err('Kategori seçin.');if(!(amount>0))return err('Tutarı 0’dan büyük girin.');
  /* Envanter bakımında bağlar envanter kaydından okunur; ekrandaki
     şirket/departman/personel kutuları bilgi amaçlı ve kapalıdır. */
  let env=null;
  if(o.dir==='out'&&o.category===CAT_ENV){
    env=asset(g('f-asset'));
    if(!env)return err('Masrafın işleneceği envanter kaydını seçin.');
    if(!o.desc)return err('Yapılan işlemi açıklama alanına yazın.');
    const h=env.holderId?emp(env.holderId):null;
    o.companyId=(h?h.companyId:env.companyId)||'';
    o.departmentId=(h&&h.departmentId)||'';
    o.employeeId=h?h.id:'';
  }
  if(!o.companyId)return err('Şirket seçin.');
  run('f-err',async()=>{
    const t=await ins('transactions',{date:o.date,dir:o.dir,account_id:o.accountId,
      category:o.category,amount:o.amount,company_id:nz(o.companyId),
      department_id:nz(o.departmentId),employee_id:nz(o.employeeId),
      descr:env?(env.model+' – '+o.desc):o.desc,source:env?'tamir':'manuel'});
    /* Envanterin kendi bakım geçmişi ve toplam masrafı repairs'ten
       okunuyor; aynı kaydı oraya da yazıyoruz. Tutar iki kez gider
       sayılmaz, çünkü finansal bacak yalnızca transactions'tır. */
    if(env)await ins('repairs',{asset_id:env.id,date:o.date,descr:o.desc,cost:o.amount,
      account_id:o.accountId,tx_id:t.id,employee_id:nz(o.employeeId)});
  },'Hareket kaydedildi');
}

function savePay(){
  const d=dlgState,e=emp(d.empId),ay=state.payMonth;
  const err=m=>{$('#od-err').textContent=m;};
  const date=$('#od-date').value,accId=$('#od-acc').value;
  if(!date)return err('Ödeme tarihi seçin.');
  const oku=k=>{
    const c=$('#od-s-'+k),v=$('#od-t-'+k);
    if(!c||!v||!c.checked||c.disabled)return null;
    const t=parseFloat(String(v.value).replace(',','.'));
    return isNaN(t)?0:t;
  };
  /* Maaş ayrı: avans mahsubu var ve payrolls kaydı yazılıyor */
  const maasTutar=oku('maas');
  let ded=0,maasNet=0;
  if(maasTutar!==null){
    if(!(maasTutar>0))return err('Maaş tutarını 0’dan büyük girin ya da maaş kalemini seçimden çıkarın.');
    ded=clamp(parseFloat(String(($('#od-mahsup')||{}).value||'0').replace(',','.'))||0,0,Math.min(d.maxDed,maasTutar));
    maasNet=maasTutar-ded;
  }
  const kalemler=[];
  for(const t of ODEME_TURU){
    const tutar=oku(t.k);
    if(tutar===null)continue;
    if(!(tutar>0))return err(t.ad+' tutarını 0’dan büyük girin ya da seçimden çıkarın.');
    let baslik=t.ad;
    if(t.k==='diger'){
      baslik=norm(($('#od-baslik')||{}).value||'');
      if(!baslik)return err('Diğer ödeme için bir başlık yazın.');
    }
    kalemler.push({kat:t.kat,tutar,baslik});
  }
  if(maasTutar===null&&!kalemler.length)return err('En az bir kalem seçin.');
  run('od-err',async()=>{
    const ref=crypto.randomUUID();
    if(maasTutar!==null){
      let txId=null;
      if(maasNet>0){
        const t=await ins('transactions',{date,dir:'out',account_id:accId,category:'Maaş',amount:maasNet,
          company_id:nz(e.companyId),department_id:nz(e.departmentId),employee_id:e.id,
          descr:monthLabel(ay)+' maaşı'+(ded?' (avans mahsubu '+money(ded)+')':''),source:'maas',ref_id:ref});
        txId=t.id;
      }
      await ins('payrolls',{employee_id:e.id,month:ay,salary:maasTutar,advance_deducted:ded,
        paid:maasNet,date,tx_id:txId,account_id:accId});
    }
    if(kalemler.length)
      await insCok('transactions',kalemler.map(k=>({date,dir:'out',account_id:accId,
        category:k.kat,amount:k.tutar,company_id:nz(e.companyId),department_id:nz(e.departmentId),
        employee_id:e.id,descr:monthLabel(ay)+' '+k.baslik,source:'odeme',ref_id:ref})));
  },'Ödeme kaydedildi');
}

function saveStockIn(){

  if(!list.length)return err('En az bir seri numarası girin.');

  run('sg-err',async()=>{
    const r=await sb.from('stock_units').insert(list.map(x=>({product_id:pid,serial:x,
      warehouse_id:wid,status:'Depoda',giris_fiyat:fiyat,created_by:me.userId}))).select();

function saveEmp(){
  const name=$('#p-name').value.trim(),deptId=$('#p-dept').value;
  const salary=parseFloat(String($('#p-salary').value).replace(',','.'));
  const tut=i=>{const v=($('#'+i)||{}).value;return v===''?0:parseFloat(String(v).replace(',','.'));};
  const ticket=tut('p-ticket'),yol=tut('p-yol'),ekOdeme=tut('p-ekodeme'),ekPrim=tut('p-ekprim');
  const bayi=!!$('#p-bayi').checked,id=dlgState.id,err=m=>{$('#p-err').textContent=m;};
  if(!name)return err('Ad soyad girin.');
  if(!deptId)return err('Departman seçin.');
  if(!(salary>=0))return err('Net maaşı girin.');
  for(const [ad,v] of [['Ticket',ticket],['Yol parası',yol],['Ek ödeme',ekOdeme],['Prim',ekPrim]])
    if(!(v>=0))return err(ad+' tutarı negatif olamaz.');
  const row={name,company_id:$('#p-company').value,department_id:deptId,
             birim_id:nz($('#p-birim').value),
             title:$('#p-title').value.trim(),bayi_muduru:bayi};
  run('p-err',async()=>{
    // Bayi Müdürü tek kişi: önce diğerlerinden yetkiyi al
    if(bayi){
      const r=await sb.from('employees').update({bayi_muduru:false}).eq('bayi_muduru',true);
      if(r.error)throw r.error;

    let empId=id;
    if(id)await upd('employees',id,row);

    const sr=await sb.from('employee_salaries')
      .upsert({employee_id:empId,salary,ticket,yol,ek_odeme:ekOdeme,prim:ekPrim,
               updated_by:me.userId,updated_at:new Date().toISOString()},
              {onConflict:'employee_id'});

}

      const ha=$('#ap-hat');

      const o=$('#ap-oper'),ha=$('#ap-hat');

      if(ha)ha.value=c&&c.mobilAdet?c.mobilAdet:'';
      const er=$('#ap-err');if(er)er.textContent='';
      const uy=$('#ap-birim');
      if(uy)uy.innerHTML=baskaBirimUyari(el.value===NEW_CUST?null:el.value);
      return;
    }
    return;
  }
  if(k==='prod'){
    if(id==='pr-calc')$('#pr-calcwrap').innerHTML=prodCalcFields({calcType:el.value,prim:0,puan:0,primPct:0,puanPct:0});
    else if(id==='pr-gelirtip'){
      /* Yazılmış değeri koru; yalnızca etiket ve sınırlar değişsin */
      const g=$('#pr-gelir'),mevcut=g?g.value:'';
      $('#pr-gelirwrap').innerHTML=prodGelirField({gelirTip:el.value,gelir:mevcut});

    return;

  if(k==='target'){if(id==='tg-exempt'){const v=$('#tg-val');if(v)v.disabled=el.checked;}return;}
  if(k==='cust'){
    if(id==='c-il'){const w=$('#c-ilce');if(w)w.innerHTML=ilceOptions(el.value,'');return;}

  if(k==='tx'){

function setPath(path,val){const parts=path.split('.');let o=state;for(let i=0;i<parts.length-1;i++)o=o[parts[i]];o[parts[parts.length-1]]=val;}
function afterSet(path){
  const r=state.rep;
  if(path==='pot.durum'||path==='pot.emp')state.pot.page=0;
  if(path.indexOf('den.')===0){state.den.yuklendi=false;denetimYukle();}
  if(path==='rep.company'){
    if(r.dept&&r.dept!=='__none'&&r.company&&dept(r.dept).companyId!==r.company)r.dept='';
    if(r.emp&&r.emp!=='__none'&&r.company&&emp(r.emp).companyId!==r.company)r.emp='';
  }
  if(path==='rep.dept'&&r.emp&&r.emp!=='__none'&&r.dept&&r.dept!=='__none'&&emp(r.emp).departmentId!==r.dept)r.emp='';
}
function applyFilter(dim,key){
  const r=state.rep;
  if(dim==='departman'){r.dept=key;if(key!=='__none'&&dept(key))r.company=dept(key).companyId;}
  else if(dim==='personel'){r.emp=key;if(key!=='__none'&&emp(key)){r.company=emp(key).companyId;}}
  else if(dim==='kategori')r.cat=key;
  else if(dim==='sirket')r.company=key;
  afterSet('rep.company');
}

/* ---------- Sunucuya yazma ---------- */
function dbErr(e){
  const m=(e&&e.message)||String(e);
  if(/profiles_role_chk|role_chk/i.test(m))
    return 'Bu yetki veri tabanında henüz tanımlı değil. Supabase üzerinde ilgili SQL dosyasını çalıştırmanız gerekiyor (rol listesini genişleten dosya).';
  if(/arac_senk_log_tur_check/i.test(m))
    return 'Bu senkron türü veri tabanında tanımlı değil; ilgili SQL dosyasını çalıştırın.';
  if(/row-level security|violates row-level/i.test(m))return 'Bu işlem için yetkiniz yok.';
  if(/duplicate key|unique constraint/i.test(m))return 'Aynı kayıt zaten var.';
  if(/foreign key/i.test(m))return 'Bu kayda bağlı başka kayıtlar var, önce onları düzenleyin.';
  if(/Load failed|Failed to fetch|NetworkError/i.test(m))return 'Sunucuya ulaşılamadı. İnternet bağlantınızı kontrol edip tekrar deneyin.';
  return m;
}

  if(t==='leads')leadsEkle(r.data);
  return r.data;}
/* Çok sayıda satırı tek istekte yazar. Döngü içinde tek tek ins()
   çağırmak her satır için ayrı bir gidiş-dönüş demekti; 20 seri
   numaralı bir satışın iptali 40 ardışık isteğe çıkıyordu. */
async function insCok(t,rows){
  if(!rows||!rows.length)return;
  if(t==='leads')leadsKirlet();
  const r=await sb.from(t).insert(rows.map(x=>({...x,created_by:me.userId})));
  if(r.error)throw r.error;}
/* Aynı değerleri birden çok kayda tek istekte yazar */
async function updCok(t,ids,row){
  if(!ids||!ids.length)return;
  if(t==='leads')leadsKirlet();
  const r=await sb.from(t).update(row).in('id',ids).select('id');
  if(r.error)throw r.error;
  if(!r.data||r.data.length<ids.length)
    throw new Error('Kayıt güncellenemedi: bu kayıtların '+
      (ids.length-((r.data||[]).length))+' tanesi üzerinde değişiklik yapma yetkiniz yok.');}
/* ÖNEMLİ: Postgres'te yetki kuralı bir satırı gizlerse UPDATE ve
   DELETE hata vermez, sadece hiçbir satıra dokunmaz. Bu da "işlem
   oldu" sanılmasına yol açar. Bu yüzden etkilenen satırı geri
   isteyip gerçekten değiştiğini doğruluyoruz. */
async function upd(t,id,row){
  const r=await sb.from(t).update(row).eq('id',id).select('id');
  if(r.error)throw r.error;
  if(!r.data||!r.data.length)
    throw new Error('Kayıt güncellenemedi: bu kayıt üzerinde değişiklik yapma yetkiniz yok.');
  if(t==='leads')leadsYama(id,row);
}
async function del(t,id){
  const r=await sb.from(t).delete().eq('id',id).select('id');
  if(r.error)throw r.error;
  if(!r.data||!r.data.length)
    throw new Error('Kayıt silinemedi: bu kayıt üzerinde silme yetkiniz yok. Kendi girdiğiniz kayıtları yalnızca aynı hafta içinde silebilirsiniz; başkasının kaydı için müdürünüze başvurun.');
  if(t==='leads')leadsCikar(id);
}

let busy=false;
/* İşi çalıştırır, veriyi tazeler, diyaloğu kapatır. Hata olursa diyalogda gösterir. */
async function run(errId,work,okMsg,after){
  if(busy)return;busy=true;
  const setErr=m=>{const el=errId&&$('#'+errId);if(el)el.textContent=m;else if(m)toast(m);};
  try{
    setErr('');
    await work();
    await loadAll();
    tazeSifirla();            /* hepsi yeni indi, hemen tekrar çekme */
    closeDlg();
    if(okMsg)toast(okMsg);
    render();
    if(after)after();
  }catch(e){
    setErr(dbErr(e));
  }finally{busy=false;}
}

/* ---------------------------------------------------------------
   ALTI KADEMELİ YETKİ
   master · muhasebe · bayi_muduru · birim_muduru · destek · saha
----------------------------------------------------------------*/
const ROL_ADI={master:'Master',muhasebe:'Muhasebe',bayi_muduru:'Bayi müdürü',
  birim_muduru:'Birim müdürü',telesatis_lideri:'Telesatış takım lideri',
  destek:'Satış destek',telesatis:'Telesatış',saha:'Saha satış'};
const ROL_SIRA={master:0,muhasebe:1,bayi_muduru:2,birim_muduru:3,telesatis_lideri:4,destek:5,telesatis:6,saha:7};
const ROL_RENK={master:'ok',muhasebe:'warn',bayi_muduru:'warn',birim_muduru:'',
  telesatis_lideri:'',destek:'',telesatis:'',saha:''};
/* Eski rol adları yeni modele karşılık gelir (geçiş güvenliği) */
const ROL_ESKI={sahip:'master',yonetici:'bayi_muduru',personel:'saha'};
const rolAdi=r=>ROL_ESKI[r]||r||'saha';
const rolum=()=>me?rolAdi(me.role):'';

const isMaster  =()=>rolum()==='master';
const isMuhasebe=()=>rolum()==='muhasebe';
const isBayi    =()=>rolum()==='bayi_muduru';
const isBirim   =()=>rolum()==='birim_muduru';
/* Satış destek: kendi birimindeki herkes adına kayıt girebilir */
const isDestek  =()=>rolum()==='destek';
/* Telesatış: yalnızca kendi adına satış ve randevu girer */
const isTelesatis=()=>rolum()==='telesatis';
/* Telesatış takım lideri: kendi biriminin telesatış ekibini yönetir,
   kendisi de randevu alıp potansiyel girer. */
const isTLider  =()=>rolum()==='telesatis_lideri';
const isSaha    =()=>rolum()==='saha';
/* Tüm operasyonu gören kademe */
const isUst   =()=>isMaster()||isBayi();
/* Parasal ve özlük yetkisi */
const isFinans=()=>isMaster()||isMuhasebe();
/* Ekip yöneten kademe */
const isMudur =()=>isUst()||isBirim();
/* Rapor görebilenler */
const raporcu =()=>isUst()||isMuhasebe()||isBirim()||isTLider();

/* Yönettiğim birim; birim müdürüysem yönettiğim, değilsem bağlı olduğum */
function birimKapsamim(){
  if(!me||!me.employeeId)return null;
  const y=(db.birimler||[]).find(b=>b.mudurId===me.employeeId);
  if(y)return y.id;
  const t=(db.birimler||[]).find(b=>b.tliderId===me.employeeId);
  if(t)return t.id;
  const e=emp(me.employeeId);
  return e?(e.birimId||null):null;
}
/* Personel telesatış departmanında mı? */
function telesatisciMi(eid){
  const e=emp(eid);if(!e)return false;
  const d=dept(e.departmentId);
  return !!d&&trl(d.name).indexOf('telesat')>=0;
}
/* Tüm birimlere hizmet veren ekipte miyim? */
function capraz(){
  const b=byId(db.birimler,birimKapsamim());
  return !!b&&!!b.capraz;
}
/* Bu müşteri, tüm birimlere hizmet veren bir birime mi ait?
   Öyleyse her birim görebilir, düzenleyebilir, satış ve randevu
   yapabilir. */
function caprazMusteri(c){
  const b=c&&byId(db.birimler,c.birimId);
  return !!b&&!!b.capraz;
}
/* Bu personel benim kapsamımda mı? (kendim dahil) */
function ekipte(eid){
  if(!eid||!me)return false;
  if(eid===me.employeeId)return true;
  const k=birimKapsamim();if(!k)return false;
  const e=emp(eid);
  if(!e||e.birimId!==k)return false;
  /* Takım lideri yalnızca telesatış personelini kapsar. Çapraz
     birimde bu ayrım yok; birimin tamamı tek ekiptir. */
  return isTLider()?(capraz()||telesatisciMi(eid)):true;
}
/* Hangi personeller adına kayıt girilebilir (satış, randevu, liste atama) */
function adinaYazabilecekler(){
  const hepsi=aktifPersonel();        /* zaten departman + ad sıralı */
  /* Satış destek birim ayrımı olmadan herkes adına kayıt girer */
  if(isUst()||isMuhasebe()||isDestek())return hepsi;
  /* Birim müdürü kendi birimini, takım lideri kendi telesatış ekibini kapsar */
  if(isBirim()||isTLider())return hepsi.filter(e=>ekipte(e.id));
  /* Telesatış ve saha yalnızca kendi adına kayıt girer */
  return hepsi.filter(e=>e.id===me.employeeId);
}
/* Prim tutarları yalnızca bayi müdürü, muhasebe ve master'da görünür.
   isUst() master ile bayi müdürünü kapsar. */
const primGor=()=>isUst()||isMuhasebe();
/* Gelir, şirketin operatörden aldığı hakediştir; satış ekibini
   ilgilendirmez. Ürün ve satır bazında master ile muhasebe görür —
   muhasebe ürünlerin gelir ayarlarını yönettiği için gerekli. */
const gelirGor=()=>isFinans();
/* Personel bazında gelir dökümü daha hassas: kimin ne kazandırdığını
   kişi kişi gösterir. Yalnızca master görür. */
const gelirRaporGor=()=>isMaster();
const isSahip=()=>isMaster();
const isAdmin=()=>isUst();
/* Yalnızca yönetimin göreceği ekranlar */
/* Hangi rol hangi ekranı görür */
const EKRAN_YETKI={
  ozet     :()=>raporcu(),
  kasa     :()=>isFinans(),
  maas     :()=>isFinans(),
  urun     :()=>isFinans(),
  stok     :()=>isFinans()||isUst()||isBirim(),   /* müdürler görür, işlem yapamaz */
  zimmet   :()=>isFinans()||isUst()||isBirim(),   /* müdürler görür, işlem yapamaz */
  personel :()=>isFinans(),
  org      :()=>isFinans()||isUst(),
  kullanici:()=>isMaster(),
  rapor    :()=>raporcu(),
  denetim  :()=>isMaster(),
  satis    :()=>true,
  /* Satış destek kendi hedefi olmayan bir destek rolü; hedef ekranı işine yaramıyor */
  hedef    :()=>!isDestek(),
  /* Saha personelinin ekranı sade tutuldu: müşteri listesini gezmesine
     gerek yok, müşteriye randevu ve satış kayıtlarından ulaşıyor. */
  musteri  :()=>!isSaha(),
  /* Büyük düğmeli ana sayfa yalnızca saha personelinde */
  anasayfa :()=>isSaha(),
  potansiyel:()=>!isMuhasebe(),
  randevu  :()=>!isMuhasebe(),
  arac     :()=>!isSaha()&&takipliAraclar().length>0,
  /* Harita saha yönlendirmesi içindir; satış destek saha işi yapmıyor */
  harita   :()=>!isDestek()&&(takipliAraclar().length>0||db.appointments.some(a=>a.status==='Açık'))
};
const gorebilir=v=>{const f=EKRAN_YETKI[v];return f?f():true;};
/* Giriş sonrası ilk açılan ekran. Saha personeli günü randevularıyla

async function doSignup(){
  const email=(($('#sg-email')||{}).value||'').trim();
  const p1=($('#sg-pass')||{}).value||'',p2=($('#sg-pass2')||{}).value||'';
  if(!email)return renderSignup('E-posta adresinizi girin.');
  if(p1.length<8)return renderSignup('Şifre en az 8 karakter olmalı.');
  if(p1!==p2)return renderSignup('Şifreler birbiriyle aynı değil.');
  renderSignup('',true);
  const {data,error}=await sb.auth.signUp({email,password:p1});
  if(error){
    const m=/already registered|already exists/i.test(error.message)?'Bu e-posta ile kayıtlı bir hesap zaten var. Giriş yapmayı deneyin.':
            /password/i.test(error.message)?'Şifre kurallara uymuyor. Daha uzun bir şifre deneyin.':error.message;
    return renderSignup(m);
  }
  if(data&&data.session){await afterLogin();return;}
  renderSignup('',false,'Hesabınız oluşturuldu. E-postanıza gönderilen doğrulama bağlantısına tıkladıktan sonra giriş yapabilirsiniz.');
}

async function doLogin(){
  const email=($('#lg-email')||{}).value||'',pass=($('#lg-pass')||{}).value||'';
  if(!email.trim())return renderLogin('E-posta adresinizi girin.');
  if(!pass)return renderLogin('Şifrenizi girin.');
  renderLogin('',true);
  const {error}=await sb.auth.signInWithPassword({email:email.trim(),password:pass});
  if(error){
    const m=/Invalid login/i.test(error.message)?'E-posta veya şifre hatalı.':
            /Email not confirmed/i.test(error.message)?'E-posta adresiniz henüz doğrulanmamış.':error.message;
    return renderLogin(m);
  }
  await afterLogin();
}

async function doLogout(){
  await sb.auth.signOut();
  me=null;emptyDb();renderLogin();
}

async function afterLogin(){
  try{
    const {data:{user}}=await sb.auth.getUser();
    if(!user)return renderLogin('Oturum açılamadı, tekrar deneyin.');
    const pr=await sb.from('profiles').select('role,employee_id').eq('user_id',user.id).maybeSingle();
    if(pr.error)return renderLogin('Profil okunamadı: '+pr.error.message);
    me={userId:user.id,email:user.email,role:pr.data?pr.data.role:'saha',employeeId:pr.data?pr.data.employee_id:null};
    await loadAll(true);
    tazeSifirla();            /* her şey yeni indi; ilk geçişte tekrar çekme */
    state=defaultState();
    render();
  }catch(e){
    renderLogin('Veriler yüklenemedi: '+(e&&e.message?e.message:e));
  }
}

async function reloadData(){
  try{await loadAll(true);tazeSifirla();render();toast('Veriler yenilendi');}
  catch(e){toast('Yenilenemedi: '+(e&&e.message?e.message:e));}
}

function init(){
  emptyDb();
  state=defaultState();
  document.addEventListener('click',e=>{
    /* Açık menü, dışına tıklanınca kapanır */
    if(state&&state.navAcik&&!(e.target.closest&&e.target.closest('.nav-group'))){
      state.navAcik='';render();}
    const el=e.target.closest&&e.target.closest('[data-act]');if(!el)return;
    const act=el.dataset.act;
    const fn=actions[act];if(fn)fn(el,e);
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&state&&state.navAcik){state.navAcik='';render();return;}
    if(e.key==='Enter'&&e.target.matches&&e.target.matches('#lg-email,#lg-pass')){e.preventDefault();doLogin();return;}
    if(e.key==='Enter'&&e.target.matches&&e.target.matches('#sg-email,#sg-pass,#sg-pass2')){e.preventDefault();doSignup();return;}
    if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('tr.click')){e.preventDefault();const fn=actions[e.target.dataset.act];if(fn)fn(e.target);}
  });
  document.addEventListener('change',e=>{
    const el=e.target;
    if(el.id==='mut-file'){const f=el.files&&el.files[0];if(f)mutDosyaOku(f);return;}
    if(el.id==='mut-ay'){_mutAy=el.value;mutHesapla();render();return;}
    if(el.dataset&&el.dataset.set){setPath(el.dataset.set,el.value);afterSet(el.dataset.set);render();return;}
    if(el.id&&dlgState.kind){
      if(el.id==='a-emp'){$('#a-open').textContent=money(openAdvance(el.value));return;}
      dialogChange(el);
    }
  });
  document.addEventListener('input',e=>{
    const el=e.target;
    if(el.id==='kq'){state.kasa.q=el.value;const box=$('#txlist');if(box)box.innerHTML=txTable();}
    else if(el.id==='sq'){state.stok.q=el.value;const box=$('#stoklist');if(box)box.innerHTML=stokTable();}
    else if(el.id&&el.id.endsWith('-serials')){const c=$('#'+el.id.replace('-serials','-count'));if(c)c.textContent=parseSerials(el.value).length+' seri no okundu';}
    else if(/^sls-/.test(el.id||'')){const k=el.id.slice(4);const c=$('#slsc-'+k);
      if(c)c.textContent=parseSerials(el.value).length+' seri no okundu';updateLinePreview(k);updateSaleTotals();}
    else if(/^slab-/.test(el.id||'')){const k=el.id.slice(5);const c=$('#slabc-'+k);
      const n=parseSerials(el.value).length;
      if(c)c.textContent=n+' numara girildi';
      /* Numara sayısı adedi belirliyor: adet kutusunu da güncelle */
      const q=$('#slq-'+k);
      if(q){if(n){q.value=n;q.disabled=true;}else{q.disabled=false;}}
      updateLinePreview(k);updateSaleTotals();}
    else if(/^slq-/.test(el.id||'')){updateLinePreview(el.id.slice(4));updateSaleTotals();}
    else if(/^slh-/.test(el.id||'')){slRead();updateLinePreview(el.id.slice(4));updateSaleTotals();}
    else if(/^sla-/.test(el.id||'')){updateLinePreview(el.id.slice(4));updateSaleTotals();}
    else if(el.id==='slq'){state.sat.q=el.value;const box=$('#satlist');if(box)box.innerHTML=satTable();}
    else if(el.id==='iq'){state.inv.q=el.value;const box=$('#invlist');if(box)box.innerHTML=invTable();}
    else if(el.id==='aq'){state.aracQ=el.value;const box=$('#araclist');if(box)box.innerHTML=aracTable();}
    else if(el.id==='arac-bas'||el.id==='arac-bit'){
      state.arac[el.id==='arac-bas'?'bas':'bit']=el.value||TODAY;render();}
    else if(el.id==='hrt-bas'||el.id==='hrt-bit'||el.id==='hrt-emp'){
      state.hrt[el.id==='hrt-bas'?'bas':el.id==='hrt-bit'?'bit':'emp']=el.value;
      haritaYenile();}
    else if(el.id==='pq'){state.prod.q=el.value;const box=$('#prodlist');if(box)box.innerHTML=prodTable();}
    else if(el.id==='cq'){state.cust.q=el.value;const box=$('#custlist');if(box)box.innerHTML=custTable();}
    else if(el.id==='denq'){state.den.q=el.value;const box=$('#denlist');if(box)box.innerHTML=denetimTablo();}
    else if(el.id==='potq'){state.pot.q=el.value;state.pot.page=0;const box=$('#potlist');if(box)box.innerHTML=potTable();}
    else if(dlgState.kind==='lead'&&['l-unvan','l-tel','l-vkn','l-yetkili','l-adres'].indexOf(el.id)>=0){
      dlgState.leadConfirmed=false;leadBenzerYenile();}
    /* Hızlı müşteri formu: satış (sl-), randevu (ap-) pencerelerinde */
    else if(/^(sl|ap)-(cu|ct|cy|cadres)$/.test(el.id||'')){
      const pre=el.id.split('-')[0];
      dlgState.apDup=false;dlgState.slDup=false;
      hizliBenzerYenile(pre);}
    else if(el.id==='rq'){state.rand.q=el.value;const box=$('#randlist');if(box)box.innerHTML=randListe();}
    else if((el.id==='c-unvan'||el.id==='c-tel'||el.id==='c-vkn'||el.id==='c-yetkili'||el.id==='c-adres')&&dlgState.kind==='cust'){
      dlgState.dupConfirmed=false;const b=$('#c-benzer');if(b)b.innerHTML='';}
    else if((el.id==='sl-cu'||el.id==='sl-ct')&&dlgState.kind==='sale'){dlgState.slDup=false;}
    else if((el.id==='ap-cu'||el.id==='ap-ct')&&dlgState.kind==='appt'){dlgState.apDup=false;}
    else if(dlgState.kind==='odeme'&&/^od-/.test(el.id||''))odemeToplamiYenile();
  });
  const d=$('#dlg');
  d.addEventListener('click',e=>{if(e.target===d)closeDlg();});
  d.addEventListener('close',()=>{dlgState={};});
  boot();
}
init();
})();
</script>
</body>
</html>
