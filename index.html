<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saha Operasyon Yönetimi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F4F7; --surface:#FFFFFF; --ink:#14202B; --muted:#5A6A79; --line:#DBE1E7;
  --side:#E7ECF1; --accent:#1F4FD8; --accent-ink:#FFFFFF; --accent-soft:#E4EBFC;
  --in:#146C4E; --in-soft:#E0F2EA; --out:#A93226; --out-soft:#FBE7E4;
  --warn:#8A5600; --warn-soft:#FAEFD6; --warn-line:#D9A441;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E151D; --surface:#16202B; --ink:#E6ECF2; --muted:#93A3B3; --line:#263442;
    --side:#0B1118; --accent:#7C9BFF; --accent-ink:#0B1220; --accent-soft:#1B2848;
    --in:#4CC38F; --in-soft:#14332A; --out:#F0806F; --out-soft:#3A1D19;
    --warn:#E8B85C; --warn-soft:#38290E; --warn-line:#B98A2E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E151D; --surface:#16202B; --ink:#E6ECF2; --muted:#93A3B3; --line:#263442;
  --side:#0B1118; --accent:#7C9BFF; --accent-ink:#0B1220; --accent-soft:#1B2848;
  --in:#4CC38F; --in-soft:#14332A; --out:#F0806F; --out-soft:#3A1D19;
  --warn:#E8B85C; --warn-soft:#38290E; --warn-line:#B98A2E;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:14px/1.45 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:'Bricolage Grotesque','IBM Plex Sans',system-ui,sans-serif;margin:0;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
p{margin:0}
.muted{color:var(--muted)} .sm{font-size:12.5px} .nowrap{white-space:nowrap}
.in{color:var(--in)} .out{color:var(--out)}

.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:16px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:2px 6px}
.mark{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand b{display:block;font-family:'Bricolage Grotesque','IBM Plex Sans',sans-serif;font-size:16px;font-weight:600;line-height:1.15}
.brand span{font-size:12px;color:var(--muted)}
.nav-group{display:flex;flex-direction:column;gap:2px;margin-bottom:10px}
.nav-title{font-size:12px;color:var(--muted);padding:4px 10px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:8px 10px;border:0;background:transparent;border-radius:8px}
.nav:hover:not([disabled]){background:var(--surface)}
.nav[aria-current="page"]{background:var(--surface);box-shadow:inset 3px 0 0 var(--accent);font-weight:600}
.nav[disabled]{color:var(--muted);cursor:default}
.tag{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 7px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 6px}
.side-foot p{font-size:12px;color:var(--muted)}

.main{padding:24px 28px 64px;max-width:1260px;width:100%}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-head h1{font-size:28px;font-weight:600}
.sub{color:var(--muted);margin-top:4px;max-width:62ch}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:16px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:17px;font-weight:600}
.panel-b{padding:14px 16px}
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:16px}
.scroll{overflow-x:auto}

table{width:100%;border-collapse:collapse}
th{font-weight:500;color:var(--muted);text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12.5px}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
.num{text-align:right;white-space:nowrap}
th.num{text-align:right}
tr.click{cursor:pointer}
tr.click:hover{background:var(--accent-soft)}
tr.total td{font-weight:600;border-top:1px solid var(--line)}
.plain td{padding:8px 16px}

.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--out);border-color:var(--out)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:focus-visible,.nav:focus-visible,input:focus-visible,select:focus-visible,.bar-row:focus-visible,.chip:focus-visible,tr.click:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
.tools select,.tools input{width:auto}
tr.sel{background:var(--accent-soft)}
.preview{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-weight:500}
.preview.sm{font-weight:400;font-size:13px;padding:8px 12px;margin-top:12px}
.sline{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:12px;background:var(--paper)}
.sline-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sline-h b{font-size:14px}
.hcell{display:flex;flex-direction:column;align-items:flex-end;gap:3px;padding:6px 4px;border:0;background:transparent;width:100%;text-align:right;border-radius:6px;min-width:92px}
.hcell:hover{background:var(--accent-soft)}
.hbar{display:block;width:100%;height:5px;background:var(--paper);border-radius:3px;overflow:hidden}
.hbar span{display:block;height:100%;background:var(--accent)}
.svc-chip{display:inline-block;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:12px;margin:0 4px 4px 0}
textarea{resize:vertical}
.clamp{max-width:38ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left;min-width:150px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.chip span{font-size:12.5px;color:var(--muted)}
.chip b{font-size:16px;font-family:'Bricolage Grotesque','IBM Plex Sans',sans-serif;font-weight:600}

.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:500;background:var(--paper);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--in-soft);color:var(--in);border-color:transparent}
.badge.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.badge.bad{background:var(--out-soft);color:var(--out);border-color:transparent}

.kpis{display:flex;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:16px}
.kpi{flex:1 1 170px;padding:12px 16px;border-right:1px solid var(--line)}
.kpi:last-child{border-right:0}
.kpi span{display:block;color:var(--muted);font-size:12.5px}
.kpi b{font-family:'Bricolage Grotesque','IBM Plex Sans',sans-serif;font-size:22px;font-weight:600}

.bar-row{display:grid;grid-template-columns:minmax(110px,220px) minmax(60px,1fr) auto;gap:14px;align-items:center;width:100%;padding:8px 8px;border:0;background:transparent;text-align:left;border-radius:8px}
.bar-row:hover{background:var(--accent-soft)}
.bar-track{height:16px;background:var(--paper);border-radius:4px;overflow:hidden}
.bar-fill{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar-fill.none{background:repeating-linear-gradient(45deg,var(--warn-line) 0 6px,transparent 6px 12px);border:1px solid var(--warn-line)}
.bar-val{font-weight:600;white-space:nowrap;text-align:right;min-width:128px}
.bar-val small{font-weight:400;color:var(--muted);margin-left:6px}

.meter-row{padding:10px 16px}
.meter-row div:first-child{display:flex;justify-content:space-between;margin-bottom:5px}
.meter{height:8px;background:var(--paper);border-radius:4px;overflow:hidden}
.meter span{display:block;height:100%;background:var(--in);border-radius:4px}

.att{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.att:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--warn-line)}
.dot.bad{background:var(--out)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.hint{color:var(--muted);font-size:12.5px;margin-top:10px}

dialog{border:1px solid var(--line);border-radius:12px;padding:0;background:var(--surface);color:var(--ink);width:min(840px,calc(100vw - 24px));max-height:none}
dialog[open]{display:block}
dialog::backdrop{background:rgba(10,18,28,.55)}
.dlg-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:16px 20px;border-bottom:1px solid var(--line)}
.dlg-h h2{font-size:19px;font-weight:600}
.dlg-b{padding:18px 22px;overflow-y:auto;max-height:calc(100vh - 210px)}
.dlg-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-weight:500;font-size:13.5px}
.err{color:var(--out);font-size:13px;min-height:18px;margin-top:10px}
.dsec{padding:12px 0;border-bottom:1px solid var(--line)}
.dsec:last-child{border-bottom:0}
.dsec h3{font-size:14.5px;font-weight:600;margin-bottom:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row select{flex:1 1 180px;width:auto}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.log li{display:grid;grid-template-columns:86px 1fr;gap:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin-bottom:12px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500;text-align:right}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#toast.show{opacity:1}

/* Giriş ekranı */
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.auth-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;width:min(400px,100%)}
.auth-card .brand{margin-bottom:18px;padding:0}
.auth-card h1{font-size:21px;font-weight:600;margin-bottom:4px}
.auth-card .sub{margin-bottom:18px}
.auth-card .field{margin-bottom:12px}
.auth-card .btn{width:100%;padding:10px;margin-top:6px}
.auth-note{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.who{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.who b{font-size:13px;overflow:hidden;text-overflow:ellipsis}
.ro-banner{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn-line);border-radius:8px;padding:9px 14px;margin-bottom:16px;font-size:13px}

@media (max-width:980px){.grid2{grid-template-columns:1fr}}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px;gap:8px;border-right:0;border-bottom:1px solid var(--line)}
  .brand span,.nav-title,.side-foot,.later{display:none}
  .nav-group{flex-direction:row;flex-wrap:wrap;margin:0}
  .nav{width:auto;padding:6px 10px}
  .main{padding:18px 14px 56px}
  .bar-row{grid-template-columns:1fr auto}
  .bar-row .bar-track{grid-column:1/-1;order:3}
  .fields{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const PK_KOLON={profiles:'user_id',employee_salaries:'employee_id'};
async function q(t){
  const N=1000,key=PK_KOLON[t]||'id';
  let out=[],from=0;
  for(;;){
    const r=await sb.from(t).select('*').order(key,{ascending:true}).range(from,from+N-1);
    if(r.error)throw new Error(t+': '+r.error.message);
    const d=r.data||[];
    out=out.length?out.concat(d):d;
    if(d.length<N)break;
    from+=d.length;
  }
  return out;
}

function addTx(o){
  const t={id:uid('t'),date:o.date,dir:o.dir,accountId:o.accountId,category:o.category,amount:+o.amount,
    companyId:o.companyId||null,departmentId:o.departmentId||null,employeeId:o.employeeId||null,
    desc:o.desc||'',source:o.source||'manuel',refId:o.refId||null};
  db.transactions.push(t);return t.id;
}
function ctxOfEmp(id){const e=emp(id);return e?{employeeId:e.id,departmentId:e.departmentId,companyId:e.companyId}:{};}
function addTransfer(date,from,to,amount,desc){
  const ref=uid('v');
  addTx({date,dir:'out',accountId:from,category:'Virman',amount,companyId:acct(from).companyId,desc:desc||('Virman: '+acct(to).name),source:'virman',refId:ref});
  addTx({date,dir:'in',accountId:to,category:'Virman',amount,companyId:acct(to).companyId,desc:desc||('Virman: '+acct(from).name),source:'virman',refId:ref});
}
function balance(id){const a=acct(id);return a.opening+db.transactions.filter(t=>t.accountId===id).reduce((s,t)=>s+(t.dir==='in'?t.amount:-t.amount),0);}
function openAdvance(empId){
  const given=sum(db.transactions.filter(t=>t.source==='avans'&&t.employeeId===empId));
  const ded=db.payrolls.filter(p=>p.employeeId===empId).reduce((s,p)=>s+p.advanceDeducted,0);
  return Math.max(0,given-ded);
}
function addAdvance(empId,amount,date,accountId,desc){
  addTx({date,dir:'out',accountId,category:'Personel avansı',amount,...ctxOfEmp(empId),desc:desc||'Personel avansı',source:'avans'});
}
function payPayroll(empId,month,deduct,accountId,date){
  const e=emp(empId);deduct=clamp(deduct,0,Math.min(openAdvance(empId),e.salary));
  const paid=e.salary-deduct;let txId=null;

const inPeriod=(t,p)=>p==='all'||t.date.startsWith(p);
const expenses=p=>db.transactions.filter(t=>t.dir==='out'&&t.source!=='virman'&&inPeriod(t,p));
const incomes=p=>db.transactions.filter(t=>t.dir==='in'&&t.source!=='virman'&&inPeriod(t,p));
function monthsList(){
  const s=new Set(db.transactions.map(t=>t.date.slice(0,7)));
  db.sales.forEach(x=>x.date&&s.add(x.date.slice(0,7)));
  db.appointments.forEach(x=>x.date&&s.add(x.date.slice(0,7)));
  (db.leads||[]).forEach(x=>x.createdAt&&s.add(String(x.createdAt).slice(0,7)));
  s.add(TODAY.slice(0,7));
  return [...s].sort().reverse();
}
function defaultPeriod(){
  const cur=TODAY.slice(0,7);
  if(db.transactions.some(t=>t.date.startsWith(cur)))return cur;
  return monthsList().find(m=>db.transactions.some(t=>t.date.startsWith(m)))||cur;
}
function keyFor(dim,t){return dim==='departman'?(t.departmentId||''):dim==='personel'?(t.employeeId||''):dim==='kategori'?t.category:dim==='sirket'?(t.companyId||''):t.date.slice(0,7);}
function labelFor(dim,key){
  if(dim==='departman')return key?(dept(key)||{name:'Silinmiş departman'}).name:'Departmana bağlı değil';
  if(dim==='personel')return key?(emp(key)||{name:'Silinmiş personel'}).name:'Personele bağlı değil';
  if(dim==='kategori')return key||'Kategorisiz';
  if(dim==='sirket')return key?(comp(key)||{name:'Silinmiş şirket'}).name:'Şirkete bağlı değil';
  return monthLabel(key);
}
function groupExp(list,dim){
  const m=new Map();
  list.forEach(t=>{const k=keyFor(dim,t);const g=m.get(k)||{key:k,total:0,count:0};g.total+=t.amount;g.count++;m.set(k,g);});
  const arr=[...m.values()];arr.forEach(g=>g.label=labelFor(dim,g.key));
  return dim==='ay'?arr.sort((a,b)=>a.key<b.key?1:-1):arr.sort((a,b)=>b.total-a.total);
}
function repMatch(t,r){
  if(r.company&&t.companyId!==r.company)return false;
  if(r.dept){if(r.dept==='__none'){if(t.departmentId)return false;}else if(t.departmentId!==r.dept)return false;}
  if(r.emp){if(r.emp==='__none'){if(t.employeeId)return false;}else if(t.employeeId!==r.emp)return false;}
  if(r.cat&&t.category!==r.cat)return false;
  return true;
}

/* Personel seçim listesi: departmana göre gruplanır, her grup kendi
   içinde alfabetik sıralanır. Ayrılanlar gizlenir; yalnızca seçili
   olan ayrılmışsa görünür kalır ki eski kayıt düzenlenebilsin. */
function empOptGroups(list,sel,ph,etiket){
  const gruplar={},sirasiz=[];
  list.forEach(e=>{
    const d=(dept(e.departmentId)||{}).name;
    if(d)(gruplar[d]=gruplar[d]||[]).push(e);else sirasiz.push(e);
  });
  const adlar=Object.keys(gruplar).sort((a,b)=>a.localeCompare(b,'tr'));
  const satir=e=>'<option value="'+esc(e.id)+'"'+(e.id===sel?' selected':'')+'>'+
    esc(etiket?etiket(e):e.name)+(ayrildi(e)?' (ayrıldı)':'')+'</option>';
  const grup=(ad,ls)=>'<optgroup label="'+esc(ad)+'">'+
    ls.slice().sort((a,b)=>a.name.localeCompare(b.name,'tr')).map(satir).join('')+'</optgroup>';
  return (ph!==undefined?'<option value="">'+esc(ph)+'</option>':'')+
    adlar.map(a=>grup(a,gruplar[a])).join('')+
    (sirasiz.length?grup('Departman atanmamış',sirasiz):'');
}

function startOfWeek(dateStr){
  const d=new Date(dateStr+'T00:00:00');
  const dow=(d.getDay()+6)%7;
  d.setDate(d.getDate()-dow);
  return d;
}
function isoOf(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function ozetRandevuPanel(){
  const wkStart=startOfWeek(TODAY),wkStartISO=isoOf(wkStart);
  const wkEnd=new Date(wkStart);wkEnd.setDate(wkEnd.getDate()+6);const wkEndISO=isoOf(wkEnd);
  const monthISO=TODAY.slice(0,7);
  const rows=db.employees.map(e=>{
    const mine=db.appointments.filter(a=>a.employeeId===e.id);
    return {e,
      today:mine.filter(a=>a.date===TODAY).length,

      month:mine.filter(a=>a.date.startsWith(monthISO)).length};

    rows.map(r=>'<tr><td><div>'+esc(r.e.name)+'</div><div class="muted sm">'+esc((dept(r.e.departmentId)||{}).name)+'</div></td><td class="num">'+(r.today||'-')+'</td><td class="num">'+(r.week||'-')+'</td><td class="num">'+(r.month||'-')+'</td></tr>').join('')+
    '<tr class="total"><td>Toplam</td><td class="num">'+totToday+'</td><td class="num">'+totWeek+'</td><td class="num">'+totMonth+'</td></tr>'+

const salesIn=p=>db.sales.filter(s=>inPeriod(s,p));
function satGroups(list,group){
  const m=new Map();
  list.forEach(s=>{
    const p=byId(db.products,s.productId);let k,l,sub='';
    if(group==='personel'){k=s.employeeId;const e=emp(k);l=e?e.name:'Silinmiş personel';sub=e?((dept(e.departmentId)||{}).name||''):'';}
    else if(group==='departman'){k=s.departmentId||'';l=k?(dept(k)||{name:'Silinmiş departman'}).name:'Departmansız';}
    else if(group==='urun'){k=s.productId;l=prodLabel(p);sub=p?p.category:'';}
    else{k=p?p.category:'';l=k||'Kategorisiz';}
    const g=m.get(k)||{k,l,sub,qty:0,puan:0,prim:0,n:0};g.qty+=s.qty;g.puan+=s.puan;g.prim+=s.prim;g.n++;m.set(k,g);
  });
  return [...m.values()].sort((a,b)=>b.puan-a.puan||b.prim-a.prim);
}

function lineCalc(L){
  const p=byId(db.products,L.prod);
  if(!p)return {p:null,qty:0,amount:0,prim:0,puan:0};
  const qty=p.stocked?parseSerials(L.serials).length:Math.max(0,parseInt(L.qty,10)||0);
  const amount=needsAmount(p)?Math.max(0,parseFloat(String(L.amount).replace(',','.'))||0):0;
  const prim=p.calcType==='yuzde'?amount*(p.primPct||0)/100:qty*(p.prim||0);
  const puan=p.calcType==='yuzde'?amount*(p.puanPct||0)/100:qty*(p.puan||0);
  return {p,qty,amount,prim,puan};
}

function saveSale(){
  const g=id=>$('#'+id)?$('#'+id).value:'',err=m=>{$('#sl-err').textContent=m;};
  slRead();
  const date=g('sl-date'),empId=g('sl-emp'),custSel=g('sl-cust'),e=emp(empId);
  if(!date)return err('Tarih seçin.');if(!e)return err('Satışı yapan personeli seçin.');
  if(custSel!==NEW_CUST&&!norm(g('sl-customer')))return err('Müşteri adını girin.');
  const lines=dlgState.lines||[];
  if(!lines.length)return err('En az bir ürün satırı ekleyin.');
  const hazir=[],tumSeri=new Set();
  for(let i=0;i<lines.length;i++){
    const L=lines[i],no=(i+1)+'. ürün: ',p=byId(db.products,L.prod);
    if(!p)return err(no+'ürün seçin.');
    let qty=0,units=[];
    if(p.stocked){
      const list=parseSerials(L.serials);
      if(!list.length)return err(no+'en az bir seri numarası girin.');
      const seen=new Set(),dups=[];
      list.forEach(x=>{const k=x.toLocaleLowerCase('tr');if(seen.has(k)||tumSeri.has(k))dups.push(x);seen.add(k);tumSeri.add(k);});
      if(dups.length)return err(no+'tekrar eden seri no var: '+missingText(dups));
      const notFound=[],wrong=[],unavail=[];
      list.forEach(x=>{const u=stockBySerial(x);
        if(!u)notFound.push(x);else if(u.productId!==p.id)wrong.push(x);
        else if(u.status==='Depoda'||(u.status==='Personelde'&&u.holderId===empId))units.push(u);else unavail.push(x);});
      if(notFound.length)return err(no+notFound.length+' seri no stokta bulunamadı: '+missingText(notFound));
      if(wrong.length)return err(no+wrong.length+' seri no seçilen ürüne ait değil: '+missingText(wrong));
      if(unavail.length)return err(no+unavail.length+' seri no satışa uygun değil (satılmış, fire veya başka personelde): '+missingText(unavail));
      qty=units.length;
    }else{
      qty=parseInt(L.qty,10)||0;
      if(qty<1)return err(no+'adet en az 1 olmalı.');
    }
    let amount=0;
    if(needsAmount(p)){
      amount=parseFloat(String(L.amount).replace(',','.'))||0;
      if(!(amount>0))return err(no+'satış tutarını 0’dan büyük girin.');
    }
    const calc=p.calcType||'sabit';
    hazir.push({p,qty,units,amount,calc,abone:parseSerials(L.abone),
      prim:calc==='yuzde'?amount*(p.primPct||0)/100:qty*(p.prim||0),
      puan:calc==='yuzde'?amount*(p.puanPct||0)/100:qty*(p.puan||0)});
  }
  const tPrim=hazir.reduce((a,x)=>a+x.prim,0),tPuan=hazir.reduce((a,x)=>a+x.puan,0);
  const tUnit=hazir.reduce((a,x)=>a+x.units.length,0),tAbone=hazir.reduce((a,x)=>a+x.abone.length,0);
  run('sl-err',async()=>{
    let custId=custSel&&custSel!==NEW_CUST?custSel:null;
    let customer=norm(g('sl-customer'));
    if(custSel===NEW_CUST){
      const res=await quickCreateCustomer('sl','slDup');
      if(res.error)throw new Error(res.error);
      custId=res.customer.id;customer=res.customer.unvan;
    }
    const batch=crypto.randomUUID();
    for(const L of hazir){
      const sale=await ins('sales',{date,employee_id:empId,department_id:nz(e.departmentId),
        company_id:nz(e.companyId),customer_id:custId,customer,product_id:L.p.id,qty:L.qty,
        amount:L.amount,calc_type:L.calc,hedef_kat:L.p.hedefKat||'',batch_id:batch,
        unit_prim:L.calc==='yuzde'?(L.p.primPct||0):(L.p.prim||0),
        unit_puan:L.calc==='yuzde'?(L.p.puanPct||0):(L.p.puan||0),prim:L.prim,puan:L.puan});
      if(L.abone.length){
        const ar=await sb.from('sale_subscriptions').insert(
          L.abone.map(x=>({sale_id:sale.id,abone_no:x,created_by:me.userId})));
        if(ar.error)throw ar.error;
      }
      if(L.units.length){
        const ir=await sb.from('sale_items').insert(L.units.map(u=>({sale_id:sale.id,unit_id:u.id,
          from_wh:u.warehouseId||null,from_holder:u.status==='Personelde'?u.holderId:null})));
        if(ir.error)throw ir.error;
        for(const u of L.units){
          await upd('stock_units',u.id,{warehouse_id:null,holder_id:null,status:'Satıldı',
            note:customer,sale_id:sale.id});
          await ins('stock_logs',{unit_id:u.id,date,text:'Satış: '+customer+' ('+e.name+')'});
        }
      }
    }
  },hazir.length+' ürün kaydedildi: '+nf.format(tPuan)+' puan, '+money(tPrim)+' prim'+
    (tUnit?', '+tUnit+' adet stoktan düştü':'')+(tAbone?', '+tAbone+' abone no':''));
}

function getTarget(empId,katId){
  const t=db.targets.find(x=>x.employeeId===empId&&x.kat===katId);
  if(!t)return {value:0,exempt:false,defined:false};
  return {value:t.value,exempt:t.exempt,defined:true};
}
function isConverted(customerId,fromDate){
  return !!customerId&&db.sales.some(s=>s.customerId===customerId&&s.date>=fromDate);
}
function realizedFor(empId,katId,period){
  const kat=hedefKat(katId);if(!kat)return 0;
  if(kat.kind==='randevu')return db.appointments.filter(a=>alanOf(a)===empId&&inPeriod(a,period)&&!iptalMi(a)).length;
  if(kat.kind==='donusum')return db.appointments.filter(a=>alanOf(a)===empId&&inPeriod(a,period)&&!iptalMi(a)&&isConverted(a.customerId,a.date)).length;
  const rows=salesIn(period).filter(s=>s.employeeId===empId&&s.hedefKat===katId);
  return kat.kind==='puan'?sum(rows.map(s=>({amount:s.puan}))):sum(rows.map(s=>({amount:s.amount||0})));
}
function hedefCell(empId,kat,period){

  const pc=pct(r,t.value),fmt=kat.kind==='tutar'?money(r)+' / '+money(t.value):nf.format(r)+' / '+nf.format(t.value);

}

function haftaBasi(){
  const d=new Date();d.setHours(0,0,0,0);
  d.setDate(d.getDate()-((d.getDay()+6)%7));
  return d;
}
function ayniBirim(x){return !!x&&x.birimId!=null&&x.birimId===birimKapsamim();}
function duzenlenebilirMusteri(c){
  if(isUst()||isMuhasebe())return true;
  if((isBirim()||isDestek())&&ayniBirim(c))return true;
  if(!c||!c.createdAt||c.createdBy!==me.userId)return false;
  return new Date(c.createdAt)>=haftaBasi();
}

function findDuplicateCustomer(unvan,telefon,vkn,exceptId){
  if(vkn){
    const hit=db.customers.find(c=>c.id!==exceptId&&c.vkn&&c.vkn===vkn);
    if(hit)return {type:'vkn',c:hit};
  }
  const nu=norm(unvan).toLocaleLowerCase('tr'),nt=telefon.replace(/\D/g,'');
  const hit2=db.customers.find(c=>c.id!==exceptId&&((nu&&norm(c.unvan).toLocaleLowerCase('tr')===nu)||(nt&&c.telefon.replace(/\D/g,'')===nt)));
  if(hit2)return {type:'soft',c:hit2};
  return null;
}

async function quickCreateCustomer(pre,dupKey){
  const g=id=>{const el=$('#'+id);return el?el.value.trim():'';};
  const unvan=g(pre+'-cu'),yetkili=g(pre+'-cy'),tel=g(pre+'-ct');
  if(!unvan)return {error:'Yeni müşterinin ünvanını girin.'};
  if(!yetkili)return {error:'Yeni müşterinin yetkili adını girin.'};
  if(!tel)return {error:'Yeni müşterinin irtibat numarasını girin.'};

  if(dup){
    if(!dlgState[dupKey]){dlgState[dupKey]=true;return {error:'“'+dup.c.unvan+'” ünvanı veya telefonuyla kayıtlı bir müşteri var. Mükerrer değilse tekrar basın.'};}
  }
  const il=$('#'+pre+'-cil')?$('#'+pre+'-cil').value:'',ilce=$('#'+pre+'-cilce')?$('#'+pre+'-cilce').value:'';
  const c=await ins('customers',{unvan,yetkili,telefon:tel,vkn:'',il,ilce,adres:''});

}
function saveCustomer(){
  const g=id=>{const el=$('#'+id);return el?el.value.trim():'';};
  const num=id=>{const el=$('#'+id);const v=parseFloat(String(el?el.value:'').replace(',','.'));return isFinite(v)&&v>=0?v:0;};
  const unvan=g('c-unvan'),yetkili=g('c-yetkili'),tel=g('c-tel'),vkn=g('c-vkn').replace(/\D/g,''),err=m=>{$('#c-err').textContent=m;};
  if(!unvan)return err('Müşteri ünvanını girin.');if(!yetkili)return err('Yetkili adı soyadını girin.');if(!tel)return err('İrtibat numarasını girin.');
  if(vkn&&vkn.length!==10&&vkn.length!==11)return err('VKN 10 haneli, TCKN 11 haneli rakamlardan oluşmalı.');
  const id=dlgState.id;
  if(!dlgState.dupConfirmed){
    if(dlgState.kontrolEdiliyor)return;
    dlgState.kontrolEdiliyor=true;
    err('Tüm birimlerin kayıtları taranıyor…');
    const aday={unvan:unvan,yetkili:yetkili,telefon:tel,vkn:vkn,adres:g('c-adres')};
    cifteBak(aday,id).then(benzer=>{
      dlgState.kontrolEdiliyor=false;
      if(dlgState.kind!=='cust')return;
      dlgState.dupConfirmed=true;
      if(!benzer.length){err('');saveCustomer();return;}
      const box=$('#c-benzer');
      if(box)box.innerHTML=benzerPanel(benzer,'Bu firma zaten kayıtlıysa yeni kayıt açmayın. Başka bir birimde kayıtlıysa o birimle görüşün. Farklı bir firma olduğundan eminseniz <b>Kaydet</b> düğmesine tekrar basın.');
      err('Benzer kayıt bulundu. Yukarıdakileri kontrol edin.');
    });
    return;
  }
  const dslVar=!!$('#c-dslvar').checked,pstnVar=!!$('#c-pstnvar').checked,metroVar=!!$('#c-metrovar').checked;
  const rec={
    unvan,yetkili,telefon:tel,vkn,il:g('c-il'),ilce:g('c-ilce'),adres:g('c-adres'),
    mobilAdet:num('c-mobiladet'),mobilTaahhutAy:$('#c-mobilay').value||'',mobilTaahhutYil:g('c-mobilyil'),
    dslVar,dslHizmetNo:dslVar?g('c-dslno'):'',dslAdet:dslVar?num('c-dsladet'):0,dslTaahhutAy:dslVar?($('#c-dslay').value||''):'',dslTaahhutYil:dslVar?g('c-dslyil'):'',
    pstnVar,pstnHizmetNo:pstnVar?g('c-pstnno'):'',pstnAdet:pstnVar?num('c-pstnadet'):0,pstnTaahhutAy:pstnVar?($('#c-pstnay').value||''):'',pstnTaahhutYil:pstnVar?g('c-pstnyil'):'',
    metroVar,metroHizmetNo:metroVar?g('c-metrono'):'',metroAdet:metroVar?num('c-metroadet'):0,metroTaahhutAy:metroVar?($('#c-metroay').value||''):'',metroTaahhutYil:metroVar?g('c-metroyil'):''
  };
  const row={unvan:rec.unvan,yetkili:rec.yetkili,telefon:rec.telefon,vkn:rec.vkn,
    il:rec.il,ilce:rec.ilce,adres:rec.adres,
    mobil_adet:rec.mobilAdet,mobil_taahhut_ay:rec.mobilTaahhutAy,mobil_taahhut_yil:rec.mobilTaahhutYil,
    dsl_var:rec.dslVar,dsl_hizmet_no:rec.dslHizmetNo,dsl_adet:rec.dslAdet,
    dsl_taahhut_ay:rec.dslTaahhutAy,dsl_taahhut_yil:rec.dslTaahhutYil,
    pstn_var:rec.pstnVar,pstn_hizmet_no:rec.pstnHizmetNo,pstn_adet:rec.pstnAdet,
    pstn_taahhut_ay:rec.pstnTaahhutAy,pstn_taahhut_yil:rec.pstnTaahhutYil,
    metro_var:rec.metroVar,metro_hizmet_no:rec.metroHizmetNo,metro_adet:rec.metroAdet,
    metro_taahhut_ay:rec.metroTaahhutAy,metro_taahhut_yil:rec.metroTaahhutYil};
  run('c-err',()=>id?upd('customers',id,row):ins('customers',row),'Müşteri kaydedildi');
}

function apptStatsRows(period){

      conv:gecerli.filter(a=>isConverted(a.customerId,a.date)).length,

/* Randevu kime atanacak?

function randevuSahibi(custId){
  const c=custId?byId(db.customers,custId):null;
  const sid=c&&c.sahaId?c.sahaId:(dlgState.sahaId||null);
  const e=sid?emp(sid):null;
  if(e&&!ayrildi(e))return {emp:e,saha:true};
  const bm=bayiMuduru();
  return bm?{emp:bm,saha:false}:null;
}
function sahibiNotu(custId){
  const h=randevuSahibi(custId);
  if(!h)return '<p class="hint">Bayi Müdürü tanımlı değil, randevu atanamaz. Personel sayfasından bir Bayi Müdürü belirleyin.</p>';
  return h.saha
    ?'<p class="hint">Bu randevu doğrudan <b>'+esc(h.emp.name)+'</b> üzerine açılacak — potansiyel müşteri kaydını o ekledi.</p>'

function saveAppointment(){
  const custSel=$('#ap-cust').value,date=$('#ap-date').value,desc=$('#ap-desc').value.trim(),err=m=>{$('#ap-err').textContent=m;};
  const alan=($('#ap-alan')||{}).value||'';
  if(!custSel)return err('Müşteri seçin.');if(!date)return err('Tarih seçin.');if(!desc)return err('Açıklama girin.');
  if(!alan)return err('Randevuyu alan personeli seçin.');
  if(custSel!==NEW_CUST&&acikRandevular(custSel).length&&!dlgState.apOpenConfirmed){
    dlgState.apOpenConfirmed=true;
    return err('Bu müşterinin açık randevusu var. Yine de oluşturmak için “Randevuyu kaydet” düğmesine tekrar basın.');
  }
  if(!randevuSahibi(custSel===NEW_CUST?null:custSel))
    return err('Bayi Müdürü tanımlı değil. Önce Personel sayfasından bir Bayi Müdürü belirleyin.');
  run('ap-err',async()=>{
    let custId=custSel;
    if(custSel===NEW_CUST){
      const res=await quickCreateCustomer('ap','apDup');
      if(res.error)throw new Error(res.error);
      custId=res.customer.id;
    }
    const h=randevuSahibi(custId);
    const a=await ins('appointments',{customer_id:custId,employee_id:h.emp.id,alan_id:alan,
      date,descr:desc,status:'Açık'});
    await ins('appointment_logs',{appt_id:a.id,date:TODAY,
      text:'Randevuyu alan: '+((emp(alan)||{}).name||'—')+' · '+
        (h.saha?'Potansiyeli ekleyen saha personeline atandı: ':'Bayi Müdürü\u2019ne atandı: ')+h.emp.name});
  },custSel===NEW_CUST?'Yeni müşteri ve randevu kaydedildi':'Randevu kaydedildi');
}

/* ---------------------------------------------------------------
   POTANSİYEL MÜŞTERİ GİRİŞ RAPORU
   Süreç: potansiyel giriş -> telesatış randevu -> saha satış
----------------------------------------------------------------*/
const girisTarihi=l=>String(l.createdAt||'').slice(0,10);
const girisDonemde=(l,p)=>p==='all'||girisTarihi(l).startsWith(p);
function kullaniciEmp(userId){
  if(!userId)return null;
  const u=(db.users||[]).find(x=>x.userId===userId);
  return u?u.employeeId:null;
}
function leadSatisaDondu(l){
  return !!l.customerId&&db.sales.some(s=>s.customerId===l.customerId);
}
function girisRaporRows(period){
  const m={};
  (db.leads||[]).filter(l=>girisDonemde(l,period)).forEach(l=>{
    const eid=kullaniciEmp(l.createdBy);
    const key=eid||('u:'+(l.createdBy||'yok'));
    const g=m[key]||(m[key]={key:key,eid:eid,userId:l.createdBy,
      elle:0,excel:0,toplam:0,aranan:0,randevu:0,musteri:0,satis:0});
    g.toplam++;
    if(l.kaynakTip==='excel')g.excel++;else g.elle++;
    if(l.sonArama)g.aranan++;
    if(l.durum==='Randevu alındı'||l.durum==='Müşteriye aktarıldı')g.randevu++;
    if(l.customerId)g.musteri++;
    if(leadSatisaDondu(l))g.satis++;
  });
  return Object.keys(m).map(k=>m[k]).map(g=>{
    const e=g.eid?emp(g.eid):null;
    const u=(db.users||[]).find(x=>x.userId===g.userId);
    g.ad=e?e.name:(u&&u.email?u.email:'Bilinmeyen kullanıcı');
    g.altAd=e?((dept(e.departmentId)||{}).name||''):'Personel kaydına bağlı değil';
    return g;
  }).sort((a,b)=>b.elle-a.elle||b.toplam-a.toplam);
}
function girisRaporToplam(rows){
  const t={elle:0,excel:0,toplam:0,aranan:0,randevu:0,musteri:0,satis:0};
  rows.forEach(r=>Object.keys(t).forEach(k=>{t[k]+=r[k];}));
  return t;
}

    '<span class="muted sm">'+(p==='all'?'Tüm dönemler':monthLabel(p))+' · kaydı giren kişiye göre</span></div>'+
    (rows.length?
      '<div class="panel-b"><div class="kpis">'+huni.map(([l,n,onceki])=>

        (onceki&&onceki!==n?'<span class="muted sm">önceki adımdan %'+pct(n,onceki)+' geçti</span>':'')+'</div>').join('')+'</div></div>'+
      '<div class="scroll"><table><thead><tr><th>Kaydı giren</th><th class="num">Elle girilen</th>'+
      '<th class="num">Excel ile</th><th class="num">Toplam</th><th class="num">Aranan</th>'+
      '<th class="num">Randevu</th><th class="num">Müşteri</th><th class="num">Satış</th>'+
      '<th class="num">Randevu oranı</th></tr></thead><tbody>'+
      rows.map(r=>'<tr><td><div>'+esc(r.ad)+'</div><div class="muted sm">'+esc(r.altAd)+'</div></td>'+
        '<td class="num"><b>'+r.elle+'</b></td><td class="num'+(r.excel?'':' muted')+'">'+(r.excel||'-')+'</td>'+
        '<td class="num">'+r.toplam+'</td><td class="num">'+r.aranan+'</td>'+
        '<td class="num">'+r.randevu+'</td><td class="num">'+r.musteri+'</td>'+
        '<td class="num"><b>'+r.satis+'</b></td>'+
        '<td class="num">%'+pct(r.randevu,r.aranan)+'</td></tr>').join('')+
      '<tr class="total"><td>Toplam</td><td class="num">'+t.elle+'</td><td class="num">'+t.excel+'</td>'+
      '<td class="num">'+t.toplam+'</td><td class="num">'+t.aranan+'</td><td class="num">'+t.randevu+'</td>'+
      '<td class="num">'+t.musteri+'</td><td class="num">'+t.satis+'</td>'+
      '<td class="num">%'+pct(t.randevu,t.aranan)+'</td></tr></tbody></table></div>'
      :'<div class="empty">Bu dönemde potansiyel müşteri kaydı girilmemiş.</div>')+
    '<div class="panel-b"><p class="hint">“Elle girilen” tek tek yazılan kayıtlardır; toplu Excel yüklemeleri ayrı sütunda durur, böylece giriş performansı karışmaz. Randevu oranı, <b>aranan</b> kayıtlar üzerinden hesaplanır — henüz aranmamış kayıt kimseyi aşağı çekmez.</p></div></section>';
}

const XL_HAZIR=()=>typeof XLSX!=='undefined';
const dIso=iso=>{const p=String(iso||'').split('-');return p.length===3?new Date(+p[0],+p[1]-1,+p[2]):'';};
const adOf=(o,k)=>(o&&o[k])||'';
function seriOf(sale){
  return (sale.items||[]).map(it=>(byId(db.stock,it.unitId)||{}).serial).filter(Boolean).join(', ');
}
function satisExportRows(){
  const head=['Tarih','Personel','Departman','Şirket','Müşteri','Ürün','Kategori','Marka',

    const e=emp(x.employeeId)||{},p=byId(db.products,x.productId)||{},
          c=x.customerId?(byId(db.customers,x.customerId)||{}):{};
    return [dIso(x.date),adOf(e,'name'),adOf(dept(x.departmentId),'name'),adOf(comp(x.companyId),'name'),
      c.unvan||x.customer||'',adOf(p,'name'),adOf(p,'category'),adOf(p,'brand'),
      x.qty||0,x.amount||0,x.puan||0,x.prim||0,
      (x.abone||[]).join(', '),seriOf(x),adOf(hedefKat(x.hedefKat),'name')||x.hedefKat||'',x.id];
  });

function randevuExportRows(){

              'Randevuyu alan','Atanan personel','Durum','Açıklama',
              'Kapanış / iptal tarihi','Kapanış / iptal açıklaması','Satışa döndü mü'];
  const rows=db.appointments.slice().sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0).map(a=>{
    const c=byId(db.customers,a.customerId)||{};
    return [dIso(a.date),c.unvan||'',c.yetkili||'',c.telefon||'',c.il||'',c.ilce||'',c.adres||'',

      a.closeDate?dIso(a.closeDate):'',a.closeDesc||'',
      (!iptalMi(a)&&isConverted(a.customerId,a.date))?'Evet':'Hayır'];
  });
  return [head].concat(rows);
}
function sheetOf(aoa,dateCols,widths){
  const ws=XLSX.utils.aoa_to_sheet(aoa,{cellDates:true});
  const ref=XLSX.utils.decode_range(ws['!ref']);
  for(let r=1;r<=ref.e.r;r++)dateCols.forEach(c=>{
    const cell=ws[XLSX.utils.encode_cell({r:r,c:c})];
    if(cell&&cell.t==='d')cell.z='dd.mm.yyyy';
  });
  ws['!cols']=widths.map(w=>({wch:w}));
  ws['!autofilter']={ref:ws['!ref']};
  ws['!freeze']={xSplit:0,ySplit:1};
  return ws;
}
function exportExcel(which){
  if(!raporcu())return;
  if(!XL_HAZIR())return needDlg('Excel dışa aktarma','Excel bileşeni yüklenemedi. İnternet bağlantınızı kontrol edip sayfayı yenileyin.');
  const wb=XLSX.utils.book_new();
  let ad='saha';
  if(which!=='randevu'){
    XLSX.utils.book_append_sheet(wb,sheetOf(satisExportRows(),[0],[12,20,18,18,30,26,16,14,8,12,10,12,22,26,20,14]),'Satışlar');
    ad='satislar';
  }
  if(which==='randevu'||which==='hepsi'){
    XLSX.utils.book_append_sheet(wb,sheetOf(randevuExportRows(),[0,11],[14,30,20,16,12,14,34,20,20,10,34,16,34,14]),'Randevular');
    ad=which==='randevu'?'randevular':'satis-randevu';
  }
  if(which==='denetim'){
    XLSX.utils.book_append_sheet(wb,sheetOf(denetimExportRows(),[0],[18,26,16,12,18,28,14,60]),'Hareket kaydı');
    ad='hareket-kaydi';
  }
  if(which==='giris'||which==='hepsi'){
    XLSX.utils.book_append_sheet(wb,sheetOf(girisExportRows(),[],[26,20,14,12,10,10,16,14,14,14]),'Potansiyel girişi');
    if(which==='giris')ad='potansiyel-girisi';
  }
  const t=new Date(),iki=n=>String(n).padStart(2,'0');
  XLSX.writeFile(wb,'saha-'+ad+'-'+t.getFullYear()+iki(t.getMonth()+1)+iki(t.getDate())+'.xlsx');
  toast('Excel dosyası indirildi');
}
function xlBtn(which,label){

----------------------------------------------------------------*/
const LEAD_DURUM=['Yeni','Ulaşılamadı','Tekrar aranacak','İlgilenmiyor','Randevu alındı','Müşteriye aktarıldı'];
const LEAD_ACIK=new Set(['Yeni','Tekrar aranacak']);
const LEAD_ROZET={'Yeni':'','Ulaşılamadı':'warn','Tekrar aranacak':'warn','İlgilenmiyor':'bad','Randevu alındı':'ok','Müşteriye aktarıldı':'ok'};
const lead=id=>byId(db.leads,id);
const trl=x=>String(x==null?'':x).toLocaleLowerCase('tr');
const telKey=t=>{const d=String(t||'').replace(/\D/g,'');return d.length>10?d.slice(-10):d;};
const UNVAN_EK=/(^|\s)(a\.?ş\.?|ltd\.?|şti\.?|sti\.?|san\.?|tic\.?|ith\.?|ihr\.?|paz\.?|hizm\.?|inş\.?|ins\.?|koll\.?|kom\.?|anonim|limited|şirketi|sirketi|sanayi|ticaret|ve)(?=\s|$)/g;
const unvanKey=u=>trl(u).replace(/[.,'"\/\\_-]/g,' ').replace(/\s+/g,' ').replace(UNVAN_EK,' ').replace(/\s+/g,' ').trim();
const adKey=a=>trl(a).replace(/[^a-zçğıöşü0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const adresKey=a=>trl(a).replace(/[^a-zçğıöşü0-9]/g,'');

/* Ortak alanlara bakarak iki kaydın ne kadar örtüştüğünü bulur. */
function eslesmeNedenleri(x,r){
  const n=[];
  const v=String(x.vkn||'').replace(/\D/g,''),rv=String(r.vkn||'').replace(/\D/g,'');
  if(v&&rv&&v===rv)n.push({t:'VKN aynı',w:3});
  const t=telKey(x.telefon),rt=telKey(r.telefon);
  if(t&&rt&&t.length>=7&&t===rt)n.push({t:'Telefon aynı',w:3});
  const u=unvanKey(x.unvan),ru=unvanKey(r.unvan);
  if(u&&ru&&u===ru)n.push({t:'Ünvan aynı',w:3});
  else if(u&&ru&&u.length>=5&&ru.length>=5&&(u.indexOf(ru)>=0||ru.indexOf(u)>=0))n.push({t:'Ünvan çok benzer',w:2});
  const y=adKey(x.yetkili),ry=adKey(r.yetkili);
  if(y&&ry&&y.length>=5&&y===ry)n.push({t:'Yetkili adı aynı',w:2});
  const a=adresKey(x.adres),ra=adresKey(r.adres);
  if(a&&ra&&a.length>=12&&a===ra)n.push({t:'Adres aynı',w:2});
  return n;
}
/* Güçlü bir neden (3) veya iki orta neden (2+2) eşik sayılır. */
function benzerKayitlar(x,exceptLeadId){
  const out=[];
  const bak=(kind,r)=>{
    const n=eslesmeNedenleri(x,r),w=n.reduce((s,q)=>s+q.w,0);
    if(w>=3)out.push({kind:kind,rec:r,nedenler:n.map(q=>q.t),w:w});
  };
  db.customers.forEach(c=>bak('musteri',c));
  db.leads.forEach(l=>{if(l.id!==exceptLeadId&&l.durum!=='Müşteriye aktarıldı')bak('potansiyel',l);});
  return out.sort((a,b)=>b.w-a.w).slice(0,6);
}
/* -----------------------------------------------------------------
   ÇİFT KAYIT KONTROLÜ — TÜM VERİ ÜZERİNDEN
   Havuzlar birim bazında ayrıdır, kullanıcı başka birimin kaydını
   göremez. Bu yüzden kontrol sunucuda çalışır: yalnızca "hangi
   birimde, hangi durumda" bilgisi döner, kaydın detayı dönmez.
------------------------------------------------------------------*/
async function sunucudaAra(x,exceptId){
  try{
    const r=await sb.rpc('cift_kayit_bul',{
      p_unvan:x.unvan||'',p_telefon:x.telefon||'',p_vkn:x.vkn||'',
      p_yetkili:x.yetkili||'',p_adres:x.adres||''});
    if(r.error)return [];
    return (r.data||[]).filter(d=>d.kayit_id!==exceptId).map(d=>{
      const rec={id:d.kayit_id,unvan:d.unvan,yetkili:d.yetkili,telefon:d.telefon,
                 vkn:d.vkn,il:d.il,ilce:d.ilce};
      const n=eslesmeNedenleri(x,rec);
      return {kind:d.kaynak==='musteri'?'musteri':'potansiyel',rec:rec,
              nedenler:n.length?n.map(q=>q.t):['Benzer kayıt'],
              w:n.reduce((a,q)=>a+q.w,0)||3,
              birim:d.birim||'',disBirim:!d.benim_birimim,durum:d.durum||''};
    });
  }catch(e){return [];}
}
/* Yerel (kendi havuzum) + sunucu (tüm veri) sonuçlarını birleştirir */
async function cifteBak(x,exceptId){
  const yerel=benzerKayitlar(x,exceptId);
  const uzak=await sunucudaAra(x,exceptId);
  const anahtar=m=>(m.rec.id||'')+'|'+trl(m.rec.unvan)+'|'+telKey(m.rec.telefon);
  const gorulen={},out=[];
  yerel.concat(uzak).forEach(m=>{
    const k=anahtar(m);
    if(gorulen[k]){if(m.birim&&!gorulen[k].birim)gorulen[k].birim=m.birim;return;}
    gorulen[k]=m;out.push(m);
  });
  return out.sort((a,b)=>b.w-a.w).slice(0,8);
}
function benzerSatir(m){
  const r=m.rec;
  return '<div style="margin-top:8px">'+
    (m.kind==='musteri'?'<span class="badge bad">Mevcut müşteri</span> ':'<span class="badge warn">Potansiyel listede</span> ')+
    '<b>'+esc(r.unvan)+'</b>'+(r.yetkili?' — '+esc(r.yetkili):'')+
    '<div class="muted sm">'+[r.telefon?'Tel: '+esc(r.telefon):'',r.vkn?'VKN: '+esc(r.vkn):'',
      [r.il,r.ilce].filter(Boolean).map(esc).join(' / ')].filter(Boolean).join(' · ')+'</div>'+
    '<div class="sm"><b>Eşleşme:</b> '+esc(m.nedenler.join(', '))+
      (m.birim?' · <b>Birim:</b> '+esc(m.birim)+(m.disBirim?' <span class="badge bad">Başka birim</span>':''):'')+
      (m.durum&&m.kind==='potansiyel'?' · '+esc(m.durum):'')+'</div></div>';
}

}

function leadSonuc(id,kind){
  const l=lead(id);if(!l)return;
  const notu=($('#l-not')||{}).value;
  const ortak={son_arama:TODAY,deneme:(l.deneme||0)+1,note:notu===undefined?l.note:notu};
  let row=null,msg='';
  if(kind==='tekrar'){row=Object.assign({durum:'Tekrar aranacak'},ortak);msg='Tekrar aranacak olarak işaretlendi';}
  else if(kind==='ulasilamadi'){row=Object.assign({durum:'Ulaşılamadı',atanan_id:null},ortak);msg='Havuza geri gönderildi';}
  else if(kind==='ilgilenmiyor'){row=Object.assign({durum:'İlgilenmiyor'},ortak);msg='İlgilenmiyor olarak kapatıldı';}

function saveLead(){
  if(dlgState.kind!=='lead')return;   /* diyalog kapandıysa tekrar kaydetme */
  const g=id=>{const el=$('#'+id);return el?el.value.trim():'';};
  const err=m=>{$('#l-err').textContent=m;};
  const x={unvan:g('l-unvan'),yetkili:g('l-yetkili'),telefon:g('l-tel'),
    vkn:g('l-vkn').replace(/\D/g,''),il:g('l-il'),ilce:g('l-ilce'),adres:g('l-adres'),
    kaynak:g('l-kaynak'),durum:g('l-durum')||'Yeni',note:g('l-not'),son:g('l-son')};
  if(!x.unvan)return err('Firma ünvanını girin.');
  if(!x.telefon)return err('Telefon numarasını girin.');
  if(x.vkn&&x.vkn.length!==10&&x.vkn.length!==11)return err('VKN 10 haneli, TCKN 11 haneli rakamlardan oluşmalı.');
  if(!dlgState.leadConfirmed){
    if(dlgState.kontrolEdiliyor)return;
    dlgState.kontrolEdiliyor=true;
    err('Tüm birimlerin kayıtları taranıyor…');
    cifteBak(x,dlgState.id).then(benzer=>{
      dlgState.kontrolEdiliyor=false;
      if(dlgState.kind!=='lead')return;
      if(!benzer.length){dlgState.leadConfirmed=true;err('');saveLead();return;}
      dlgState.leadConfirmed=true;
      const box=$('#l-benzer');
      if(box)box.innerHTML=benzerPanel(benzer,'Bu firma zaten kayıtlıysa yeni kayıt açmayın. Başka bir birimdeyse o birimle görüşün. Farklı bir firma olduğundan eminseniz <b>Kaydet</b> düğmesine tekrar basın.');
      err('Benzer kayıt bulundu. Yukarıdakileri kontrol edin.');
    });
    return;
  }
  const at=$('#l-atanan');
  const row={unvan:x.unvan,yetkili:x.yetkili,telefon:x.telefon,vkn:x.vkn,il:x.il,ilce:x.ilce,
    adres:x.adres,kaynak:x.kaynak,kaynak_tip:'elle',durum:x.durum,note:x.note,son_arama:nz(x.son),
    atanan_id:(!dlgState.id&&!isMudur()&&!telesatisMi())
      ? null                                  /* saha ve satış destek: havuza */
      : nz(at?at.value:(me.employeeId||''))}; /* telesatış ve yönetim: seçilen kişi */
  const id=dlgState.id;
  run('l-err',()=>id?upd('leads',id,row):ins('leads',row),'Potansiyel müşteri kaydedildi');
}

function leadSiradaki(){
  const benim=potFiltre('bende').concat(potFiltre('tekrar'));
  if(!benim.length)return needDlg('Sıradaki',(isUst()||isBirim()||isDestek()||telesatisMi())
    ?'Listenizde aranacak kayıt yok. “Potansiyel müşteri al” düğmesiyle havuzdan 10 kayıt çekin.'
    :'Listenizde aranacak kayıt yok. Yöneticinizden atama isteyin.');

  openLead(benim[0].id);
}
const POT_KAPALI=new Set(['İlgilenmiyor','Randevu alındı','Müşteriye aktarıldı']);
function potSekmeler(){
  const bende=potFiltre('bende').length,tekrar=potFiltre('tekrar').length,
        kapali=potFiltre('kapali').length;
  const ekledigim=potFiltre('ekledigim').length;
  const t=[['bende','Bende',bende],['tekrar','Tekrar aranacak',tekrar],['kapali','Sonuçlanan',kapali]];
  if(ekledigim)t.splice((isSaha()||!telesatisMi())?0:3,0,['ekledigim','Eklediklerim',ekledigim]);
  if(isMudur())t.push(['havuz','Havuz',db.leads.filter(l=>!l.atananId).length],['hepsi','Tümü',db.leads.length]);
  return '<div class="seg" role="group" aria-label="Liste">'+
    t.map(([k,l,n])=>'<button data-act="pot-sekme" data-v="'+k+'" aria-pressed="'+(state.pot.sekme===k)+'">'+l+' ('+n+')</button>').join('')+'</div>';
}
function potFiltre(sekme){
  const benim=me.employeeId||'__yok__';
  const l=db.leads;
  if(sekme==='ekledigim')return l.filter(x=>x.createdBy===me.userId||(x.sahaId&&x.sahaId===benim));
  if(sekme==='bende')  return l.filter(x=>x.atananId===benim&&(x.durum==='Yeni'||x.durum==='Ulaşılamadı'));
  if(sekme==='tekrar') return l.filter(x=>x.atananId===benim&&x.durum==='Tekrar aranacak');
  if(sekme==='kapali') return l.filter(x=>POT_KAPALI.has(x.durum)&&(isMudur()||x.atananId===benim));
  if(sekme==='havuz')  return l.filter(x=>!x.atananId);
  return l.slice();
}
function potTable(){
  const f=state.pot,q=trl(f.q).trim();
  let list=potFiltre(f.sekme);
  if(f.sekme==='hepsi'&&f.durum)list=list.filter(l=>l.durum===f.durum);

  return nav+'<div class="scroll"><table><thead><tr><th>Firma</th><th>Yetkili</th><th>Telefon</th><th>İl / İlçe</th><th>Atanan</th><th>Durum</th><th>Son arama</th><th></th></tr></thead><tbody>'+
  gosterilen.map(l=>'<tr><td class="click" tabindex="0" data-act="lead" data-id="'+l.id+'"><b>'+esc(l.unvan)+'</b>'+
    (l.kaynak?'<div class="muted sm">'+esc(l.kaynak)+'</div>':'')+'</td>'+
    '<td>'+esc(l.yetkili||'—')+'</td>'+

    '<td class="nowrap muted sm">'+(l.sonArama?fmtDate(l.sonArama):'—')+'</td>'+
    '<td class="nowrap">'+telBtn(l.telefon)+' <button class="btn sm" data-act="lead" data-id="'+l.id+'">Aç</button></td></tr>').join('')+

const LI_BASLIK=[['unvan','Ünvan'],['yetkili','Yetkili'],['telefon','Telefon'],['vkn','VKN'],['il','İl'],['ilce','İlçe'],['adres','Adres']];
const LI_ALIAS={
  unvan:['unvan','ünvan','firma','firmaadi','firmaadı','firmaunvani','firmaünvanı','musteri','müşteri','musteriadi','müşteriadı','sirket','şirket','sirketadi','ticariunvan'],
  yetkili:['yetkili','yetkiliadi','yetkiliadı','yetkiliadisoyadi','adsoyad','adisoyadi','adısoyadı','ilgili','ilgilikisi','isim'],
  telefon:['telefon','tel','gsm','cep','ceptelefonu','telefonno','telefonnumarasi','telefonnumarası','irtibat','irtibatno'],
  vkn:['vkn','vergino','verginumarasi','verginumarası','tckn','vkntckn','vknveyatckn'],
  il:['il','sehir','şehir'],
  ilce:['ilce','ilçe'],
  adres:['adres','acikadres','açıkadres','adresbilgisi']
};
const liNorm=s=>trl(s).replace(/[^a-zçğıöşü0-9]/g,'');
function liKolonlar(head){
  const map={};
  head.forEach((h,i)=>{
    const n=liNorm(h);if(!n)return;
    Object.keys(LI_ALIAS).forEach(k=>{if(map[k]===undefined&&LI_ALIAS[k].indexOf(n)>=0)map[k]=i;});
  });
  return map;
}
function liOku(aoa){
  const bos={eksik:[],satirlar:[]};
  if(!aoa||!aoa.length)return bos;
  const map=liKolonlar(aoa[0]);
  if(map.unvan===undefined)return {hata:'Dosyada “Ünvan” sütunu bulunamadı. Şablonu indirip başlıkları ona göre düzeltin.'};
  const al=(row,k)=>map[k]===undefined?'':norm(String(row[map[k]]==null?'':row[map[k]]));
  const rows=[];
  for(let i=1;i<aoa.length;i++){
    const r=aoa[i];if(!r||!r.length)continue;
    const x={unvan:al(r,'unvan'),yetkili:al(r,'yetkili'),telefon:al(r,'telefon'),
      vkn:al(r,'vkn').replace(/\D/g,''),il:al(r,'il'),ilce:al(r,'ilce'),adres:al(r,'adres')};
    if(!x.unvan&&!x.telefon)continue;
    x.satir=i+1;
    x.sorun=!x.unvan?'Ünvan boş':(!x.telefon?'Telefon boş':'');
    x.benzer=x.sorun?[]:benzerKayitlar(x,null);
    rows.push(x);
  }
  return {satirlar:rows};
}
function liOnizleme(rows){
  const hatali=rows.filter(r=>r.sorun),benzer=rows.filter(r=>!r.sorun&&r.benzer.length),
        temiz=rows.filter(r=>!r.sorun&&!r.benzer.length);
  const ornek=benzer.slice(0,8);
  return '<div class="ro-banner"><b>'+rows.length+' satır okundu.</b><br>'+
    temiz.length+' kayıt sorunsuz'+
    (benzer.length?' · <b>'+benzer.length+' kayıt mevcutlarla benzeşiyor</b>':'')+
    (hatali.length?' · '+hatali.length+' satır eksik bilgi yüzünden atlanacak':'')+'</div>'+
    (benzer.length?'<div class="scroll" style="max-height:220px;margin-top:10px"><table><thead><tr><th>Satır</th><th>Ünvan</th><th>Telefon</th><th>Neden benzer</th></tr></thead><tbody>'+
      ornek.map(r=>'<tr><td>'+r.satir+'</td><td>'+esc(r.unvan)+'</td><td class="nowrap">'+esc(r.telefon)+'</td><td class="sm">'+esc(r.benzer[0].nedenler.join(', '))+' → '+esc(r.benzer[0].rec.unvan)+(r.benzer[0].kind==='musteri'?' (mevcut müşteri)':' (potansiyel)')+(r.benzer[0].birim?' · '+esc(r.benzer[0].birim):'')+'</td></tr>').join('')+
      '</tbody></table></div>'+(benzer.length>ornek.length?'<p class="hint">İlk '+ornek.length+' tanesi gösteriliyor.</p>':''):'')+
    (benzer.length?'<label style="display:flex;gap:8px;align-items:center;margin-top:10px;font-weight:500"><input id="li-dahil" type="checkbox" style="width:auto"> Benzeşen '+benzer.length+' kaydı da yükle</label>':'');
}

function liDosyaOku(file){
  const err=m=>{const e=$('#li-err');if(e)e.textContent=m;};
  if(!XL_HAZIR())return err('Excel bileşeni yüklenemedi. Sayfayı yenileyin.');
  const fr=new FileReader();
  fr.onerror=()=>err('Dosya okunamadı.');
  fr.onload=ev=>{
    try{
      const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
      const sh=wb.Sheets[wb.SheetNames[0]];
      const aoa=XLSX.utils.sheet_to_json(sh,{header:1,raw:false,defval:''});
      const res=liOku(aoa);
      if(res.hata){dlgState.rows=null;$('#li-prev').innerHTML='';return err(res.hata);}
      err('');
      dlgState.rows=res.satirlar;
      $('#li-prev').innerHTML=res.satirlar.length?'<div class="ro-banner">'+res.satirlar.length+' satır okundu. Tüm birimlerin kayıtlarına karşı taranıyor…</div>':'<div class="empty">Dosyada yüklenecek satır bulunamadı.</div>';
      if(res.satirlar.length)liSunucuKontrol(res.satirlar);
    }catch(e){err('Dosya okunamadı: '+(e.message||e));}
  };
  fr.readAsArrayBuffer(file);
}
/* Yüklenecek satırları tek istekte tüm veriye karşı tarar */
async function liSunucuKontrol(rows){
  const err=m=>{const e=$('#li-err');if(e)e.textContent=m;};
  try{
    const payload=rows.map(r=>({unvan:r.unvan,telefon:r.telefon,vkn:r.vkn}));
    const r=await sb.rpc('cift_kayit_toplu',{p_rows:payload});
    if(r.error)throw r.error;
    (r.data||[]).forEach(h=>{
      const satir=rows[h.sira];
      if(!satir)return;
      satir.benzer=[{kind:h.kaynak==='musteri'?'musteri':'potansiyel',
        rec:{unvan:h.unvan},nedenler:[h.neden],birim:h.birim,w:3}];
    });
  }catch(e){
    err('Birimler arası tarama yapılamadı, yalnızca kendi havuzunuz kontrol edildi: '+(e.message||e));
  }
  if(dlgState.kind==='leadimp'){
    const box=$('#li-prev');
    if(box)box.innerHTML=liOnizleme(rows);
  }
}

function denetimDegisiklik(d){
  const g=d.degisen||{};
  if(d.islem==='UPDATE'){
    const ks=Object.keys(g).filter(k=>!GIZLI_ALAN.has(k));
    if(!ks.length)return '<span class="muted">—</span>';
    return ks.slice(0,6).map(k=>{
      const v=g[k]||{};
      const es=v.eski===null||v.eski===undefined||v.eski===''?'(boş)':String(v.eski);
      const ye=v.yeni===null||v.yeni===undefined||v.yeni===''?'(boş)':String(v.yeni);
      return '<div class="sm"><b>'+esc(alanAdi(k))+':</b> <span class="muted">'+esc(es.slice(0,40))+'</span> → '+esc(ye.slice(0,40))+'</div>';
    }).join('')+(ks.length>6?'<div class="muted sm">+'+(ks.length-6)+' alan daha</div>':'');
  }
  const ks=Object.keys(g).filter(k=>!GIZLI_ALAN.has(k)&&g[k]!==null&&g[k]!=='');
  if(!ks.length)return '<span class="muted">—</span>';
  return '<div class="sm muted">'+esc(ks.slice(0,8).map(k=>alanAdi(k)+': '+String(g[k]).slice(0,30)).join(' · '))+'</div>';
}

function saveEmp(){
  const name=$('#p-name').value.trim(),deptId=$('#p-dept').value;
  const salary=parseFloat(String($('#p-salary').value).replace(',','.'));
  const bayi=!!$('#p-bayi').checked,id=dlgState.id,err=m=>{$('#p-err').textContent=m;};
  if(!name)return err('Ad soyad girin.');
  if(!deptId)return err('Departman seçin.');
  if(!(salary>=0))return err('Net maaşı girin.');
  const row={name,company_id:$('#p-company').value,department_id:deptId,
             birim_id:nz($('#p-birim').value),
             title:$('#p-title').value.trim(),bayi_muduru:bayi};
  run('p-err',async()=>{
    // Bayi Müdürü tek kişi: önce diğerlerinden yetkiyi al
    if(bayi){
      const r=await sb.from('employees').update({bayi_muduru:false}).eq('bayi_muduru',true);
      if(r.error)throw r.error;
    }
    let empId=id;
    if(id)await upd('employees',id,row);
    else empId=(await ins('employees',row)).id;
    const sr=await sb.from('employee_salaries')
      .upsert({employee_id:empId,salary,updated_by:me.userId,updated_at:new Date().toISOString()},
              {onConflict:'employee_id'});
    if(sr.error)throw sr.error;
  },'Personel kaydedildi');
}

function relink(changed){
  const c=$('#f-company'),d=$('#f-dept'),e=$('#f-emp');if(!d||!e)return;
  if(changed==='f-emp'&&e.value){const em=emp(e.value);if(c)c.value=em.companyId;d.innerHTML=deptOptions(em.companyId,em.departmentId,'Departman seçilmedi');e.innerHTML=empOptions(em.companyId,em.departmentId,em.id,'Personel seçilmedi');return;}
  const cv=c?c.value:'';
  if(changed==='f-company'||changed==='f-acc'){d.innerHTML=deptOptions(cv,'','Departman seçilmedi');e.innerHTML=empOptions(cv,'','','Personel seçilmedi');return;}
  if(changed==='f-dept'){const dv=d.value;if(dv&&c&&!c.value)c.value=dept(dv).companyId;e.innerHTML=empOptions(c?c.value:'',dv,'','Personel seçilmedi');}
}
function dialogChange(el){
  const id=el.id,k=dlgState.kind;
  if(k==='lead'){
    if(id==='l-il'){const w=$('#l-ilce');if(w)w.innerHTML=ilceOptions(el.value,'');return;}
    return;
  }
  if(k==='leadimp'){
    if(id==='li-file'){const fl=el.files&&el.files[0];if(fl)liDosyaOku(fl);return;}
    return;
  }
  if(k==='stockout'){if(id==='so-reason')$('#so-extra').innerHTML=soExtra(el.value);return;}
  if(k==='sale'){
    if(/^slc-/.test(id)){
      slRead();
      const L=(dlgState.lines||[]).find(x=>('slc-'+x.id)===id);
      if(L){L.prod='';L.serials='';L.amount='';}
      renderLines();return;
    }
    if(/^slp-/.test(id)){renderLines();return;}
    if(id==='sl-cil'){const w=$('#sl-cilce');if(w)w.innerHTML=ilceOptions(el.value,'');return;}
    if(id==='sl-cust'){
      const nw=$('#sl-newcust');
      if(el.value===NEW_CUST){
        if(nw)nw.style.display='block';
        $('#sl-customer').value='';
        const w0=$('#sl-vknwarn');if(w0)w0.innerHTML='';
        return;
      }
      if(nw)nw.style.display='none';
      const c=byId(db.customers,el.value);
      if(c)$('#sl-customer').value=c.unvan;
      const w=$('#sl-vknwarn');
      if(w)w.innerHTML=(c&&!c.vkn)?'<div class="hint" style="color:var(--warn)">“'+esc(c.unvan)+'” için VKN bilgisi eksik. Faturalama için tamamlamanız önerilir. <button class="btn sm" data-act="cust" data-id="'+c.id+'" type="button">VKN ekle</button></div>':'';
      return;
    }
    return;
  }
  if(k==='appt'){
    if(id==='ap-cil'){const w=$('#ap-cilce');if(w)w.innerHTML=ilceOptions(el.value,'');return;}
    if(id==='ap-cust'){
      const sn=$('#ap-sahip');
      if(sn)sn.innerHTML=sahibiNotu(el.value===NEW_CUST?null:el.value);
      const w=$('#ap-newcust');if(w)w.style.display=(el.value===NEW_CUST)?'block':'none';
      const u=$('#ap-openwarn');if(u)u.innerHTML=acikRandevuUyari(el.value);
      dlgState.apOpenConfirmed=false;
      const er=$('#ap-err');if(er)er.textContent='';
      return;
    }
    return;
  }
  if(k==='prod'){if(id==='pr-calc')$('#pr-calcwrap').innerHTML=prodCalcFields({calcType:el.value,prim:0,puan:0,primPct:0,puanPct:0});return;}
  if(k==='target'){if(id==='tg-exempt'){const v=$('#tg-val');if(v)v.disabled=el.checked;}return;}
  if(k==='cust'){
    if(id==='c-il'){const w=$('#c-ilce');if(w)w.innerHTML=ilceOptions(el.value,'');return;}
    if(id==='c-dslvar'){const w=$('#c-dslwrap');if(w)w.hidden=!el.checked;return;}
    if(id==='c-pstnvar'){const w=$('#c-pstnwrap');if(w)w.hidden=!el.checked;return;}
    if(id==='c-metrovar'){const w=$('#c-metrowrap');if(w)w.hidden=!el.checked;return;}
    return;
  }
  if(k==='tx'){
    if(id==='f-dir'){$('#f-cat').innerHTML=opt((el.value==='in'?CAT_IN:CAT_OUT_MANUAL).map(c=>[c,c]),'','Kategori seçin');}
    else if(id==='f-acc'){$('#f-company').value=acct(el.value).companyId;relink('f-acc');}
    else relink(id);
  }
}
function setPath(path,val){const parts=path.split('.');let o=state;for(let i=0;i<parts.length-1;i++)o=o[parts[i]];o[parts[parts.length-1]]=val;}
function afterSet(path){
  const r=state.rep;
  if(path==='pot.durum'||path==='pot.emp')state.pot.page=0;
  if(path.indexOf('den.')===0){state.den.yuklendi=false;denetimYukle();}
  if(path==='rep.company'){
    if(r.dept&&r.dept!=='__none'&&r.company&&dept(r.dept).companyId!==r.company)r.dept='';
    if(r.emp&&r.emp!=='__none'&&r.company&&emp(r.emp).companyId!==r.company)r.emp='';
  }
  if(path==='rep.dept'&&r.emp&&r.emp!=='__none'&&r.dept&&r.dept!=='__none'&&emp(r.emp).departmentId!==r.dept)r.emp='';
}
function applyFilter(dim,key){
  const r=state.rep;
  if(dim==='departman'){r.dept=key;if(key!=='__none'&&dept(key))r.company=dept(key).companyId;}
  else if(dim==='personel'){r.emp=key;if(key!=='__none'&&emp(key)){r.company=emp(key).companyId;}}
  else if(dim==='kategori')r.cat=key;
  else if(dim==='sirket')r.company=key;
  afterSet('rep.company');
}

function dbErr(e){
  const m=(e&&e.message)||String(e);
  if(/row-level security|violates row-level/i.test(m))return 'Bu işlem için yetkiniz yok.';
  if(/duplicate key|unique constraint/i.test(m))return 'Aynı kayıt zaten var.';
  if(/foreign key/i.test(m))return 'Bu kayda bağlı başka kayıtlar var, önce onları düzenleyin.';
  if(/Load failed|Failed to fetch|NetworkError/i.test(m))return 'Sunucuya ulaşılamadı. İnternet bağlantınızı kontrol edip tekrar deneyin.';
  return m;
}

async function del(t,id){const r=await sb.from(t).delete().eq('id',id);if(r.error)throw r.error;}

let busy=false;
/* İşi çalıştırır, veriyi tazeler, diyaloğu kapatır. Hata olursa diyalogda gösterir. */
async function run(errId,work,okMsg,after){
  if(busy)return;busy=true;
  const setErr=m=>{const el=errId&&$('#'+errId);if(el)el.textContent=m;else if(m)toast(m);};
  try{
    setErr('');
    await work();
    await loadAll();
    closeDlg();
    if(okMsg)toast(okMsg);
    render();
    if(after)after();
  }catch(e){
    setErr(dbErr(e));
  }finally{busy=false;}
}

   master · muhasebe · bayi_muduru · birim_muduru · destek · saha
----------------------------------------------------------------*/
const ROL_ADI={master:'Master',muhasebe:'Muhasebe',bayi_muduru:'Bayi müdürü',
  birim_muduru:'Birim müdürü',destek:'Satış destek / Telesatış',saha:'Saha satış'};
const ROL_SIRA={master:0,muhasebe:1,bayi_muduru:2,birim_muduru:3,destek:4,saha:5};
const ROL_RENK={master:'ok',muhasebe:'warn',bayi_muduru:'warn',birim_muduru:'',destek:'',saha:''};
/* Eski rol adları yeni modele karşılık gelir (geçiş güvenliği) */
const ROL_ESKI={sahip:'master',yonetici:'bayi_muduru',personel:'saha'};
const rolAdi=r=>ROL_ESKI[r]||r||'saha';
const rolum=()=>me?rolAdi(me.role):'';

const isMaster  =()=>rolum()==='master';
const isMuhasebe=()=>rolum()==='muhasebe';
const isBayi    =()=>rolum()==='bayi_muduru';
const isBirim   =()=>rolum()==='birim_muduru';
const isDestek  =()=>rolum()==='destek';
const isSaha    =()=>rolum()==='saha';
/* Tüm operasyonu gören kademe */
const isUst   =()=>isMaster()||isBayi();
/* Parasal ve özlük yetkisi */
const isFinans=()=>isMaster()||isMuhasebe();
/* Ekip yöneten kademe */
const isMudur =()=>isUst()||isBirim();
/* Rapor görebilenler */
const raporcu =()=>isUst()||isMuhasebe()||isBirim();

/* Yönettiğim birim; birim müdürüysem yönettiğim, değilsem bağlı olduğum */
function birimKapsamim(){
  if(!me||!me.employeeId)return null;
  const y=(db.birimler||[]).find(b=>b.mudurId===me.employeeId);
  if(y)return y.id;
  const e=emp(me.employeeId);
  return e?(e.birimId||null):null;
}
/* Bu personel benim kapsamımda mı? (kendim dahil) */
function ekipte(eid){
  if(!eid||!me)return false;
  if(eid===me.employeeId)return true;
  const k=birimKapsamim();if(!k)return false;
  const e=emp(eid);
  return !!e&&e.birimId===k;
}
/* Satış kaydı hangi personeller adına girilebilir */
function satisYazabilecekler(){
  const hepsi=aktifPersonel().sort((a,b)=>a.name.localeCompare(b.name,'tr'));
  if(isUst()||isMuhasebe())return hepsi;
  if(isBirim()||isDestek())return hepsi.filter(e=>ekipte(e.id));
  return hepsi.filter(e=>e.id===me.employeeId);
}

async function doSignup(){
  const email=(($('#sg-email')||{}).value||'').trim();
  const p1=($('#sg-pass')||{}).value||'',p2=($('#sg-pass2')||{}).value||'';
  if(!email)return renderSignup('E-posta adresinizi girin.');
  if(p1.length<8)return renderSignup('Şifre en az 8 karakter olmalı.');
  if(p1!==p2)return renderSignup('Şifreler birbiriyle aynı değil.');
  renderSignup('',true);
  const {data,error}=await sb.auth.signUp({email,password:p1});
  if(error){
    const m=/already registered|already exists/i.test(error.message)?'Bu e-posta ile kayıtlı bir hesap zaten var. Giriş yapmayı deneyin.':
            /password/i.test(error.message)?'Şifre kurallara uymuyor. Daha uzun bir şifre deneyin.':error.message;
    return renderSignup(m);
  }
  if(data&&data.session){await afterLogin();return;}
  renderSignup('',false,'Hesabınız oluşturuldu. E-postanıza gönderilen doğrulama bağlantısına tıkladıktan sonra giriş yapabilirsiniz.');
}

async function doLogin(){
  const email=($('#lg-email')||{}).value||'',pass=($('#lg-pass')||{}).value||'';
  if(!email.trim())return renderLogin('E-posta adresinizi girin.');
  if(!pass)return renderLogin('Şifrenizi girin.');
  renderLogin('',true);
  const {error}=await sb.auth.signInWithPassword({email:email.trim(),password:pass});
  if(error){
    const m=/Invalid login/i.test(error.message)?'E-posta veya şifre hatalı.':
            /Email not confirmed/i.test(error.message)?'E-posta adresiniz henüz doğrulanmamış.':error.message;
    return renderLogin(m);
  }
  await afterLogin();
}

async function doLogout(){
  await sb.auth.signOut();
  me=null;emptyDb();renderLogin();
}

async function afterLogin(){
  try{
    const {data:{user}}=await sb.auth.getUser();
    if(!user)return renderLogin('Oturum açılamadı, tekrar deneyin.');
    const pr=await sb.from('profiles').select('role,employee_id').eq('user_id',user.id).maybeSingle();
    if(pr.error)return renderLogin('Profil okunamadı: '+pr.error.message);
    me={userId:user.id,email:user.email,role:pr.data?pr.data.role:'saha',employeeId:pr.data?pr.data.employee_id:null};
    await loadAll();
    state=defaultState();
    render();
  }catch(e){
    renderLogin('Veriler yüklenemedi: '+(e&&e.message?e.message:e));
  }
}

  try{await loadAll();render();toast('Veriler yenilendi');}
  catch(e){toast('Yenilenemedi: '+(e&&e.message?e.message:e));}
}

        await upd('stock_units',u.id,{...geri,note:'',sale_id:null});
        await ins('stock_logs',{unit_id:u.id,date:TODAY,text:'Satış iptal edildi, stoğa geri alındı'});
      }
      await del('sales',s.id);
    },'Satış iptal edildi');
  },
  satgroup(el){state.sat.group=el.dataset.v;render();},
  'open-target'(el){openTarget(el.dataset.emp,el.dataset.kat);},
  'save-target'(){saveTarget();},
  cust(el){openCustomer(el.dataset.id);},
  'cust-info'(el){openCustomerInfo(el.dataset.id);},
  'open-cust'(el){openCustomer(el.dataset.id||null);},
  'save-cust'(){saveCustomer();},
  'open-appt'(){openAppointment(null);},
  'open-appt-for'(el){openAppointment(el.dataset.id);},
  'save-appt'(){saveAppointment();},
  'close-appt'(el){openCloseAppt(el.dataset.id);},
  'cancel-appt'(el){openCancelAppt(el.dataset.id);},
  'save-cancelappt'(el){saveCancelAppt(el.dataset.id);},
  'save-closeappt'(el){saveCloseAppt(el.dataset.id);},
  'appt-detail'(el){openApptDetail(el.dataset.id);},
  'transfer-appt'(el){openTransferAppt(el.dataset.id);},
  'save-transferappt'(el){saveTransferAppt(el.dataset.id);},
  'open-emp'(el){openEmp(el.dataset.id||null);},
  'save-emp'(){saveEmp();},
  'emp-cikis'(el){openCikis(el.dataset.id);},
  'save-cikis'(el){saveCikis(el.dataset.id);},
  'emp-geri'(el){geriAl(el.dataset.id);},
  'per-ayrilan'(){state.perAyrilan=!state.perAyrilan;render();},
  'open-acct'(el){openAccount(el.dataset.id||null);},
  'save-acct'(){saveAccount();},
  'del-acct'(el){confirmDlg('Hesabı sil','Bu hesap listeden silinecek. Hesaba bağlı hareket varsa silinemez.','confirm-del-acct',el.dataset.id,'Hesabı sil');},
  'confirm-del-acct'(el){
    const id=el.dataset.id;
    if(db.transactions.some(t=>t.accountId===id)){closeDlg();toast('Bu hesaba bağlı hareket var, silinemez');return;}
    if(state.kasa.account===id)state.kasa.account='all';
    run(null,()=>del('accounts',id),'Hesap silindi');
  },
  'open-user'(el){openUser(el.dataset.id);},
  'save-user'(){saveUser();},
  'del-user'(el){confirmDlg('Erişimi kaldır','Bu hesabın uygulamaya erişimi tamamen kesilecek. Girdiği satış, müşteri ve randevu kayıtları silinmez, yerinde kalır. Kişi isterse yeniden hesap açabilir; o zaman tekrar eşleştirmeniz gerekir.','confirm-del-user',el.dataset.id,'Erişimi kaldır');},
  'confirm-del-user'(el){
    const uid=el.dataset.id;
    run(null,async()=>{
      const r=await sb.from('profiles').delete().eq('user_id',uid);
      if(r.error)throw r.error;
    },'Erişim kaldırıldı');
  },
  'show-signup'(){renderSignup();},
  'show-login'(){renderLogin();},
  signup(){doSignup();},
  'open-company'(){openCompany();},
  'save-company'(){saveCompany();},
  'open-dept'(el){openDept(el.dataset.id);},
  'save-dept'(){saveDept();},
  logout(){doLogout();},
  login(){doLogin();},
  'reload'(){reloadData();},
  close(){closeDlg();}
};
function defaultState(){
  return {view:ilkEkran(),period:defaultPeriod(),dim:'departman',kasa:{account:'all',q:'',dir:'all',cat:''},payMonth:TODAY.slice(0,7),assetType:'all',inv:{q:''},prod:{q:'',cat:''},stok:{q:'',wh:'',status:'',prod:''},sat:{group:'personel',q:'',emp:''},cust:{q:''},perAyrilan:false,den:{q:'',kul:'',tablo:'',islem:'',bas:'',bit:'',finans:false,yuklendi:false,hata:''},pot:{q:'',durum:'',emp:'',page:0,sekme:(me&&!isMudur()&&!telesatisMi())?'ekledigim':'bende'},rand:{status:'',emp:'',q:''},rep:{company:'',dept:'',emp:'',cat:'',group:'departman'}};
}

/* Tüm yazma eylemleri sunucuya bağlandı */
function isWriteAct(){return false;}

function init(){
  emptyDb();
  state=defaultState();
  document.addEventListener('click',e=>{
    const el=e.target.closest&&e.target.closest('[data-act]');if(!el)return;
    const act=el.dataset.act;
    const fn=actions[act];if(fn)fn(el,e);
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&e.target.matches&&e.target.matches('#lg-email,#lg-pass')){e.preventDefault();doLogin();return;}
    if(e.key==='Enter'&&e.target.matches&&e.target.matches('#sg-email,#sg-pass,#sg-pass2')){e.preventDefault();doSignup();return;}
    if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('tr.click')){e.preventDefault();const fn=actions[e.target.dataset.act];if(fn)fn(e.target);}
  });
  document.addEventListener('change',e=>{
    const el=e.target;
    if(el.dataset&&el.dataset.set){setPath(el.dataset.set,el.value);afterSet(el.dataset.set);render();return;}
    if(el.id&&dlgState.kind){
      if(el.id==='a-emp'){$('#a-open').textContent=money(openAdvance(el.value));return;}
      dialogChange(el);
    }
  });
  document.addEventListener('input',e=>{
    const el=e.target;
    if(el.id==='kq'){state.kasa.q=el.value;const box=$('#txlist');if(box)box.innerHTML=txTable();}
    else if(el.id==='sq'){state.stok.q=el.value;const box=$('#stoklist');if(box)box.innerHTML=stokTable();}
    else if(el.id&&el.id.endsWith('-serials')){const c=$('#'+el.id.replace('-serials','-count'));if(c)c.textContent=parseSerials(el.value).length+' seri no okundu';}
    else if(/^sls-/.test(el.id||'')){const k=el.id.slice(4);const c=$('#slsc-'+k);
      if(c)c.textContent=parseSerials(el.value).length+' seri no okundu';updateLinePreview(k);updateSaleTotals();}
    else if(/^slab-/.test(el.id||'')){const k=el.id.slice(5);const c=$('#slabc-'+k);
      if(c)c.textContent=parseSerials(el.value).length+' numara girildi';updateSaleTotals();}
    else if(/^slq-/.test(el.id||'')){updateLinePreview(el.id.slice(4));updateSaleTotals();}
    else if(/^sla-/.test(el.id||'')){updateLinePreview(el.id.slice(4));updateSaleTotals();}
    else if(el.id==='slq'){state.sat.q=el.value;const box=$('#satlist');if(box)box.innerHTML=satTable();}
    else if(el.id==='iq'){state.inv.q=el.value;const box=$('#invlist');if(box)box.innerHTML=invTable();}
    else if(el.id==='pq'){state.prod.q=el.value;const box=$('#prodlist');if(box)box.innerHTML=prodTable();}
    else if(el.id==='cq'){state.cust.q=el.value;const box=$('#custlist');if(box)box.innerHTML=custTable();}
    else if(el.id==='denq'){state.den.q=el.value;const box=$('#denlist');if(box)box.innerHTML=denetimTablo();}
    else if(el.id==='potq'){state.pot.q=el.value;state.pot.page=0;const box=$('#potlist');if(box)box.innerHTML=potTable();}
    else if(dlgState.kind==='lead'&&['l-unvan','l-tel','l-vkn','l-yetkili','l-adres'].indexOf(el.id)>=0){
      dlgState.leadConfirmed=false;leadBenzerYenile();}
    else if(el.id==='rq'){state.rand.q=el.value;const box=$('#randlist');if(box)box.innerHTML=apptTable();}
    else if((el.id==='c-unvan'||el.id==='c-tel'||el.id==='c-vkn'||el.id==='c-yetkili'||el.id==='c-adres')&&dlgState.kind==='cust'){
      dlgState.dupConfirmed=false;const b=$('#c-benzer');if(b)b.innerHTML='';}
    else if((el.id==='sl-cu'||el.id==='sl-ct')&&dlgState.kind==='sale'){dlgState.slDup=false;}
    else if((el.id==='ap-cu'||el.id==='ap-ct')&&dlgState.kind==='appt'){dlgState.apDup=false;}
    else if(el.id==='f-ded'&&dlgState.kind==='pay'){const v=clamp(parseFloat(el.value)||0,0,dlgState.maxDed);$('#f-net').textContent=money(dlgState.salary-v);}
  });
  const d=$('#dlg');
  d.addEventListener('click',e=>{if(e.target===d)closeDlg();});
  d.addEventListener('close',()=>{dlgState={};});
  boot();
}
init();
})();
</script>
</body>
</html>
